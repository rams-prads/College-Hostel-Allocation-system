<!-- Student portal. The explanation panel is the centrepiece. -->
<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>

<div id="chrome"></div>
<div class="wrap narrow" id="root"></div>

<script>
  var VIEW = null;
  el('root').innerHTML = loadingState('Loading your application');

  google.script.run.withSuccessHandler(render).withFailureHandler(function (e) {
    el('root').innerHTML = banner('err', 'Could not load your application: ' + e.message);
  }).apiGetStudentView();

  function render(v) {
    VIEW = v;

    if (!v.signedIn) {
      paintChrome({});
      el('root').innerHTML = card('', emptyState('&#128274;', 'Please sign in',
        'This portal identifies you by your Google account. Open this page while signed in.'));
      return;
    }

    paintChrome({
      unit: 'Hostel Allocation Portal',
      user: { name: v.name || v.email, role: v.viewingAs ? 'ADMIN VIEW' : null },
      tabs: [
        { label: 'My Application', href: '?', on: true },
        { label: v.application ? 'Edit Application' : 'Apply', href: '?page=apply' }
      ].concat(v.isAdmin ? [{ label: 'Administration', href: '?page=admin' }] : [])
    });

    if (v.unregistered) {
      el('root').innerHTML = card('', emptyState('&#128100;', 'No student record found',
        'The address ' + v.email + ' is not linked to a student record. ' +
        'Please contact the hostel office at ' + v.supportEmail + '.'));
      return;
    }

    var html = [];
    if (v.viewingAs) {
      html.push(banner('info', 'You are viewing this student’s portal as an administrator. ' +
        'This is exactly what they see.'));
    }
    html.push(timeline(v));

    if (!v.application) { html.push(noApplication(v)); el('root').innerHTML = html.join(''); return; }

    if (v.allocation)     html.push(allotmentHero(v));
    else if (v.waitlist)  html.push(waitlistHero(v));
    else                  html.push(pendingHero(v));

    if (v.explanation) html.push(explanationCard(v));
    if (v.allocation && v.allocation.roommates.length) html.push(roommateCard(v));

    html.push('<div class="cols">' + preferencesCard(v) + documentsCard(v) + '</div>');
    html.push('<div id="swapCard"></div>');
    html.push('<div id="grievCard"></div>');
    html.push(footNote(v));

    el('root').innerHTML = html.join('');
    loadSwaps();
    loadGrievances();
  }

  /* ---------------------------------------------------------- timeline */
  function timeline(v) {
    var st = v.application ? v.application.status : 'NONE';
    var flow = ['SUBMITTED', 'VERIFIED', 'ALLOTTED'];
    if (st === 'WAITLISTED') flow[2] = 'WAITLISTED';
    if (st === 'REJECTED')   flow = ['SUBMITTED', 'REJECTED'];
    if (st === 'DRAFT')      flow = ['DRAFT'].concat(flow);

    var at = flow.indexOf(st);
    var items = flow.map(function (s, i) {
      var cls = i < at ? 'done' : (i === at ? 'done now' : '');
      if (s === 'REJECTED' && i === at) cls = 'stop';
      return '<li class="' + cls + '">' + esc(label('status', s)) + '</li>';
    }).join('');
    return card('', '<ul class="steps">' + items + '</ul>');
  }

  /* ------------------------------------------------------------ heroes */
  function allotmentHero(v) {
    var a = v.allocation;
    var tags = [];
    tags.push('<span class="pill hi">' + (a.prefRankMet >= 1
      ? 'Preference ' + a.prefRankMet + ' granted' : 'Assigned beyond your choices') + '</span>');
    if (a.isAccessible) tags.push('<span class="pill">Accessible room</span>');
    tags.push('<span class="pill">' + esc(label('roomType', a.roomType)) + '</span>');

    return '<div class="hero"><div class="hero-grid">' +
      '<div class="main">' +
        '<div class="eyebrow">Your allotment</div>' +
        '<h1 class="big">Room ' + esc(a.roomNo) + '</h1>' +
        '<div class="where">' + esc(a.hostelName) + ' &middot; ' + esc(label('campus', a.campus)) + '</div>' +
        '<div class="tags">' + tags.join('') + '</div>' +
      '</div>' +
      '<dl>' +
        '<dt>Block</dt><dd>' + esc(a.block) + '</dd>' +
        '<dt>Floor</dt><dd>' + esc(a.floor) + '</dd>' +
        '<dt>Bed</dt><dd>' + esc(a.bedNo) + '</dd>' +
        '<dt>Warden</dt><dd>' + esc(a.warden) + '</dd>' +
        '<dt>Allotted</dt><dd>' + esc(a.allocatedAt) + '</dd>' +
      '</dl>' +
    '</div></div>';
  }

  function waitlistHero(v) {
    var w = v.waitlist;
    return '<div class="hero wait"><div class="hero-grid">' +
      '<div class="main">' +
        '<div class="eyebrow">Waiting list</div>' +
        '<h1 class="big">Position ' + esc(w.position) + '</h1>' +
        '<div class="where">Estimated chance of allotment if students withdraw: <strong>' +
          esc(w.etaPercent) + '%</strong></div>' +
        '<div class="tags"><span class="pill">Not yet allotted</span></div>' +
      '</div>' +
    '</div></div>';
  }

  function pendingHero(v) {
    var st = v.application.status;
    if (st === 'REJECTED') {
      return '<div class="hero stop"><div class="hero-grid"><div class="main">' +
        '<div class="eyebrow">Application outcome</div>' +
        '<h1 class="big" style="font-size:30px">Not eligible</h1>' +
        '<div class="where">The reasons are set out below. If you believe this is a ' +
        'mistake you can raise a grievance.</div>' +
      '</div></div></div>';
    }
    return '<div class="hero"><div class="hero-grid"><div class="main">' +
      '<div class="eyebrow">Application status</div>' +
      '<h1 class="big" style="font-size:30px">' + esc(label('status', st)) + '</h1>' +
      '<div class="where">Room allocation has not run yet. You will be emailed as soon ' +
      'as results are published.</div>' +
    '</div></div></div>';
  }

  /* ------------------------------------------- the "why" panel */
  function explanationCard(v) {
    var x = v.explanation;
    var groups = x.groups.map(function (g) {
      var items = g.items.map(function (it) {
        return '<li class="' + (it.ok ? 'yes' : 'no') + '">' +
          '<span class="mk">' + (it.ok ? '&#10003;' : '&#10007;') + '</span>' +
          '<span>' + esc(it.text) + '</span></li>';
      }).join('');
      return '<div class="grp"><div class="grp-title">' + esc(g.title) + '</div>' +
             '<ul class="reasons">' + items + '</ul></div>';
    }).join('');

    var body =
      '<div class="why-head"><div class="ic">?</div><div>' +
        '<div class="t">' + esc(x.headline) + '</div>' +
        '<div class="s">Recorded by the allocation engine as it ran, not written afterwards.</div>' +
      '</div></div>' + groups +
      (x.meritDetail ? scoreBars(x.meritDetail) : '');

    return card('Why you got this result', body);
  }

  function scoreBars(d) {
    if (!d || !d.breakdown) return '';
    var names = {
      merit: 'Academic merit', distance: 'Distance from home',
      year: 'Year of study', special: 'Special requirement'
    };
    var rows = Object.keys(names).map(function (k) {
      var b = d.breakdown[k];
      if (!b) return '';
      return '<div class="bar-row">' +
        '<span class="lbl">' + esc(names[k]) + '</span>' +
        '<span class="bar"><i style="width:' + Math.round(b.value * 100) + '%"></i></span>' +
        '<span class="num">' + (b.value * b.weight).toFixed(3) + '</span></div>';
    }).join('');
    return '<div class="divider"></div>' +
      '<div class="grp-title">How your score was calculated</div>' +
      '<div class="bars">' + rows + '</div>' +
      '<p class="small muted" style="margin:10px 0 0">Each bar shows how you scored on that ' +
      'factor. The figure beside it is that score multiplied by the weight hostel policy ' +
      'gives the factor. The four add up to your overall score.</p>';
  }

  /* -------------------------------------------------------- roommates */
  function roommateCard(v) {
    var mates = v.allocation.roommates.map(function (m) {
      var s = m.strengths.length
        ? 'Matched on ' + m.strengths.join(' and ')
        : 'Sharing this room with you';
      return '<li>' +
        '<span class="av">' + esc(initials(m.name)) + '</span>' +
        '<span class="body"><span class="n">' + esc(m.name) + '</span>' +
        '<span class="d">' + esc(m.programme) + (m.year ? ', year ' + esc(m.year) : '') +
        ' &middot; ' + esc(s) + '</span></span>' +
        (m.compatPercent != null
          ? pill(m.compatPercent >= 70 ? 'ok' : 'warn', m.compatPercent + '% match') : '') +
        '</li>';
    }).join('');

    return card('Your roommates', '<ul class="rows">' + mates + '</ul>' +
      '<div class="bd" style="padding-top:0"><p class="small muted" style="margin:0">' +
      'Roommates were matched on your lifestyle answers among everyone allotted the same ' +
      'room type. This never affected which room you were given.</p></div>',
      { tight: true });
  }

  /* ------------------------------------------------------ preferences */
  function preferencesCard(v) {
    if (!v.preferences || !v.preferences.length) return '';
    var rows = v.preferences.map(function (p) {
      var got = v.allocation && v.allocation.prefRankMet === p.rank;
      return '<li>' +
        '<span class="idx' + (got ? ' amber' : '') + '">' + esc(p.rank) + '</span>' +
        '<span class="body"><span class="n">' + esc(p.hostelName) + '</span>' +
        '<span class="d">' + esc(label('campus', p.campus)) + ' &middot; ' +
        esc(label('roomType', p.roomType)) + '</span></span>' +
        (got ? pill('ok', 'Granted') : '') + '</li>';
    }).join('');
    return card('Your room preferences', '<ul class="rows">' + rows + '</ul>', { tight: true });
  }

  /* -------------------------------------------------------- documents */
  function documentsCard(v) {
    if (!v.documents || !v.documents.length) return '';
    var rows = v.documents.map(function (d) {
      var kind = { VERIFIED:'ok', UPLOADED:'info', REJECTED:'bad',
                   WAIVED:'ok', REQUIRED:'warn' }[d.status] || 'warn';
      return '<li>' +
        '<span class="body"><span class="n">' + esc(d.label) + '</span>' +
        '<span class="d">' + esc(d.hint) + '</span>' +
        '<span class="why">' + esc(d.why) + '</span>' +
        (d.note ? '<span class="d" style="color:var(--bad)">' + esc(d.note) + '</span>' : '') +
        '</span>' + pill(kind, label('doc', d.status)) + '</li>';
    }).join('');
    return card('Documents required of you', '<ul class="rows">' + rows + '</ul>', { tight: true });
  }

  function noApplication(v) {
    if (!v.applicationsOpen) {
      return card('', emptyState('&#128197;', 'Applications are closed',
        'The hostel application window is not currently open.'));
    }
    return card('', '<div class="empty"><div class="big">&#127968;</div>' +
      '<h3 style="margin:0 0 5px">You have not applied yet</h3>' +
      '<p class="small" style="max-width:420px;display:inline-block;margin:0 0 16px">' +
      'Submit an application to be considered in this year’s hostel allocation.</p><br>' +
      '<a class="btn" href="?page=apply">Start my application</a></div>');
  }

  function footNote(v) {
    var canEdit = ['DRAFT','SUBMITTED','VERIFIED'].indexOf(v.application.status) >= 0;
    return '<div class="foot-note">' +
      '<span>Application reference <strong>' + esc(v.application.appId) + '</strong>' +
      (v.application.submittedAt ? ' &middot; submitted ' + esc(v.application.submittedAt) : '') +
      '</span>' +
      '<span>' + (canEdit
        ? '<a href="?page=apply">Edit my application</a> &middot; ' : '') +
        'Queries: ' + esc(v.supportEmail) + '</span></div>';
  }

  /* ==================================================== swap marketplace */
  function loadSwaps() {
    if (!VIEW.allocation) { el('swapCard').innerHTML = ''; return; }
    el('swapCard').innerHTML = card('Room swap', loadingState('Checking the swap board'));
    google.script.run.withSuccessHandler(paintSwaps)
      .withFailureHandler(function () { el('swapCard').innerHTML = ''; }).apiGetSwapView();
  }

  function paintSwaps(s) {
    if (!s.allotted) { el('swapCard').innerHTML = ''; return; }
    var body;

    if (!s.myRequest) {
      body = '<p class="small muted" style="margin:0 0 14px">Put your room on the swap board ' +
        'and you will be shown students who want to move the other way. A swap you both agree ' +
        'to is applied straight away if it meets hostel rules — there is no approval queue.</p>' +
        '<label class="field"><span class="lab">Why would you like to move? (optional)</span>' +
        '<input type="text" id="swapReason" placeholder="e.g. closer to my department"></label>' +
        '<div class="btn-row"><button class="btn" onclick="postSwap()">Put my room on the board</button>' +
        '<span class="small muted">' + esc(s.boardSize) + ' room' +
        (s.boardSize === 1 ? '' : 's') + ' currently listed</span></div>';
    } else {
      var matches = s.matches.length
        ? '<ul class="rows">' + s.matches.map(function (m) {
            return '<li><span class="av">' + esc(initials(m.name)) + '</span>' +
              '<span class="body"><span class="n">' + esc(m.hostelName) + ' &middot; Room ' +
                esc(m.roomNo) + '</span><span class="d">' + esc(m.name) + ' &middot; ' +
                esc(m.programme) + (m.reason ? ' &middot; “' + esc(m.reason) + '”' : '') +
              '</span></span>' +
              (m.compatibility != null
                ? pill(m.compatibility >= 70 ? 'ok' : 'warn', m.compatibility + '% fit') : '') +
              '<button class="btn sm" onclick="acceptSwap(&quot;' + esc(m.reqId) +
                '&quot;)">Swap</button></li>';
          }).join('') + '</ul>'
        : '<p class="small muted" style="margin:0">No matching rooms yet. Options will appear ' +
          'here as other students list theirs.</p>';

      body = banner('info', 'Your room is listed. Only swaps that already meet hostel rules ' +
        'are shown, so anything here will go through.') + matches +
        '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn ghost" onclick="cancelSwap(&quot;' + esc(s.myRequest.reqId) +
        '&quot;)">Remove my listing</button></div>';
    }

    el('swapCard').innerHTML = card('Room swap', '<div id="swapMsg"></div>' + body);
  }

  function postSwap() {
    var reason = (el('swapReason') || {}).value || '';
    google.script.run.withSuccessHandler(loadSwaps)
      .withFailureHandler(function (e) { swapErr(e.message); })
      .apiPostSwap({ reason: reason });
  }

  function acceptSwap(reqId) {
    if (!confirm('Swap rooms with this student? Both allotment letters will be reissued.')) return;
    el('swapMsg').innerHTML = banner('info', 'Checking hostel rules and applying…');
    google.script.run
      .withSuccessHandler(function (r) {
        if (r.ok) window.top.location.reload(); else swapErr(r.message);
      })
      .withFailureHandler(function (e) { swapErr(e.message); })
      .apiAcceptSwap(reqId);
  }

  function cancelSwap(reqId) {
    google.script.run.withSuccessHandler(loadSwaps)
      .withFailureHandler(function (e) { swapErr(e.message); }).apiCancelSwap(reqId);
  }

  function swapErr(msg) { el('swapMsg').innerHTML = banner('err', msg); }

  /* ========================================================== grievances */
  function loadGrievances() {
    google.script.run.withSuccessHandler(paintGrievances)
      .withFailureHandler(function () { el('grievCard').innerHTML = ''; }).apiGetGrievances();
  }

  function paintGrievances(list) {
    var tickets = (list || []).map(function (g) {
      var kind = { AUTO_ANSWERED:'ok', RESOLVED:'ok', ESCALATED:'warn',
                   OPEN:'info', CLOSED:'ok' }[g.status] || 'info';
      return '<li style="display:block">' +
        '<div style="display:flex;gap:11px;align-items:flex-start">' +
          '<span class="body"><span class="n">' + esc(g.headline || g.category) + '</span>' +
          '<span class="d">You wrote: “' + esc(g.text) + '”</span></span>' +
          pill(kind, label('grievance', g.status)) + '</div>' +
        (g.body ? '<div class="why-head" style="margin:12px 0 0;background:var(--surface-2);' +
          'border-color:var(--border)"><div style="font-size:13.5px">' + esc(g.body) +
          '</div></div>' : '') +
        (g.findings && g.findings.length
          ? '<ul class="reasons" style="margin-top:9px">' + g.findings.map(function (f) {
              return '<li class="' + (f.ok ? 'yes' : 'no') + '"><span class="mk">' +
                (f.ok ? '&#10003;' : '&#10007;') + '</span><span>' + esc(f.text) + '</span></li>';
            }).join('') + '</ul>' : '') +
        '</li>';
    }).join('');

    var body =
      (tickets ? '<ul class="rows" style="margin:-18px -18px 0">' + tickets + '</ul><div class="divider"></div>'
               : '') +
      '<label class="field"><span class="lab">' +
      (tickets ? 'Raise another grievance' : 'Raise a grievance') + '</span>' +
      '<textarea id="grievText" rows="3" ' +
      'placeholder="Describe the problem in a sentence or two."></textarea>' +
      '<span class="help">Questions about your allocation are re-checked against the recorded ' +
      'run automatically, and usually answered within seconds.</span></label>' +
      '<div class="btn-row"><button class="btn" onclick="raiseGrievance()">Submit</button></div>';

    el('grievCard').innerHTML = card('Grievances', '<div id="grievMsg"></div>' + body);
  }

  function raiseGrievance() {
    var text = (el('grievText') || {}).value || '';
    el('grievMsg').innerHTML = banner('info', 'Checking your case against the recorded run…');
    google.script.run.withSuccessHandler(loadGrievances)
      .withFailureHandler(function (e) {
        el('grievMsg').innerHTML = banner('err', e.message);
      }).apiRaiseGrievance(text);
  }
</script>
