<!-- Application form. Drag-to-rank preferences are the reason this is a custom
     page rather than a Google Form - Forms cannot express an ordered list. -->
<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL = '<?= webAppUrl() ?>';
</script>

<div id="chrome"></div>
<div class="wrap narrow" id="root"></div>

<script>
  var FORM = null;
  var chosen = [];          // ordered array of "hostelId|roomType" keys
  var lifestyle = {};
  var campusPref = 'ANY';
  var needsAccessible = false;

  el('root').innerHTML = loadingState('Loading the application form');

  google.script.run.withSuccessHandler(boot).withFailureHandler(function (e) {
    el('root').innerHTML = banner('err', e.message);
  }).apiGetApplyForm();

  function boot(f) {
    FORM = f;
    paintChrome({
      unit: 'Hostel Application',
      user: f.student ? { name: f.student.name } : null,
      tabs: [
        { label: 'My Application', href: '?' },
        { label: 'Application Form', href: '?page=apply', on: true }
      ]
    });

    if (!f.signedIn) {
      el('root').innerHTML = card('', emptyState('&#128274;', 'Please sign in',
        'Open this page while signed in to your Google account.')); return;
    }
    if (f.unregistered) {
      el('root').innerHTML = card('', emptyState('&#128100;', 'No student record found',
        'Your account is not linked to a student record.')); return;
    }
    if (!f.applicationsOpen) {
      el('root').innerHTML = card('', emptyState('&#128197;', 'Applications are closed',
        'The hostel application window is not currently open.')); return;
    }

    if (f.draft) {
      chosen = (f.draft.preferences || []).slice();
      campusPref = f.draft.campusPref || 'ANY';
      needsAccessible = !!f.draft.needsAccessible;
      lifestyle = f.draft.lifestyle || {};
    }
    if (!lifestyle.cleanliness) lifestyle.cleanliness = 3;
    if (!lifestyle.sociability) lifestyle.sociability = 3;

    el('root').innerHTML = shell(f);
    paintCampus(); paintOptions(); paintChosen(); paintLifestyle();
  }

  function shell(f) {
    var s = f.student;
    return '<div id="msg"></div>' +

      card('Your details',
        '<dl class="kv" style="gap:7px 20px;font-size:13.5px">' +
          '<dt>Name</dt><dd>' + esc(s.name) + '</dd>' +
          '<dt>Enrolment number</dt><dd>' + esc(s.enrollmentNo) + '</dd>' +
          '<dt>Programme</dt><dd>' + esc(s.programme) + ' ' + esc(s.branch) +
            ', year ' + esc(s.year) + '</dd>' +
          '<dt>Category</dt><dd>' + esc(label('category', s.category, s.category)) +
            (s.isPwD ? ' &middot; Person with Disability' : '') + '</dd>' +
          '<dt>Home PIN code</dt><dd>' + esc(s.homePincode) + ' (' + esc(s.homeState) + ')</dd>' +
        '</dl>' +
        '<p class="small muted" style="margin:13px 0 0">These come from the university registry. ' +
        'Contact the hostel office if anything is wrong &mdash; they affect both your eligibility ' +
        'and your position in the merit order.</p>') +

      card('Campus preference',
        '<div class="seg" id="campus"></div>' +
        '<p class="small muted" style="margin:11px 0 0">Dwarka and East Delhi are allocated from ' +
        'a single merit list, so this only orders your room choices &mdash; it does not restrict ' +
        'where you can be placed.</p>') +

      card('Room preferences',
        '<p class="small muted" style="margin:0 0 14px">Choose up to ' + esc(f.maxPreferences) +
        ' options, then put them in order. Your first choice goes at the top.</p>' +
        '<div id="chosenWrap"></div>' +
        '<div class="divider"></div>' +
        '<div class="grp-title">Available options</div>' +
        '<div id="options"></div>') +

      card('Accessibility',
        '<label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer">' +
          '<input type="checkbox" id="acc" ' + (needsAccessible ? 'checked' : '') +
            ' style="width:auto;margin-top:3px" onchange="needsAccessible=this.checked">' +
          '<span><span style="font-weight:600;font-size:14px">I need an accessible room</span>' +
          '<span class="help">Ground floor, step-free access and an adapted washroom. ' +
          'A disability certificate is required at verification.</span></span></label>') +

      card('Roommate questionnaire',
        '<p class="small muted" style="margin:0 0 16px">Used only to pair you with compatible ' +
        'roommates within the room type you are allotted. It never affects which room you get.</p>' +
        '<div id="life"></div>') +

      card('Documents you will need',
        '<ul class="rows" style="margin:-18px -18px 0">' + f.documents.map(function (d) {
          return '<li><span class="body"><span class="n">' + esc(d.label) + '</span>' +
            '<span class="d">' + esc(d.hint) + '</span>' +
            '<span class="why">' + esc(d.why) + '</span></span></li>';
        }).join('') + '</ul>' +
        '<p class="small muted" style="margin:16px 0 0">Upload happens after you submit. This list ' +
        'is built from your own registry record, so you are never asked for a certificate that ' +
        'does not apply to you.</p>') +

      card('', '<div class="btn-row">' +
        '<button class="btn" id="submitBtn" onclick="save(true)">Submit application</button>' +
        '<button class="btn ghost" onclick="save(false)">Save as draft</button>' +
        '<span class="small muted">You can edit this until results are published.</span>' +
      '</div>');
  }

  /* ------------------------------------------------------------- campus */
  function paintCampus() {
    var opts = [['ANY','No preference'], ['DWARKA','Dwarka'], ['EDC','East Delhi']];
    el('campus').innerHTML = opts.map(function (o) {
      return '<button type="button" aria-pressed="' + (campusPref === o[0]) +
        '" onclick="setCampus(\'' + o[0] + '\')">' + esc(o[1]) + '</button>';
    }).join('');
  }
  function setCampus(v) { campusPref = v; paintCampus(); paintOptions(); }

  /* ------------------------------------------------------------ options */
  function paintOptions() {
    var avail = FORM.options.filter(function (o) { return chosen.indexOf(o.key) < 0; });
    if (campusPref !== 'ANY') {
      avail.sort(function (a, b) {
        return (b.campus === campusPref) - (a.campus === campusPref);
      });
    }
    var full = chosen.length >= FORM.maxPreferences;
    el('options').innerHTML = avail.length
      ? '<ul class="rows" style="margin:0 -18px -18px">' + avail.map(function (o) {
          return '<li><span class="body"><span class="n">' + esc(o.hostelName) + '</span>' +
            '<span class="d">' + esc(label('campus', o.campus)) + ' &middot; ' +
            esc(o.roomTypeLabel) + ' &middot; ' + esc(o.rooms) + ' rooms</span></span>' +
            '<button class="btn ghost sm" ' + (full ? 'disabled' : '') +
            ' onclick="addPref(\'' + o.key + '\')">Add</button></li>';
        }).join('') + '</ul>'
      : '<p class="muted small" style="margin:0">All available options are in your list.</p>';
  }

  function addPref(key) {
    if (chosen.length >= FORM.maxPreferences) return;
    if (chosen.indexOf(key) >= 0) return;
    chosen.push(key);
    paintChosen(); paintOptions();
  }
  function removePref(key) {
    chosen = chosen.filter(function (k) { return k !== key; });
    paintChosen(); paintOptions();
  }
  function movePref(from, to) {
    if (to < 0 || to >= chosen.length) return;
    var item = chosen.splice(from, 1)[0];
    chosen.splice(to, 0, item);
    paintChosen();
  }

  function paintChosen() {
    if (!chosen.length) {
      el('chosenWrap').innerHTML =
        '<p class="muted small" style="margin:0">Nothing chosen yet. Add options from the list ' +
        'below, then drag them into the order you want.</p>';
      return;
    }
    var byKey = {};
    FORM.options.forEach(function (o) { byKey[o.key] = o; });

    var items = chosen.map(function (key, i) {
      var o = byKey[key];
      if (!o) return '';
      return '<li draggable="true" data-i="' + i + '">' +
        '<span class="idx amber">' + (i + 1) + '</span>' +
        '<span class="body"><span class="n">' + esc(o.hostelName) + '</span>' +
        '<span class="d">' + esc(label('campus', o.campus)) + ' &middot; ' +
          esc(o.roomTypeLabel) + '</span></span>' +
        '<button class="btn ghost sm" onclick="movePref(' + i + ',' + (i - 1) + ')" ' +
          (i === 0 ? 'disabled' : '') + ' aria-label="Move up">&uarr;</button>' +
        '<button class="btn ghost sm" onclick="movePref(' + i + ',' + (i + 1) + ')" ' +
          (i === chosen.length - 1 ? 'disabled' : '') + ' aria-label="Move down">&darr;</button>' +
        '<button class="btn ghost sm" onclick="removePref(\'' + key + '\')" ' +
          'aria-label="Remove">&times;</button>' +
        '</li>';
    }).join('');

    el('chosenWrap').innerHTML = '<ul class="rows" id="chosenList" ' +
      'style="border:1px solid var(--border);border-radius:var(--r)">' + items + '</ul>';
    wireDrag();
  }

  /* Drag to reorder. Arrow buttons above do the same job for keyboard and
     touch users, so dragging is an enhancement rather than the only route. */
  function wireDrag() {
    var list = el('chosenList');
    if (!list) return;
    var dragFrom = null;
    Array.prototype.forEach.call(list.children, function (li) {
      li.addEventListener('dragstart', function () {
        dragFrom = Number(li.dataset.i); li.classList.add('drag');
      });
      li.addEventListener('dragend', function () { li.classList.remove('drag'); });
      li.addEventListener('dragover', function (e) { e.preventDefault(); li.classList.add('over'); });
      li.addEventListener('dragleave', function () { li.classList.remove('over'); });
      li.addEventListener('drop', function (e) {
        e.preventDefault(); li.classList.remove('over');
        var to = Number(li.dataset.i);
        if (dragFrom !== null && dragFrom !== to) movePref(dragFrom, to);
        dragFrom = null;
      });
    });
  }

  /* ---------------------------------------------------------- lifestyle */
  function paintLifestyle() {
    var seg = function (field, opts) {
      return '<label class="field"><span class="lab">' + esc(opts.label) + '</span>' +
        '<div class="seg">' + opts.values.map(function (v) {
          return '<button type="button" aria-pressed="' + (lifestyle[field] === v[0]) +
            '" onclick="setLife(\'' + field + '\',\'' + v[0] + '\')">' + esc(v[1]) + '</button>';
        }).join('') + '</div>' +
        (opts.help ? '<span class="help">' + esc(opts.help) + '</span>' : '') + '</label>';
    };
    var scale = function (field, label, lo, hi) {
      var btns = [1,2,3,4,5].map(function (n) {
        return '<button type="button" aria-pressed="' + (Number(lifestyle[field]) === n) +
          '" onclick="setLife(\'' + field + '\',' + n + ')">' + n + '</button>';
      }).join('');
      return '<label class="field"><span class="lab">' + esc(label) + '</span>' +
        '<div class="scale">' + btns + '</div>' +
        '<span class="help">1 = ' + esc(lo) + ', 5 = ' + esc(hi) + '</span></label>';
    };

    el('life').innerHTML =
      '<div class="row2">' +
        seg('sleepTime', { label: 'When do you usually sleep?', values:
          [['EARLY','Before 11pm'], ['MODERATE','11pm–1am'], ['LATE','After 1am']] }) +
        seg('wakeTime', { label: 'When do you usually wake?', values:
          [['EARLY','Before 7am'], ['MODERATE','7–9am'], ['LATE','After 9am']] }) +
      '</div>' +
      seg('studyStyle', { label: 'How do you prefer to study in your room?', values:
        [['QUIET','Silence'], ['MUSIC','With music'], ['GROUP','With others']] }) +
      '<div class="row2">' +
        scale('cleanliness', 'How tidy do you keep your space?', 'relaxed', 'very tidy') +
        scale('sociability', 'How social are you in the room?', 'keep to myself', 'very social') +
      '</div>' +
      '<div class="row2">' +
        seg('foodPref', { label: 'Food preference', values:
          [['VEG','Vegetarian'], ['EGG','Eggetarian'], ['NONVEG','Non-vegetarian']] }) +
        seg('guestsFrequency', { label: 'How often do you have visitors?', values:
          [['NEVER','Rarely'], ['SOMETIMES','Sometimes'], ['OFTEN','Often']] }) +
      '</div>' +
      '<div class="row2">' +
        '<label class="field"><span class="lab">Language you are most comfortable in</span>' +
        '<input type="text" id="lang" value="' + esc(lifestyle.language || '') +
        '" oninput="lifestyle.language=this.value" placeholder="e.g. Hindi">' +
        '<span class="help">A mild pairing bonus only. Rooms are never grouped by region.</span></label>' +
        seg('smokingTolerance', { label: 'Would you share with someone who smokes?', values:
          [[true,'Yes'], [false,'No']] }) +
      '</div>';
  }

  function setLife(field, value) {
    if (value === 'true') value = true;
    if (value === 'false') value = false;
    lifestyle[field] = value;
    paintLifestyle();
  }

  /* --------------------------------------------------------------- save */
  function save(submit) {
    var btn = el('submitBtn');
    btn.disabled = true;
    if (submit) btn.innerHTML = '<span class="spin"></span> Submitting';

    google.script.run
      .withSuccessHandler(function (res) {
        if (submit) { window.top.location.href = window.top.location.pathname; return; }
        btn.disabled = false; btn.textContent = 'Submit application';
        say('good', 'Draft saved. You can come back and finish it later.');
      })
      .withFailureHandler(function (e) {
        btn.disabled = false; btn.textContent = 'Submit application';
        say('err', e.message);
      })
      .apiSaveApplication({
        campusPref: campusPref,
        needsAccessible: needsAccessible,
        preferences: chosen,
        lifestyle: lifestyle,
        submit: !!submit
      });
  }

  function say(kind, text) {
    el('msg').innerHTML = banner(kind, text);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
