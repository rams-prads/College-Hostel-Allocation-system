<!-- Application form. A stepped wizard: one page asking for twenty-odd things
     reads as a wall and gets abandoned halfway. -->
<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app runs inside a sandboxed iframe on a different origin, so relative
  // links would navigate that frame to the wrong place.
  var WEBAPP_URL    = '<?= webAppUrl() ?>';
  var LOGO_URL      = '<?= logoUrl() ?>';
  var SUPPORT_EMAIL = '<?= supportEmail() ?>';
</script>

<style>
  /* The progress rail.
     Seven equal chips told you what the steps were called and almost nothing
     about where you were in them - at a glance the current one looked much
     like the other six, and on a phone they wrapped into three ragged rows.
     What a long form owes the person filling it in is a straight answer to
     "how much of this is left", so that is what leads now: a bar, a count, and
     the name of the step you are on. */
  .wizhead{margin:0 0 4px}
  .wizhead .top{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px;
  }
  .wizhead .stepname{
    font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;
  }
  .wizhead .count{
    font-size:12px;font-weight:650;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .wizhead .left{margin-left:auto;font-size:12px;color:var(--muted)}
  .wizbar{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  .wizbar i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--amber),var(--amber-600));
    transition:width .28s ease;
  }

  .wiz{
    display:flex;gap:4px;list-style:none;margin:13px 0 0;padding:0;
    flex-wrap:wrap;align-items:stretch;
  }
  .wiz li{
    flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;
    padding:7px 9px;border-radius:var(--r-sm);border:1px solid transparent;
    font-size:12px;color:var(--muted);font-weight:550;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .wiz li:hover{background:var(--surface-2)}
  .wiz li .num{
    flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--surface-3);color:var(--muted);font-size:11px;font-weight:700;
    border:1px solid var(--border);
  }
  .wiz li.done{color:var(--text-2)}
  .wiz li.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
  .wiz li.now{
    color:var(--navy-900);background:var(--amber-soft);border-color:var(--amber-line);
    font-weight:700;
  }
  .wiz li.now .num{background:var(--amber);border-color:var(--amber);color:var(--navy-900)}
  /* Under 700px the labels are dropped rather than wrapped: the bar and the
     count above already say where you are, and seven names on three lines was
     the part that made this look long before it had been started. */
  @media (max-width:700px){
    .wiz li{flex:0 0 auto;padding:5px;gap:0}
    .wiz li .lbl{display:none}
  }

  /* "What happens next": three numbered beats, not three bullets. The last
     screen of a long form should say that the effort is nearly over and what
     it buys, so it is given the weight of a list somebody reads. */
  .next{list-style:none;counter-reset:n;margin:0;padding:0;display:grid;gap:13px}
  .next li{
    counter-increment:n;position:relative;padding-left:34px;
    font-size:13.5px;color:var(--text-2);line-height:1.55;
  }
  .next li:before{
    content:counter(n);position:absolute;left:0;top:0;
    width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
    background:var(--navy-700);color:#fff;font-size:11.5px;font-weight:700;
  }
  .next strong{color:var(--text);font-weight:650}

  /* One sentence at the top of a step, saying why it is being asked. */
  .steplead{
    margin:-2px 0 16px;font-size:13.5px;color:var(--text-2);line-height:1.55;
    max-width:62ch;
  }
  .req{color:var(--bad);font-weight:700}
  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:640px){.fieldrow{grid-template-columns:1fr}}
  .hint{
    font-size:12.5px;padding:9px 12px;border-radius:var(--r-sm);margin-top:6px;
    background:var(--info-soft);color:var(--info);border:1px solid var(--info-line);
  }
  .hint.good{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .hint.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .review dd{margin:0 0 7px;font-weight:600}
</style>

<div id="chrome"></div>
<div class="wrap narrow" id="root"></div>

<script>
  // FULL: this form is showing the declared details, not only the room choices.
  // True while registering, and true again for any application the office has
  // not finished checking - the same form, so there is only one of it.
  var FORM = null, REG = null, STEPS = [], step = 0, pinInfo = null, FULL = false;
  loadToken();

  var reg = {
    name:'', enrollmentNo:'', phone:'', dob:'', gender:'',
    programme:'', branch:'', campus:'', year:'',
    meritPercent:'', residenceCategory:'', parentTransferred:false,
    category:'', isPwD:false, pwdType:'',
    homeAddress:'', homeCity:'', homePincode:'', homeState:'',
    guardianName:'', guardianPhone:'', guardianEmail:'',
    bloodGroup:'', medicalNotes:''
  };
  var chosen = [], lifestyle = {}, needsAccessible = false;
  // Options are keyed by the gender + campus they were fetched for, so a change
  // on the Course step invalidates a stale list instead of silently keeping it.
  var optionsFor = '';

  setHtml('root', loadingState('Loading the application form'));

  srv().withSuccessHandler(boot).withFailureHandler(function (e) {
    setHtml('root', banner('err', e.message));
  }).apiGetApplyForm();

  function onSignedOut() {
    paintChrome({ unit: 'Hostel Application' });
    setHtml('root', signInPanel());
  }

  /** Called by the shared sign-in panel once a session exists. */
  function onSignedIn() {
    setHtml('root', loadingState('Loading the application form'));
    step = 0;
    srv().withSuccessHandler(boot)
      .withFailureHandler(function (e) { setHtml('root', banner('err', e.message)); })
      .apiGetApplyForm();
  }

  function boot(f) {
    // A response that could not be encoded arrives as null rather than as an
    // error - see jsonSafe_() for why that happens and what now prevents it.
    // The guard stays because a page reading fields off nothing is how that
    // fault got reported as a TypeError about an unrelated field.
    if (!f) {
      setHtml('root', banner('err', 'The application form could not be loaded. ' +
        'Please try again; if it keeps happening, tell the hostel office.'));
      return;
    }
    FORM = f;

    // Same rule as the portal: an administrator has no application to fill in,
    // and landing on this form as one is a wrong turn, not a feature.
    if (f.isAdmin && f.signedIn) {
      setHtml('root', loadingState('Opening the administration dashboard'));
      reloadTop('?page=admin');
      return;
    }
    paintChrome({
      unit: 'Hostel Application',
      user: f.student ? { name: f.student.name } : (f.email ? { name: f.email } : null),
      tabs: [
        { label: 'My Application', href: '?' },
        { label: 'Application Form', href: '?page=apply', on: true }
      ]
    });

    if (!f.signedIn) {
      saveToken(null);
      setHtml('root', signInPanel());
      return;
    }
    if (!f.applicationsOpen) {
      setHtml('root', card('', emptyState('calendar', 'Applications are closed',
        'The hostel application window is not currently open.')));
      return;
    }

    // An application the office has finished with is not a form any more.
    // Rendering one that the server will refuse to save is how a student ends
    // up typing a correction twice and losing it twice.
    if (f.draft && f.editable === false) {
      setHtml('root', card('', emptyState('lock', 'Your application is now fixed', f.lockReason)) +
        card('', '<div style="text-align:center"><a class="btn" href="' + appUrl('?') +
             '" target="_top">Back to my application</a></div>'));
      return;
    }

    REG = f.registration;

    // Everything a student declared is theirs to correct until the office has
    // finished checking it, so an editable application renders the SAME form
    // that captured it. A cut-down version that could only reach the room
    // choices is exactly what left people unable to fix a typed PIN code.
    FULL = f.needsRegistration || (!!f.student && f.editable !== false);

    STEPS = FULL
      ? ['Your details', 'Course', 'Home address', 'Family', 'Preferences',
         'Roommate', 'Review']
      : ['Preferences', 'Roommate', 'Review'];

    if (f.student) prefillFrom(f.student);
    if (f.draft) {
      chosen = (f.draft.preferences || []).slice();
      needsAccessible = !!f.draft.needsAccessible;
      lifestyle = f.draft.lifestyle || {};
    }
    if (!lifestyle.cleanliness) lifestyle.cleanliness = 3;
    if (!lifestyle.sociability) lifestyle.sociability = 3;

    paint();
  }

  /** Load the record into the form, so an edit starts from what we hold. */
  function prefillFrom(st) {
    Object.keys(reg).forEach(function (k) {
      if (st[k] === undefined || st[k] === null || st[k] === '') return;
      reg[k] = (typeof st[k] === 'boolean') ? st[k] : String(st[k]);
    });
    reg.parentTransferred = !!st.parentTransferred;
    reg.isPwD = !!st.isPwD;
  }

  /**
   * Where you are, and how much is left.
   *
   * The bar answers that in one glance without reading anything; the numbered
   * rail underneath is still there to jump between steps, but it is no longer
   * the only thing carrying the answer.
   */
  function progressRail() {
    var pct = Math.round((step / (STEPS.length - 1)) * 100);
    var left = STEPS.length - 1 - step;

    return '<div class="wizhead">' +
      '<div class="top">' +
        '<span class="stepname">' + esc(STEPS[step]) + '</span>' +
        '<span class="count">Step ' + (step + 1) + ' of ' + STEPS.length + '</span>' +
        '<span class="left">' + (left === 0
          ? 'Last one &mdash; check it over and submit'
          : left + ' step' + (left === 1 ? '' : 's') + ' to go') + '</span>' +
      '</div>' +
      '<div class="wizbar"><i style="width:' + pct + '%"></i></div>' +
      '<ul class="wiz">' + STEPS.map(function (s, i) {
        return '<li class="' + (i < step ? 'done' : (i === step ? 'now' : '')) +
          '" onclick="goStep(' + i + ')" title="' + esc(s) + '"><span class="num">' +
          (i < step ? '&#10003;' : (i + 1)) + '</span>' +
          '<span class="lbl">' + esc(s) + '</span></li>';
      }).join('') + '</ul>' +
    '</div>';
  }

  /* ================================================================ shell */
  function paint() {
    var editing = FULL && !FORM.needsRegistration;
    var head = FORM.needsRegistration
      ? banner('info', 'We have no record for ' + FORM.email + ' yet, so this form registers ' +
                       'you and applies for a hostel place in one go.')
      : (editing
          ? banner('info', 'Everything you told us is here and can be changed \u2014 your ' +
                   'details, your room choices, the roommate answers. Nothing is saved until ' +
                   'you submit at the end, and you can keep correcting it until the hostel ' +
                   'office has checked your documents.')
          : '');

    setHtml('root', '<div id="msg"></div>' + head +
      card('', progressRail()) +
      '<div id="stepBody"></div>' +
      card('', '<div class="btn-row">' +
        (step > 0 ? '<button class="btn ghost" onclick="goStep(' + (step - 1) +
                    ')">Back</button>' : '') +
        (step < STEPS.length - 1
          ? '<button class="btn" onclick="goStep(' + (step + 1) + ')">Continue</button>'
          : '<button class="btn" id="submitBtn" onclick="submitAll()">Submit application</button>') +
        // Only offered on an application that has not been submitted. On one
        // that has, "draft" is not a state it can go back to.
        (!FORM.needsRegistration && (!FORM.draft || FORM.draft.status === 'DRAFT')
          ? '<button class="btn ghost" onclick="saveDraft()">Save as draft</button>' : '') +
      '</div>'));

    paintStep();
  }

  function goStep(i) {
    if (i > step && !validateStep()) return;
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    paint();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function paintStep() {
    var name = STEPS[step];
    var fn = {
      'Your details': stepPersonal, 'Course': stepCourse, 'Home address': stepAddress,
      'Family': stepFamily, 'Preferences': stepPreferences, 'Roommate': stepRoommate,
      'Review': stepReview
    }[name];
    setHtml('stepBody', fn ? fn() : '');
    if (name === 'Preferences') { ensureOptions(); paintOptions(); paintChosen(); }
    if (name === 'Roommate') paintLifestyle();
    if (name === 'Home address' && pinInfo) showPin(pinInfo);
  }

  /* =============================================================== fields */
  function text(field, lbl, opts) {
    opts = opts || {};
    return '<label class="field"><span class="lab">' + esc(lbl) +
      (opts.optional ? '' : ' <span class="req">*</span>') + '</span>' +
      '<input type="' + (opts.type || 'text') + '" value="' + esc(reg[field] || '') + '"' +
      (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') +
      (opts.max ? ' maxlength="' + opts.max + '"' : '') +
      ' oninput="setReg(&quot;' + field + '&quot;,this.value)"' +
      (opts.onblur ? ' onblur="' + opts.onblur + '"' : '') + '>' +
      (opts.help ? '<span class="help">' + esc(opts.help) + '</span>' : '') + '</label>';
  }

  function select(field, lbl, options, opts) {
    opts = opts || {};
    return '<label class="field"><span class="lab">' + esc(lbl) +
      (opts.optional ? '' : ' <span class="req">*</span>') + '</span>' +
      '<select onchange="setReg(&quot;' + field + '&quot;,this.value)' +
        (opts.rerender ? ';paintStep()' : '') + '">' +
      '<option value="">Select&hellip;</option>' +
      options.map(function (o) {
        var v = (o && o.code !== undefined) ? o.code : o;
        var t = (o && o.label !== undefined) ? o.label : o;
        return '<option value="' + esc(v) + '"' +
               (String(reg[field]) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>' +
      (opts.help ? '<span class="help">' + esc(opts.help) + '</span>' : '') + '</label>';
  }

  function setReg(field, value) { reg[field] = value; }

  /**
   * One sentence at the top of a step, saying what it is for.
   *
   * Every step looked identical before this - a card, a row of labels, a
   * Continue button - so the only way to find out why something was being
   * asked was to answer it and hope. A form this long is easier to finish when
   * each part explains itself in a line.
   */
  function lead(text) {
    return '<p class="steplead">' + esc(text) + '</p>';
  }

  /* ================================================================ steps */
  function stepPersonal() {
    return card('About you',
      lead('Who you are, as it appears on your admission record. This is what your ' +
           'documents are checked against, so a name that does not match will hold ' +
           'things up later.') +
      text('name', 'Full name', { placeholder: 'As printed on your admission record' }) +
      '<div class="fieldrow">' +
        text('enrollmentNo', 'University enrolment number', { placeholder: 'e.g. 04116403223' }) +
        text('dob', 'Date of birth', { type: 'date', optional: true }) +
      '</div>' +
      '<div class="fieldrow">' +
        text('phone', 'Mobile number', { placeholder: '10 digits', max: 10 }) +
        select('bloodGroup', 'Blood group', REG.bloodGroups,
          { optional: true, help: 'Kept for the hostel medical register.' }) +
      '</div>' +
      '<label class="field"><span class="lab">Gender <span class="req">*</span></span>' +
        '<div class="seg">' + [['M','Male'],['F','Female'],['O','Other']].map(function (g) {
          return '<button type="button" aria-pressed="' + (reg.gender === g[0]) +
            '" onclick="setReg(&quot;gender&quot;,&quot;' + g[0] + '&quot;);paintStep()">' +
            esc(g[1]) + '</button>';
        }).join('') + '</div>' +
        '<span class="help">Hostels are single-gender, so this decides which you can be ' +
        'allotted. It cannot be changed after you submit.</span></label>' +
      '<p class="small muted" style="margin:4px 0 0">Your sign-in address <strong>' +
      esc(FORM.email) + '</strong> will be linked to this record.</p>');
  }

  function stepCourse() {
    var prog = REG.programmes.filter(function (p) { return p.code === reg.programme; })[0];

    // Years run from the programme's own entry year, not from 1. A lateral-entry
    // student joins in the second year and never has a first, so offering one
    // would let somebody describe a student who cannot exist.
    var years = [];
    if (prog) {
      for (var y = prog.entryYear; y <= prog.lastYear; y++) {
        years.push({ code: y, label: 'Year ' + y });
      }
    }

    var firstYear = prog ? prog.entryYear : 1;
    var academic = '';
    if (reg.year && Number(reg.year) <= firstYear) {
      academic = text('meritPercent', 'Qualifying examination (%)',
        { type: 'number', placeholder: 'e.g. 88.4',
          help: firstYear > 1
            ? 'The diploma or B.Sc you entered on. Until you have a university result, it is ' +
              'what your application is ranked on.'
            : 'Best five subjects of class 12. The hostel policy ranks applicants in their ' +
              'first year on this, because there is no university result yet.' });
    } else if (reg.year) {
      academic = text('meritPercent', 'Result up to the preceding semester (%)',
        { type: 'number', placeholder: 'e.g. 76.5',
          help: 'The percentage the hostel policy ranks continuing students on.' });
    }

    var picked = REG.campuses.filter(function (c) { return c.code === reg.campus; })[0];
    var campusHelp = picked ? picked.note
      : 'Fixed when you joined the university. You can only be allotted a hostel at your own ' +
        'campus, so this decides which hostels you are offered.';

    return card('Your course',
      lead('Your campus decides which hostels exist for you at all, and your admission ' +
           'category decides which queue you are in. Neither is a preference \u2014 both ' +
           'come from your admission record.') +
      '<label class="field"><span class="lab">Campus you are admitted to ' +
        '<span class="req">*</span></span>' +
        '<div class="seg">' + REG.campuses.map(function (c) {
          return '<button type="button" aria-pressed="' + (reg.campus === c.code) +
            '" onclick="setCampus(&quot;' + c.code + '&quot;)">' + esc(c.label) + '</button>';
        }).join('') + '</div>' +
        '<span class="help">' + esc(campusHelp) + '</span></label>' +
      '<div class="divider"></div>' +
      '<div class="fieldrow">' +
        select('programme', 'Programme',
          REG.programmes.map(function (p) { return { code: p.code, label: p.code }; }),
          { rerender: true }) +
        (prog ? select('branch', 'Branch or specialisation', prog.branches, { rerender: true }) : '') +
      '</div>' +
      (prog ? '<div class="fieldrow">' +
        select('year', 'Year of study', years, { rerender: true }) + academic + '</div>' : '') +
      '<div class="divider"></div>' +
      // The school is NOT asked for. Every programme belongs to exactly one, so
      // naming a course has already named a school; a second question invites a
      // second answer that can contradict the first. It is shown instead, so the
      // applicant can see what their answer implied.
      (prog ? '<p class="small muted" style="margin:-4px 0 14px">' +
              'School: <strong>' + esc(prog.schoolName || prog.school) + '</strong>. ' +
              'A hostel seat is offered to regular full-time students of the schools on ' +
              'your own campus.</p>' : '') +

      // The single most consequential answer on the form. It decides which
      // queue the applicant is in, and no amount of marks moves anyone between
      // queues - so it is asked plainly, with what each one means.
      '<label class="field"><span class="lab">Admission category ' +
        '<span class="req">*</span></span>' +
        '<div class="seg">' + (REG.residenceCategories || []).map(function (c) {
          return '<button type="button" aria-pressed="' + (reg.residenceCategory === c.code) +
            '" onclick="setReg(&quot;residenceCategory&quot;,&quot;' + c.code +
            '&quot;);paintStep()">' + esc(c.label) + '</button>';
        }).join('') + '</div>' +
        '<span class="help">' + esc((REG.residenceCategories || [])
          .filter(function (c) { return c.code === reg.residenceCategory; })
          .map(function (c) { return c.note; })[0] ||
          'Whether you were admitted against the Delhi or the outside-Delhi quota. This is ' +
          'the category on your admission record, not where you happen to live.') +
        '</span></label>' +

      (reg.residenceCategory === 'DELHI'
        ? '<label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer;' +
          'margin-bottom:13px"><input type="checkbox" style="width:auto;margin-top:3px" ' +
          (reg.parentTransferred ? 'checked ' : '') +
          'onchange="reg.parentTransferred=this.checked;paintStep()">' +
          '<span><span style="font-weight:600;font-size:14px">A parent of mine has been ' +
          'transferred out of Delhi</span><span class="help">Central or State Government, a ' +
          'PSU, or an autonomous body under Government only. This moves you ahead of other ' +
          'Delhi-category applicants, and the transfer order is required at verification.' +
          '</span></span></label>'
        : '') +

      '<div class="divider"></div>' +
      select('category', 'Category', REG.categories,
        { help: 'Reserved places are allotted on this. Unless you select General you will need ' +
                'a category certificate at verification.' }) +
      '<label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer;margin-bottom:13px">' +
        '<input type="checkbox" style="width:auto;margin-top:3px" ' +
        (reg.isPwD ? 'checked ' : '') + 'onchange="reg.isPwD=this.checked;paintStep()">' +
        '<span><span style="font-weight:600;font-size:14px">I am a person with a disability</span>' +
        '<span class="help">A ground-floor accessible room will be reserved for you where it is ' +
        'needed. A disability certificate is required at verification.</span></span></label>' +
      (reg.isPwD ? select('pwdType', 'Type of disability', REG.pwdTypes) : ''));
  }

  function stepAddress() {
    return card('Where you live',
      lead('How far your home is from campus is part of how seats are ranked, and for ' +
           'Delhi-category applicants it is the whole of it. Give the address printed on ' +
           'your Aadhaar card.') +
      '<label class="field"><span class="lab">Permanent home address <span class="req">*</span></span>' +
      '<textarea rows="3" placeholder="House, street, locality" ' +
      'oninput="setReg(&quot;homeAddress&quot;,this.value)">' + esc(reg.homeAddress) +
      '</textarea></label>' +
      '<div class="fieldrow">' +
        text('homeCity', 'City or town', { optional: true }) +
        text('homePincode', 'PIN code', { placeholder: '6 digits', max: 6, onblur: 'checkPin()' }) +
      '</div>' +
      '<div id="pinResult"></div>' +
      '<p class="small muted" style="margin:12px 0 0">Distance from home is part of how places ' +
      'are ranked, and there is a minimum of ' + esc(REG.minDistanceKm) + ' km. Enter the address ' +
      'shown on your Aadhaar card, because the two are compared at verification.</p>');
  }

  function checkPin() {
    var pin = String(reg.homePincode || '').replace(/\D/g, '');
    var box = el('pinResult');
    if (!box) return;
    if (pin.length !== 6) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="hint"><span class="spin"></span> Locating&hellip;</div>';
    srv().withSuccessHandler(function (r) { pinInfo = r; showPin(r); })
      .withFailureHandler(function () { box.innerHTML = ''; })
      .apiLookupPincode(pin, myCampus());
  }

  function showPin(r) {
    var box = el('pinResult');
    if (!box) return;
    var kind = !r.resolved ? '' : (r.eligible ? 'good' : 'warn');
    box.innerHTML = '<div class="hint ' + kind + '">' + esc(r.message) + '</div>';
  }

  function stepFamily() {
    return card('Parent or guardian',
      lead('One person the hostel can reach in an emergency, and anything the warden ' +
           'should know if you are unwell.') +
      '<div class="fieldrow">' +
        text('guardianName', 'Name') +
        text('guardianPhone', 'Mobile number', { placeholder: '10 digits', max: 10 }) +
      '</div>' +
      text('guardianEmail', 'Email address',
        { optional: true, help: 'Optional. Allotment notices are copied here if you give one.' }) +
      '<div class="divider"></div>' +
      '<label class="field" style="margin-bottom:0">' +
      '<span class="lab">Medical conditions the hostel should know about</span>' +
      '<textarea rows="2" placeholder="Allergies, chronic conditions, regular medication. ' +
      'Leave blank if none." oninput="setReg(&quot;medicalNotes&quot;,this.value)">' +
      esc(reg.medicalNotes) + '</textarea>' +
      '<span class="help">Seen only by the hostel office and your warden.</span></label>');
  }

  function stepPreferences() {
    var g = myGender(), c = myCampus();
    var who = { M: "men's", F: "women's", O: '' }[g] || '';
    return card('Room preferences',
      lead('Choose up to ' + FORM.maxPreferences + ' options and put them in the order you ' +
           'want them, first choice at the top. You are considered for each in turn, so ' +
           'ranking one you would rather not have costs you nothing.') +
      '<div class="hint" style="margin-bottom:18px">Showing the ' + esc(who) + ' hostels at ' +
      '<strong>' + esc(campusLabel(c)) + '</strong>. Your campus is fixed by your admission, ' +
      'so these are the only hostels you can be allotted.</div>' +
      '<div class="grp-title">Your ranked choices</div>' +
      '<div id="chosenWrap" style="margin-bottom:18px"></div>' +
      '<div class="grp-title">Available options</div>' +
      '<div id="options"></div>' +
      '<div class="divider"></div>' +
      '<label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer">' +
        '<input type="checkbox" ' + (needsAccessible ? 'checked ' : '') +
        'style="width:auto;margin-top:3px" onchange="needsAccessible=this.checked">' +
        '<span><span style="font-weight:600;font-size:14px">I need an accessible room</span>' +
        '<span class="help">Ground floor, step-free access and an adapted washroom. This is ' +
        'treated as a requirement, not a preference.</span></span></label>');
  }

  function stepRoommate() {
    return card('Roommate questionnaire',
      lead('Used only to pair you with people you are likely to get on with, inside the room ' +
           'you are allotted. It never affects which room you get, or whether you get one ' +
           'at all.') +
      '<div id="life"></div>');
  }

  function stepReview() {
    var byKey = {};
    (FORM.options || []).forEach(function (o) { byKey[o.key] = o; });

    var prefs = chosen.length
      ? '<ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.8">' +
        chosen.map(function (k) {
          var o = byKey[k];
          return o ? '<li>' + esc(o.hostelName) + ' &mdash; ' + esc(o.roomTypeLabel) + '</li>' : '';
        }).join('') + '</ol>'
      : '<p class="muted small" style="margin:0">None chosen.</p>';

    // Every block on this page can be corrected from here. Reading back a
    // mistake and then having to hunt for the step that made it is the part of
    // a review screen that people give up on.
    function fix(name) {
      var i = STEPS.indexOf(name);
      return i < 0 ? '' :
        '<button type="button" class="linkish" onclick="goStep(' + i + ')">Change</button>';
    }

    var personal = FULL
      ? card('Your details', '<dl class="kv review">' +
          rv('Name', reg.name) + rv('Enrolment number', reg.enrollmentNo) +
          rv('Mobile', reg.phone) +
          rv('Gender', { M:'Male', F:'Female', O:'Other' }[reg.gender]) +
          rv('Campus', campusLabel(reg.campus)) +
          rv('Programme', reg.programme + (reg.branch ? ' — ' + reg.branch : '')) +
          rv('Year of study', reg.year ? 'Year ' + reg.year : '') +
          rv('Marks ranked on', reg.meritPercent ? reg.meritPercent + '%' : '') +
          rv('Admission category', label('residence', reg.residenceCategory)) +
          rv('School', (function () {
            var p = REG.programmes.filter(function (x) { return x.code === reg.programme; })[0];
            return p ? (p.schoolName || p.school) : '';
          })()) +
          (reg.parentTransferred ? rv('Parent transferred out of Delhi', 'Yes') : '') +
          rv('Category', reg.category + (reg.isPwD ? ' · PwD (' + reg.pwdType + ')' : '')) +
          rv('Home', [reg.homeCity, reg.homePincode].filter(Boolean).join(' ')) +
          rv('Distance from campus',
             pinInfo && pinInfo.resolved ? pinInfo.km + ' km' : 'to be confirmed') +
          rv('Guardian', reg.guardianName +
             (reg.guardianPhone ? ' · ' + reg.guardianPhone : '')) +
          '</dl>' +
          '<p class="small muted" style="margin:12px 0 0">You are declaring all of this ' +
          'yourself. It is checked against your documents at verification, so anything that ' +
          'does not match will hold your application up.</p>',
          { action: fix('Your details') })
      : '';

    return lead('Everything you have told us, in one place. Check it over — you can ' +
                'change any of it from here.') +
      personal +
      card('Your application', '<dl class="kv review">' +
        rv('Campus', campusLabel(myCampus())) +
        rv('Accessible room needed', needsAccessible ? 'Yes' : 'No') +
        '</dl><div class="grp-title" style="margin-top:15px">Room choices, in order</div>' + prefs,
        { action: fix('Preferences') }) +
      card('What happens next',
        '<ol class="next">' +
        '<li><strong>Your application is recorded.</strong> You can follow it on your ' +
        'dashboard from the moment you submit.</li>' +
        '<li><strong>You upload two documents.</strong> Your Aadhaar, and your college ID ' +
        'if you are not in your first year.</li>' +
        '<li><strong>Allocation runs, and you are emailed.</strong> Whatever the result, ' +
        'you are shown exactly how it was reached.</li>' +
        '</ol>');
  }

  function rv(k, v) {
    if (!v) return '';
    return '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>';
  }

  /* =========================================================== validation */
  function validateStep() {
    var name = STEPS[step], miss = [];

    if (name === 'Your details') {
      if (!reg.name || reg.name.trim().length < 3) miss.push('your full name');
      if (!reg.enrollmentNo) miss.push('your enrolment number');
      if (!isMobile(reg.phone)) miss.push('a valid 10-digit mobile number');
      if (!reg.gender) miss.push('your gender');
    }
    if (name === 'Course') {
      if (!reg.campus) miss.push('the campus you are admitted to');
      if (!reg.programme) miss.push('your programme');
      if (!reg.branch) miss.push('your branch');
      if (!reg.year) miss.push('your year of study');
      if (!reg.residenceCategory) miss.push('your admission category');
      if (!(Number(reg.meritPercent) > 0 && Number(reg.meritPercent) <= 100)) {
        var p = REG.programmes.filter(function (x) { return x.code === reg.programme; })[0];
        miss.push(reg.year && Number(reg.year) <= (p ? p.entryYear : 1)
          ? 'your qualifying examination percentage'
          : 'your result up to the preceding semester');
      }
      if (!reg.category) miss.push('your category');
      if (reg.isPwD && !reg.pwdType) miss.push('the type of disability');
    }
    if (name === 'Home address') {
      if (!reg.homeAddress || reg.homeAddress.trim().length < 8) miss.push('your home address');
      if (!/^\d{6}$/.test(String(reg.homePincode).trim())) miss.push('a 6-digit PIN code');
    }
    if (name === 'Family') {
      if (!reg.guardianName) miss.push('a parent or guardian name');
      if (!isMobile(reg.guardianPhone)) miss.push('a valid guardian mobile number');
    }
    if (name === 'Preferences' && !chosen.length) miss.push('at least one room preference');
    if (name === 'Roommate') {
      ['sleepTime', 'wakeTime', 'studyStyle', 'foodPref'].forEach(function (f) {
        if (!lifestyle[f]) miss.push('all the roommate questions');
      });
    }

    if (miss.length) {
      var uniq = miss.filter(function (v, i, a) { return a.indexOf(v) === i; });
      say('err', 'Please give ' + uniq.join(', ') + '.');
      return false;
    }
    if (el('msg')) setHtml('msg', '');
    return true;
  }

  function isMobile(v) { return /^[6-9]\d{9}$/.test(String(v || '').replace(/\D/g, '')); }

  /* =============================================================== submit */
  function submitAll() {
    if (!validateStep()) return;
    var btn = el('submitBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting'; }

    if (FORM.needsRegistration) {
      srv()
        .withSuccessHandler(function () { saveApplication(true); })
        .withFailureHandler(fail)
        .apiRegisterStudent(reg);
    } else {
      saveApplication(true);
    }
  }

  function saveApplication(submit) {
    var wasSubmitted = !!(FORM.draft && FORM.draft.status !== 'DRAFT');
    srv()
      .withSuccessHandler(function () {
        if (submit) {
          flashOnNextPage('good', wasSubmitted
            ? 'Your application has been updated. Anything the office had already checked ' +
              'against a detail you changed goes back into the queue to be checked again.'
            : 'Your application has been submitted. Upload the documents listed below so ' +
              'the hostel office can verify you.');
        }
        reloadTop();
      })
      .withFailureHandler(fail)
      .apiSaveApplication({
        // Sent only when this form is actually showing the details. A student
        // editing room choices alone must not be able to post a details object
        // assembled from a half-filled form.
        details: (FULL && !FORM.needsRegistration) ? reg : null,
        needsAccessible: needsAccessible,
        preferences: chosen, lifestyle: lifestyle, submit: !!submit
      });
  }

  function saveDraft() {
    srv()
      .withSuccessHandler(function () { say('good', 'Draft saved. You can finish it later.'); })
      .withFailureHandler(fail)
      .apiSaveApplication({
        details: (FULL && !FORM.needsRegistration) ? reg : null,
        needsAccessible: needsAccessible,
        preferences: chosen, lifestyle: lifestyle, submit: false
      });
  }

  function fail(e) {
    var btn = el('submitBtn');
    if (btn) { btn.disabled = false; btn.textContent = 'Submit application'; }
    say('err', e.message);
  }

  function say(kind, text) {
    if (el('msg')) setHtml('msg', banner(kind, text));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* =============================================================== campus */
  // The form's own value wins over the record, because on an edit the form IS
  // the correction. reg is prefilled from the record, so the two agree until
  // the student changes something - and from then on the change is what counts.
  function myGender()  { return reg.gender || (FORM.student ? FORM.student.gender : ''); }
  function myCampus()  { return reg.campus || (FORM.student ? FORM.student.campus : ''); }
  function campusLabel(c) { return label('campus', c, 'your campus'); }

  /**
   * Changing campus invalidates any hostel choices already made - they belong to
   * hostels this student can no longer be allotted. Dropping them here is
   * clearer than letting the server reject the submission later.
   */
  function setCampus(v) {
    if (reg.campus && reg.campus !== v && chosen.length) chosen = [];
    reg.campus = v;
    paintStep();
  }

  /**
   * A registering student has no record yet, so the server could not send hostel
   * options with the form. Fetch them once gender and campus are declared.
   */
  function ensureOptions() {
    if (!FULL) return;
    var key = [myGender(), myCampus(), reg.programme, reg.year].join('|');
    if (optionsFor === key && FORM.options) return;

    var box = el('options');
    if (box) box.innerHTML = '<div class="hint"><span class="spin"></span> ' +
      'Loading the hostels open to you&hellip;</div>';

    srv()
      .withSuccessHandler(function (opts) {
        FORM.options = opts;
        optionsFor = key;
        paintOptions();
        paintChosen();
      })
      .withFailureHandler(function (e) {
        if (el('options')) setHtml('options', banner('err', e.message));
      })
      .apiGetHostelOptions(myGender(), myCampus(), reg.programme, reg.year);
  }

  /* ============================================================== options */
  function paintOptions() {
    var box = el('options');
    if (!box || !FORM.options) return;
    var avail = FORM.options.filter(function (o) { return chosen.indexOf(o.key) < 0; });
    var full = chosen.length >= FORM.maxPreferences;

    // Nothing to offer AT ALL is a different thing from nothing LEFT to offer,
    // and saying "everything available is already in your list" to somebody
    // holding an empty list is how an applicant concludes the form is broken.
    // It happens for real: a campus whose hostel inventory has not been loaded
    // yet has no options for anybody, and the applicant cannot submit without
    // one.
    if (!FORM.options.length) {
      box.innerHTML = '<div class="hint warn">No hostel rooms are on record for ' +
        esc(campusLabel(myCampus())) + ' yet, so there is nothing to choose from and ' +
        'this application cannot be submitted. This is ours to fix, not yours &mdash; ' +
        'please tell the hostel office' +
        (typeof SUPPORT_EMAIL !== 'undefined' && SUPPORT_EMAIL
          ? ' at ' + esc(SUPPORT_EMAIL) : '') + '.</div>';
      return;
    }

    box.innerHTML = avail.length
      ? '<ul class="rows" style="border:1px solid var(--border);border-radius:var(--r)">' +
        avail.map(function (o) {
          return '<li><span class="body"><span class="n">' + esc(o.hostelName) + '</span>' +
            '<span class="d">' + esc(label('campus', o.campus)) + ' &middot; ' +
            esc(o.roomTypeLabel) + ' &middot; ' + esc(o.rooms) + ' rooms</span></span>' +
            '<button class="btn ghost sm" ' + (full ? 'disabled' : '') +
            ' onclick="addPref(&quot;' + o.key + '&quot;)">Add</button></li>';
        }).join('') + '</ul>'
      : '<p class="muted small" style="margin:0">Everything available is already in your list.</p>';
  }

  function addPref(key) {
    if (chosen.length >= FORM.maxPreferences || chosen.indexOf(key) >= 0) return;
    chosen.push(key); paintChosen(); paintOptions();
  }
  function removePref(key) {
    chosen = chosen.filter(function (k) { return k !== key; });
    paintChosen(); paintOptions();
  }
  function movePref(from, to) {
    if (to < 0 || to >= chosen.length) return;
    chosen.splice(to, 0, chosen.splice(from, 1)[0]);
    paintChosen();
  }

  function paintChosen() {
    var box = el('chosenWrap');
    if (!box) return;
    if (!chosen.length) {
      box.innerHTML = '<p class="muted small" style="margin:0">Nothing chosen yet. Add options ' +
        'from the list below, then drag them into the order you want.</p>';
      return;
    }
    var byKey = {};
    FORM.options.forEach(function (o) { byKey[o.key] = o; });

    box.innerHTML = '<ul class="rows" id="chosenList" ' +
      'style="border:1px solid var(--border);border-radius:var(--r)">' +
      chosen.map(function (key, i) {
        var o = byKey[key];
        if (!o) return '';
        return '<li draggable="true" data-i="' + i + '">' +
          '<span class="idx amber">' + (i + 1) + '</span>' +
          '<span class="body"><span class="n">' + esc(o.hostelName) + '</span>' +
          '<span class="d">' + esc(label('campus', o.campus)) + ' &middot; ' +
          esc(o.roomTypeLabel) + '</span></span>' +
          '<button class="btn ghost sm" onclick="movePref(' + i + ',' + (i - 1) + ')" ' +
            (i === 0 ? 'disabled' : '') + '>&uarr;</button>' +
          '<button class="btn ghost sm" onclick="movePref(' + i + ',' + (i + 1) + ')" ' +
            (i === chosen.length - 1 ? 'disabled' : '') + '>&darr;</button>' +
          '<button class="btn ghost sm" onclick="removePref(&quot;' + key +
            '&quot;)">&times;</button></li>';
      }).join('') + '</ul>';
    wireDrag();
  }

  /* Dragging is an enhancement. The arrow buttons do the same job for keyboard
     and touch users, so nothing depends on it working. */
  function wireDrag() {
    var list = el('chosenList');
    if (!list) return;
    var from = null;
    Array.prototype.forEach.call(list.children, function (li) {
      li.addEventListener('dragstart', function () { from = Number(li.dataset.i); });
      li.addEventListener('dragover', function (e) { e.preventDefault(); });
      li.addEventListener('drop', function (e) {
        e.preventDefault();
        var to = Number(li.dataset.i);
        if (from !== null && from !== to) movePref(from, to);
        from = null;
      });
    });
  }

  /* ============================================================ lifestyle */
  function paintLifestyle() {
    var box = el('life');
    if (!box) return;

    function seg(field, lbl, values, help) {
      return '<label class="field"><span class="lab">' + esc(lbl) + '</span><div class="seg">' +
        values.map(function (v) {
          return '<button type="button" aria-pressed="' + (lifestyle[field] === v[0]) +
            '" onclick="setLife(&quot;' + field + '&quot;,&quot;' + v[0] + '&quot;)">' +
            esc(v[1]) + '</button>';
        }).join('') + '</div>' +
        (help ? '<span class="help">' + esc(help) + '</span>' : '') + '</label>';
    }
    function scale(field, lbl, lo, hi) {
      return '<label class="field"><span class="lab">' + esc(lbl) + '</span><div class="scale">' +
        [1,2,3,4,5].map(function (n) {
          return '<button type="button" aria-pressed="' + (Number(lifestyle[field]) === n) +
            '" onclick="setLife(&quot;' + field + '&quot;,' + n + ')">' + n + '</button>';
        }).join('') + '</div>' +
        '<span class="help">1 = ' + esc(lo) + ', 5 = ' + esc(hi) + '</span></label>';
    }

    box.innerHTML =
      '<div class="fieldrow">' +
        seg('sleepTime', 'When do you usually go to sleep?',
          [['EARLY','Before 11pm'],['MODERATE','11pm to 1am'],['LATE','After 1am']]) +
        seg('wakeTime', 'When do you usually wake up?',
          [['EARLY','Before 7am'],['MODERATE','7 to 9am'],['LATE','After 9am']]) +
      '</div>' +
      seg('studyStyle', 'How do you prefer to study in your room?',
        [['QUIET','In silence'],['MUSIC','With music'],['GROUP','With others around']]) +
      '<div class="fieldrow">' +
        scale('cleanliness', 'How tidy do you keep your space?', 'relaxed', 'very tidy') +
        scale('sociability', 'How social are you in the room?', 'keep to myself', 'very social') +
      '</div>' +
      '<div class="fieldrow">' +
        seg('foodPref', 'Food preference',
          [['VEG','Vegetarian'],['EGG','Eggetarian'],['NONVEG','Non-vegetarian']]) +
        seg('guestsFrequency', 'How often do you have visitors?',
          [['NEVER','Rarely'],['SOMETIMES','Sometimes'],['OFTEN','Often']]) +
      '</div>' +
      '<label class="field" style="margin-bottom:0">' +
      '<span class="lab">Language you are most comfortable in</span>' +
      '<input type="text" value="' + esc(lifestyle.language || '') +
      '" oninput="lifestyle.language=this.value" placeholder="e.g. Hindi">' +
      '<span class="help">A small pairing bonus only. Rooms are never grouped by region.</span>' +
      '</label>';
  }

  function setLife(field, value) {
    if (value === 'true') value = true;
    if (value === 'false') value = false;
    lifestyle[field] = value;
    paintLifestyle();
  }
</script>
