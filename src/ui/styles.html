<style>
  /* Design tokens. Light and dark are both explicit - a transparent body would
     borrow whatever the host page uses and look broken in one of the two. */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #dde1e7;
    --text: #16191d;
    --muted: #5b636e;
    --accent: #1f3864;
    --accent-soft: #e8eef8;
    --ok: #16794a;
    --ok-soft: #e6f4ed;
    --warn: #8a5a00;
    --warn-soft: #fdf3e0;
    --bad: #a32020;
    --bad-soft: #fbeaea;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,25,45,.06), 0 4px 12px rgba(16,25,45,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1215;
      --surface: #171b20;
      --surface-2: #1e242b;
      --border: #2c343d;
      --text: #e9edf2;
      --muted: #9aa5b1;
      --accent: #7ea6e8;
      --accent-soft: #1b2738;
      --ok: #5ec98d;
      --ok-soft: #10281c;
      --warn: #e0b064;
      --warn-soft: #2b2113;
      --bad: #ef8080;
      --bad-soft: #2e1717;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1215; --surface: #171b20; --surface-2: #1e242b; --border: #2c343d;
    --text: #e9edf2; --muted: #9aa5b1; --accent: #7ea6e8; --accent-soft: #1b2738;
    --ok: #5ec98d; --ok-soft: #10281c; --warn: #e0b064; --warn-soft: #2b2113;
    --bad: #ef8080; --bad-soft: #2e1717;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 16px 64px; }

  /* header */
  header.top {
    background: var(--accent); color: #fff; padding: 14px 16px;
  }
  :root:not([data-theme="light"]) header.top { background: var(--surface-2); }
  @media (prefers-color-scheme: light) { header.top { background: #1f3864; } }
  header.top .inner {
    max-width: 940px; margin: 0 auto; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header.top .sub { font-size: 12.5px; opacity: .82; margin-top: 1px; }
  header.top .who { font-size: 12.5px; opacity: .9; text-align: right; }
  :root:not([data-theme="light"]) header.top h1,
  :root:not([data-theme="light"]) header.top .who { color: var(--text); }

  /* cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 12px; font-weight: 620;
  }
  .card h3 { font-size: 15px; margin: 0 0 6px; font-weight: 620; }

  /* status pill */
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
  }
  .pill.ok   { background: var(--ok-soft);   color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad  { background: var(--bad-soft);  color: var(--bad); }
  .pill.info { background: var(--accent-soft); color: var(--accent); }

  /* allotment hero */
  .allot { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .allot .room {
    font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
  }
  .allot .where { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .kv { display: grid; grid-template-columns: auto auto; gap: 3px 16px; font-size: 13.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 550; }

  /* explanation panel - the "why" feature */
  .why { border-left: 3px solid var(--accent); padding-left: 14px; }
  .why .grp { margin-bottom: 14px; }
  .why .grp:last-child { margin-bottom: 0; }
  .why .grp-title {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 620; margin-bottom: 5px;
  }
  .why ul { list-style: none; margin: 0; padding: 0; }
  .why li {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 4px 0; font-size: 14px;
  }
  .why .mark { flex: none; width: 15px; font-weight: 700; line-height: 1.5; }
  .why .yes .mark { color: var(--ok); }
  .why .no  .mark { color: var(--bad); }
  .why .no  { color: var(--muted); }

  /* score breakdown bars */
  .bars { margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 58px; gap: 10px;
             align-items: center; font-size: 12.5px; margin-bottom: 5px; }
  .bar-row .lbl { color: var(--muted); }
  .bar { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* preference list / drag ranking */
  .pref-list { list-style: none; margin: 0; padding: 0; }
  .pref-list li {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 7px;
    background: var(--surface-2); cursor: grab; user-select: none;
  }
  .pref-list li.drag { opacity: .45; }
  .pref-list li.over { border-color: var(--accent); }
  .pref-list .rank {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-size: 12px; font-weight: 660;
  }
  .pref-list .grip { flex: none; color: var(--muted); cursor: grab; font-size: 15px; }
  .pref-list .meta { flex: 1; min-width: 0; }
  .pref-list .meta .n { font-weight: 570; font-size: 14px; }
  .pref-list .meta .d { color: var(--muted); font-size: 12.5px; }

  /* forms */
  label.field { display: block; margin-bottom: 13px; }
  label.field > span.lab { display: block; font-size: 13px; font-weight: 570; margin-bottom: 4px; }
  label.field > span.help { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  select, input[type=text], textarea {
    width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  select:focus, input:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 620px) { .row2 { grid-template-columns: 1fr; } }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 8px;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 570;
  }

  .scale { display: flex; gap: 5px; }
  .scale button {
    flex: 1; padding: 8px 0; font: inherit; font-size: 13.5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 8px;
  }
  .scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 17px; font: inherit; font-size: 14px; font-weight: 570;
    border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; text-decoration: none;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.quiet { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

  /* documents */
  .doc { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0;
         border-bottom: 1px solid var(--border); }
  .doc:last-child { border-bottom: 0; }
  .doc .body { flex: 1; min-width: 0; }
  .doc .body .n { font-weight: 570; font-size: 14px; }
  .doc .body .h { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .doc .body .w { color: var(--muted); font-size: 12.5px; margin-top: 4px; font-style: italic; }

  /* roommates */
  .mate { display: flex; align-items: center; gap: 11px; padding: 9px 0;
          border-bottom: 1px solid var(--border); }
  .mate:last-child { border-bottom: 0; }
  .mate .av {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 640; font-size: 13px;
  }
  .mate .info { flex: 1; min-width: 0; }
  .mate .info .n { font-weight: 560; font-size: 14px; }
  .mate .info .d { color: var(--muted); font-size: 12.5px; }

  /* timeline */
  .steps { display: flex; gap: 0; margin: 0 0 4px; padding: 0; list-style: none; flex-wrap: wrap; }
  .steps li { flex: 1; min-width: 88px; text-align: center; position: relative; padding-top: 22px; font-size: 12px; color: var(--muted); }
  .steps li::before {
    content: ""; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border);
  }
  .steps li::after {
    content: ""; position: absolute; top: 10px; left: 50%; width: 100%; height: 2px;
    background: var(--border);
  }
  .steps li:last-child::after { display: none; }
  .steps li.done { color: var(--text); font-weight: 560; }
  .steps li.done::before { background: var(--ok); border-color: var(--ok); }
  .steps li.done::after { background: var(--ok); }
  .steps li.current::before { background: var(--accent); border-color: var(--accent); }

  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .center { text-align: center; }
  .stack > * + * { margin-top: 12px; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
  .empty { padding: 34px 16px; text-align: center; color: var(--muted); }
  .banner {
    padding: 11px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 13px;
    border: 1px solid transparent;
  }
  .banner.err  { background: var(--bad-soft);  color: var(--bad);  border-color: var(--bad); }
  .banner.good { background: var(--ok-soft);   color: var(--ok);   border-color: var(--ok); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  .spin { display: inline-block; width: 13px; height: 13px; border-radius: 50%;
          border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
          animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* Wide content must scroll inside its own box, never the page body. */
  .scroll-x { overflow-x: auto; }
</style>
