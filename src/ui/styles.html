<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* ============================================================ tokens
     Institutional palette: deep navy for authority, amber for action.
     Light and dark are both defined explicitly - a transparent body would
     borrow whatever the host page uses and look broken in one of the two. */
  :root {
    --navy-900:#101d33; --navy-800:#16263f; --navy-700:#1e3355; --navy-600:#2a4570;
    --amber:#e8971a; --amber-600:#cf8210; --amber-soft:#fdf3e2; --amber-line:#f3d9a8;

    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f6f8fb;
    --surface-3:#eef2f7;
    --border:#dde4ed;
    --border-strong:#c6d1e0;

    --text:#121c2e;
    --text-2:#3c4c63;
    --muted:#6b7a90;

    --ok:#0f7a4d; --ok-soft:#e7f5ee; --ok-line:#a9dcc4;
    --warn:#9a6400; --warn-soft:#fdf4e3; --warn-line:#f0d6a4;
    --bad:#a52222; --bad-soft:#fceded; --bad-line:#efc0c0;
    --info:#1e5fa8; --info-soft:#e9f1fb; --info-line:#b9d3ef;

    --r-sm:6px; --r:10px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(16,29,51,.06);
    --sh-2:0 1px 3px rgba(16,29,51,.07), 0 6px 18px rgba(16,29,51,.06);
    --sh-3:0 2px 6px rgba(16,29,51,.09), 0 16px 40px rgba(16,29,51,.10);
    --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  }
  /* One palette, always: white ground, navy type, amber for anything that
     asks to be acted on.

     There is no dark variant, and that is deliberate rather than unfinished.
     This is an institutional portal read beside printed forms and projected in
     front of a room; a second colour scheme that follows whatever the reader's
     laptop happens to prefer means the screen an officer is describing is not
     the screen a student is looking at. Committing to one removes that, and
     removes the flash of the wrong ground on every page load with it. */

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--ui);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  a{color:var(--info)}

  /* ============================================================ masthead */
  .masthead{background:var(--navy-900);color:#fff}
  .masthead .row{
    max-width:1120px;margin:0 auto;padding:11px 20px;
    display:flex;align-items:center;gap:13px;
  }
  .crest{
    flex:none;width:36px;height:36px;border-radius:50%;
    background:linear-gradient(150deg,var(--amber),var(--amber-600));
    display:grid;place-items:center;color:var(--navy-900);
    font-weight:800;font-size:13px;letter-spacing:-.02em;
    box-shadow:0 0 0 2px rgba(255,255,255,.16);
  }
  /* The real emblem is full-colour line art on a light ground, so it needs the
     white disc behind it rather than the amber one the monogram sits on. */
  .crest.has-img{
    background:#fff;padding:2px;width:40px;height:40px;
    box-shadow:0 0 0 2px rgba(255,255,255,.28);
  }
  .crest.has-img img{
    width:100%;height:100%;object-fit:contain;display:block;border-radius:50%;
  }
  .masthead .who-we-are{min-width:0}
  .masthead .org{
    font-family:var(--display);font-size:16.5px;font-weight:700;
    letter-spacing:.2px;line-height:1.2;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .masthead .unit{font-size:11.5px;color:var(--amber);font-weight:600;letter-spacing:.4px;
    text-transform:uppercase;margin-top:1px}
  .masthead .spacer{flex:1}
  .userchip{
    display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;
    background:rgba(255,255,255,.09);border-radius:999px;font-size:12.5px;
    white-space:nowrap;max-width:260px;
  }
  .userchip .av{
    width:24px;height:24px;border-radius:50%;background:var(--amber);
    color:var(--navy-900);display:grid;place-items:center;
    font-weight:700;font-size:10.5px;flex:none;
  }
  .userchip .nm{overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.92)}
  .userchip .rl{color:var(--amber);font-weight:600;font-size:11px}

  /* ============================================================== navbar */
  .navbar{background:var(--navy-800);border-bottom:3px solid var(--amber)}
  .navbar .row{
    max-width:1120px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;gap:4px;overflow-x:auto;
  }
  .navbar a{
    display:block;padding:11px 15px;font-size:13.5px;font-weight:600;
    color:rgba(255,255,255,.74);text-decoration:none;white-space:nowrap;
    border-radius:8px 8px 0 0;
  }
  .navbar a:hover{color:#fff;background:rgba(255,255,255,.07)}
  .navbar a.on{background:var(--amber);color:var(--navy-900)}

  /* ============================================================== layout */
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 72px}
  .narrow{max-width:820px}
  .stack>*+*{margin-top:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}

  /* =============================================================== cards */
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--sh-1);margin-bottom:14px;overflow:hidden;
  }
  .card>.hd{
    display:flex;align-items:center;gap:10px;
    padding:13px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);
  }
  .card>.hd h2{
    margin:0;font-size:13px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-2);
  }
  .card>.hd .sub{font-size:12px;color:var(--muted);font-weight:500}
  .card>.hd .grow{flex:1}
  .card>.bd{padding:18px}
  .card>.bd.tight{padding:0}
  .card h3{font-size:16px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}

  /* section heading outside cards */
  .sect{
    display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;
  }
  .sect h2{
    font-family:var(--display);font-size:20px;font-weight:700;margin:0;
    letter-spacing:-.01em;
  }
  .sect .note{font-size:12.5px;color:var(--muted)}

  /* =============================================================== pills */
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650;
    letter-spacing:.01em;border:1px solid transparent;white-space:nowrap;
  }
  .pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill.plain::before{display:none}
  .pill.ok  {background:var(--ok-soft);  color:var(--ok);  border-color:var(--ok-line)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .pill.bad {background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line)}
  .pill.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
  .pill.amber{background:var(--amber-soft);color:var(--amber-600);border-color:var(--amber-line)}

  /* ============================================================== hero */
  .hero{
    background:linear-gradient(135deg,var(--navy-800),var(--navy-600));
    color:#fff;border-radius:var(--r-lg);padding:24px 26px;box-shadow:var(--sh-2);
    margin-bottom:14px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-56px;top:-56px;width:190px;height:190px;
    border-radius:50%;background:rgba(232,151,26,.16);
  }
  .hero .eyebrow{
    font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--amber);margin-bottom:7px;
  }
  .hero .big{
    font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05;
    letter-spacing:-.02em;margin:0;
  }
  .hero .where{color:rgba(255,255,255,.82);font-size:14.5px;margin-top:6px}
  .hero .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:1}
  .hero .tags .pill{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.22)}
  .hero .tags .pill.hi{background:var(--amber);color:var(--navy-900);border-color:transparent}
  .hero-grid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1}
  .hero-grid>.main{flex:1;min-width:210px}
  .hero dl{display:grid;grid-template-columns:auto auto;gap:5px 16px;margin:0;font-size:13px}
  .hero dt{color:rgba(255,255,255,.62)}
  .hero dd{margin:0;font-weight:600}

  .hero.wait{background:linear-gradient(135deg,#7a5a12,#a8791c)}
  .hero.stop{background:linear-gradient(135deg,#7a2020,#a13030)}

  /* ============================================================== steps */
  .steps{display:flex;list-style:none;margin:0;padding:0}
  .steps li{
    flex:1;min-width:76px;text-align:center;position:relative;padding-top:26px;
    font-size:12px;color:var(--muted);font-weight:500;
  }
  .steps li::before{
    content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;background:var(--surface);
    border:2px solid var(--border-strong);z-index:1;
  }
  .steps li::after{
    content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--border);
  }
  .steps li:last-child::after{display:none}
  .steps li.done{color:var(--text);font-weight:600}
  .steps li.done::before{background:var(--ok);border-color:var(--ok)}
  .steps li.done::after{background:var(--ok)}
  .steps li.now::before{
    background:var(--amber);border-color:var(--amber);
    box-shadow:0 0 0 4px var(--amber-soft);
  }
  .steps li.stop::before{background:var(--bad);border-color:var(--bad)}

  /* ======================================================== explanation */
  .why-head{
    display:flex;align-items:flex-start;gap:12px;padding:15px 17px;
    background:var(--amber-soft);border:1px solid var(--amber-line);
    border-radius:var(--r);margin-bottom:16px;
  }
  .why-head .ic{
    flex:none;width:30px;height:30px;border-radius:8px;background:var(--amber);
    color:var(--navy-900);display:grid;place-items:center;font-size:16px;font-weight:800;
  }
  .why-head .t{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
  .why-head .s{font-size:12.5px;color:var(--text-2);margin-top:2px}

  .grp{margin-bottom:16px}
  .grp:last-child{margin-bottom:0}
  .grp-title{
    font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px;
  }
  .grp-title::after{content:"";flex:1;height:1px;background:var(--border)}
  .reasons{list-style:none;margin:0;padding:0}
  .reasons li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
  .reasons .mk{
    flex:none;width:17px;height:17px;border-radius:50%;margin-top:2px;
    display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;
  }
  .reasons .yes .mk{background:var(--ok)}
  .reasons .no  .mk{background:var(--bad)}
  .reasons .no  span:last-child{color:var(--text-2)}

  /* score bars */
  .bars{margin-top:12px}
  .bar-row{
    display:grid;grid-template-columns:130px 1fr 52px;gap:11px;align-items:center;
    font-size:12.5px;margin-bottom:7px;
  }
  .bar-row .lbl{color:var(--text-2);font-weight:500}
  .bar{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--navy-600),var(--amber))}
  .bar-row .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

  /* =============================================================== rows */
  .rows{list-style:none;margin:0;padding:0}
  .rows>li{
    display:flex;align-items:center;gap:12px;padding:13px 18px;
    border-bottom:1px solid var(--border);
  }
  .rows>li:last-child{border-bottom:0}
  .rows .body{flex:1;min-width:0;display:block}
  /* These are spans, so they need to be told to stack. Left inline they render
     as "Dwarka Boys Hostel ADwarka Campus" with no break between them. */
  .rows .n,.rows .d,.rows .why{display:block}
  .rows .n{font-weight:600;font-size:14px;line-height:1.35}
  .rows .d{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
  .rows .why{color:var(--text-2);font-size:12.5px;margin-top:4px;font-style:italic;line-height:1.4}
  .idx{
    flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy-700);
    color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;
  }
  .idx.amber{background:var(--amber);color:var(--navy-900)}
  .av{
    flex:none;width:36px;height:36px;border-radius:50%;
    background:var(--surface-3);color:var(--navy-600);
    display:grid;place-items:center;font-weight:700;font-size:13px;
  }
  :root:not([data-theme="light"]) .av{color:var(--amber)}

  /* =============================================================== tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
  .tile{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r);padding:14px 16px;
  }
  .tile .n{
    font-size:27px;font-weight:750;line-height:1.05;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .tile .l{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:550}
  .tile.hi{background:var(--amber-soft);border-color:var(--amber-line)}
  .tile.hi .n{color:var(--amber-600)}
  .tile.good .n{color:var(--ok)}
  .tile.bad .n{color:var(--bad)}

  /* =============================================================== table */
  table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
  table.grid th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:700;padding:10px 14px;background:var(--surface-2);
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.grid td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.grid tr:last-child td{border-bottom:0}
  table.grid tbody tr:hover{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .meter{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;min-width:70px}
  .meter i{display:block;height:100%;border-radius:5px;background:var(--navy-600)}
  .meter i.hot{background:var(--amber)}
  .meter i.full{background:var(--ok)}

  /* =============================================================== forms */
  label.field{display:block;margin-bottom:15px}
  label.field>.lab{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  label.field>.help{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:9px 12px;font:inherit;font-size:14px;
    border:1px solid var(--border-strong);border-radius:var(--r-sm);
    background:var(--surface);color:var(--text);
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);
  }
  textarea{resize:vertical;min-height:76px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:620px){.row2{grid-template-columns:1fr}}

  /* ===================================================== admin shell
     The dashboard is a workspace, not a document: a fixed left rail of
     sections and one of them open at a time. Everything used to be on a
     single page, which meant scrolling past six things to reach the
     seventh and no way to tell where you were.

     Held to the light palette whatever the operating system prefers. An
     officer reads this beside printed forms and a dark field of navy is
     the wrong ground for that. */
  /* The ground is white on every page, not only the dashboard. The card border
     and the tinted card header are what separate one block from the next, so
     nothing needs a grey field behind it to be legible. */
  body{background:#fff}
  .card{background:#fff}
  .tile{background:#fff}
  /* The rail is 1400 wide; the masthead defaults to 1120 and would sit inside
     it, leaving the university name floating short of its own sidebar. */
  body.admin .masthead .row,
  body.admin .navbar .row{max-width:1400px}
  /* On a white page the card header needs to be the thing that separates one
     card from the next, so it keeps a tint while the body does not. */
  body.admin .card>.hd{background:var(--surface-2)}
  body.admin .tile{background:#fff}

  .ashell{
    display:flex;align-items:flex-start;gap:0;
    max-width:1400px;margin:0 auto;padding:0 20px;
  }
  .asidebar{
    flex:0 0 226px;width:226px;align-self:stretch;
    padding:20px 18px 40px 0;border-right:1px solid var(--border);
    position:sticky;top:0;
  }
  .amain{flex:1;min-width:0;padding:20px 0 72px 26px}

  .anav{list-style:none;margin:0;padding:0}
  .anav li{margin:0 0 2px}
  .anav button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;border-radius:var(--r-sm);cursor:pointer;
    font:inherit;font-size:14px;font-weight:500;color:var(--text-2);
    padding:9px 12px;position:relative;transition:background .12s,color .12s;
  }
  .anav button:hover{background:var(--surface-2);color:var(--text)}
  .anav button[aria-current="true"]{
    background:var(--navy-900);color:#fff;font-weight:600;
  }
  .anav button[aria-current="true"] .ico{opacity:1}
  .anav .ico{
    flex:0 0 16px;height:16px;opacity:.55;display:inline-flex;
    align-items:center;justify-content:center;
  }
  .anav .ico svg{width:16px;height:16px;display:block}
  .anav .cnt{
    margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
    background:var(--amber);color:#26190a;font-size:11.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .anav button[aria-current="true"] .cnt{background:var(--amber);color:#26190a}

  .arail-title{
    font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px 12px;
  }
  .apagehead{margin:0 0 18px}
  .apagehead h1{
    font-family:var(--display);font-size:24px;font-weight:600;margin:0 0 3px;
    letter-spacing:-.01em;color:var(--text);
  }
  .apagehead p{margin:0;color:var(--muted);font-size:13.5px}

  @media (max-width:900px){
    .ashell{display:block;padding:0 14px}
    .asidebar{
      width:auto;flex:none;position:static;border-right:0;
      border-bottom:1px solid var(--border);padding:12px 0;
    }
    .arail-title{display:none}
    .anav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .anav li{margin:0}
    .anav button{white-space:nowrap;width:auto}
    .amain{padding:18px 0 60px}
  }

  /* Verification queue. Each applicant is a block, not a table row - the
     findings need room to be read, and a verifier skimming a table will not
     read them at all. */
  .vrow{border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;margin-bottom:11px}
  .vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .vname{font-weight:650;font-size:15px}
  .vmeta{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .vmeta strong{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .findings{margin:11px 0 0;padding:0;list-style:none}
  .findings li{
    position:relative;padding:6px 0 6px 22px;font-size:13px;line-height:1.5;
    border-top:1px solid var(--border)
  }
  .findings li:before{position:absolute;left:2px;top:6px;font-size:12px}
  .findings li.block{color:var(--bad)}
  .findings li.block:before{content:"\26D4"}
  .findings li.review{color:var(--text)}
  .findings li.review:before{content:"\26A0"}
  .findings li.info{color:var(--muted)}
  .findings li.info:before{content:"\2139"}

  /* ============================================================= sign-in
     Two panels, not one centred box. The old page was a card floating in a
     field of white with an emoji on top: correct, and completely silent about
     what this is or why it does not want a password. The navy half gives the
     page somewhere to stand and answers both questions before the field is
     reached; the white half is still one input and one button.

     On a narrow screen the form comes FIRST and the navy panel drops beneath
     it. Somebody who already knows what this is should not have to scroll past
     an explanation to reach the box. */
  .signin-split{
    display:grid;grid-template-columns:1.02fr 1fr;
    border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--sh-2);overflow:hidden;background:var(--surface);
    /* Capped and centred: the admin shell is a 1120px page, and a sign-in panel
       stretched across all of it reads as a form nobody finished designing. */
    max-width:880px;margin:8px auto 18px;
  }
  .signin-aside{
    position:relative;overflow:hidden;
    background:
      radial-gradient(120% 120% at 88% -10%, var(--navy-700) 0%, transparent 58%),
