<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL = '<?= webAppUrl() ?>';
</script>

<div id="chrome"></div>
<div class="wrap narrow" id="root"></div>

<script>
  paintChrome({ unit: 'Hostel Allocation Portal' });
  loadToken();

  // Already holding a session? Go where they were trying to go.
  if (SESSION.token) {
    srv().withSuccessHandler(function (who) {
      if (who.signedIn) { reloadTop(); return; }
      saveToken(null);
      el('root').innerHTML = signInPanel('Your previous sign-in has expired.');
    }).withFailureHandler(function () {
      el('root').innerHTML = signInPanel();
    }).apiWhoAmI();
  } else {
    el('root').innerHTML = signInPanel();
  }
</script>
