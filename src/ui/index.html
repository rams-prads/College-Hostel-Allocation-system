<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL    = '<?= webAppUrl() ?>';
  var LOGO_URL      = '<?= logoUrl() ?>';
  var SUPPORT_EMAIL = '<?= supportEmail() ?>';
</script>

<div id="chrome"></div>
<div class="wrap narrow" id="root"></div>

<script>
  paintChrome({ unit: 'Hostel Allocation Portal' });
  loadToken();

  /**
   * Called by the shared sign-in panel the moment a session exists.
   *
   * Asking who it is before moving saves the hop this page used to take: it
   * sent everybody to the student portal, which then had to bounce every
   * administrator straight back out again.
   */
  function onSignedIn() {
    setHtml('root', loadingState('Signing you in'));
    srv().withSuccessHandler(function (who) { reloadTop(homeFor(who)); })
      .withFailureHandler(function () { reloadTop(); })
      .apiWhoAmI();
  }

  function onSignedOut() {
    setHtml('root', signInPanel());
  }

  // Already holding a session? Go where that account belongs.
  if (SESSION.token) {
    srv().withSuccessHandler(function (who) {
      if (who.signedIn) { reloadTop(homeFor(who)); return; }
      saveToken(null);
      setHtml('root', signInPanel('Your previous sign-in has expired.'));
    }).withFailureHandler(function () {
      setHtml('root', signInPanel());
    }).apiWhoAmI();
  } else {
    setHtml('root', signInPanel());
  }
</script>
