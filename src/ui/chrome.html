<script>
// One palette for everybody, pinned before first paint. The stylesheet no
// longer defines a dark variant, so this is belt and braces against a host
// page that sets the attribute itself.
try { document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}

/* ===================================================================== auth
 *
 * Google identifies the project owner and their own Workspace domain, and
 * nobody else. A first-year applicant has no college address yet, so for them
 * the session is a signed token this browser holds and sends with each call.
 *
 * srv() is a drop-in for google.script.run: same chaining, but it routes
 * through apiCall so the token rides along. Every existing call site changed by
 * one word, which is why none of them were missed.
 */
var SESSION = { token: null, email: '', isAdmin: false, via: null, checked: false };

var TOKEN_KEY = 'ggsipu.hostel.session';

function loadToken() {
  try { SESSION.token = window.localStorage.getItem(TOKEN_KEY) || null; }
  catch (e) { SESSION.token = null; }   // private windows throw rather than return null
  return SESSION.token;
}
function saveToken(t) {
  SESSION.token = t || null;
  try {
    if (t) window.localStorage.setItem(TOKEN_KEY, t);
    else window.localStorage.removeItem(TOKEN_KEY);
  } catch (e) { /* the in-memory copy still carries this page load */ }
}

/**
 * Show a failure the user can act on, wherever the page happens to be.
 *
 * Written to #msg if the page has one, otherwise over #root - never nowhere.
 */
/**
 * The one sentence for "the server answered with nothing".
 *
 * Shared, because both the page and srv() can be the one to notice, and the
 * reader should not get two different explanations of the same event.
 */
function emptyResponseNote(what) {
  return (what ? what + ' sent nothing back' : 'The portal sent nothing back') +
    ', so there was nothing to draw. Reload the page. If it keeps happening, the ' +
    'deployment may be older than the code - open ?page=diag on this address and ' +
    'compare the deployment URL it reports with the one in your browser.';
}

function showFailure(message, detail) {
  var box = el('msg') || el('root');
  if (!box) return;
  var body = banner('err', message) +
    (detail ? '<details class="tech"><summary>Technical detail</summary>' +
              '<pre class="small" style="white-space:pre-wrap;margin:0">' + esc(detail) +
              '</pre></details>' : '');
  // Whichever of the two exists. box was resolved above; writing through it by
  // id keeps the "it may have gone" case with every other write on the page.
  setHtml(box.id, body);
}

var CALL_TIMEOUT_MS = 25000;

/**
 * Start a server call.
 *
 * @param {string=} ownerId id of the element this call is drawing into.
 *
 * Pass it whenever the call replaced something with a spinner. A failure then
 * lands ON the spinner rather than in the page-level message strip, which may be
 * far above the fold - "Opening…" sat there forever while the explanation of why
 * was written somewhere the user was not looking.
 */
function srv(ownerId, opts) {
  var ok = null, fail = null;
  opts = opts || {};

  // Whether the panel this call is painting into existed when the call was
  // made. If it did and it does not any more, the person has moved on - to
  // another tab, or through a redraw - and the answer is for a screen nobody is
  // looking at. Dropping it is correct: painting it would write over whatever
  // they are looking at NOW, and reporting it as a failure would put a red box
  // on a page where nothing went wrong.
  //
  // An owner that never existed is a different thing entirely - a typo in a
  // call site - and is deliberately left to fail loudly.
  var ownerWasThere = ownerId ? !!el(ownerId) : false;

  function abandoned() {
    return ownerWasThere && !el(ownerId);
  }

  function report(message, detail) {
    // Open, not collapsed. A failure nobody can read without a second click is
    // reported to nobody: every screenshot of one so far has been cropped above
    // the only line that said what went wrong.
    var body = banner('err', message) +
      (detail ? '<details class="tech" open><summary>Technical detail</summary>' +
                '<pre class="small" style="white-space:pre-wrap;margin:0">' + esc(detail) +
                '</pre></details>' : '');
    var owner = ownerId ? el(ownerId) : null;
    if (owner) { owner.innerHTML = body; return; }
    var box = el('msg') || el('root');
    if (box) box.innerHTML = body;
  }

  // The handlers must return the PROXY, not the object behind it. Returning the
  // target breaks the chain at the second link: .withFailureHandler() would hand
  // back a bare object with no api methods on it, and every call site in the
  // project chains twice.
  var proxy = new Proxy({}, {
    get: function (_, prop) {
      if (prop === 'withSuccessHandler') return function (h) { ok = h; return proxy; };
      if (prop === 'withFailureHandler') return function (h) { fail = h; return proxy; };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var name = String(prop);
        var settled = false;

        // A page that is only ever going to show a spinner should say so. Without
        // this, a call that never comes back is indistinguishable from one that
        // is merely slow, and the user waits forever on a screen with no
        // information at all.
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          if (abandoned()) return;
          report(opts.timeoutMessage ||
                 ('This is taking longer than it should. The server has not answered in ' +
                  '25 seconds. Try again; if it keeps happening, the deployment may be ' +
                  'serving an older version of the code.'), name);
        }, opts.timeoutMs || CALL_TIMEOUT_MS);

        function done() { settled = true; clearTimeout(timer); }

        var r = google.script.run;

        // An exception thrown INSIDE a success handler is caught by nobody:
        // google.script.run does not route it to the failure handler, and the
        // page is left on whatever it was showing - almost always a spinner.
        // Every stuck-loading screen in this project has been that. Catch it here
        // once, so no handler anywhere has to remember to.
        r = r.withSuccessHandler(function (result) {
          done();
          if (!ok || abandoned()) return;
          try {
            ok(result);
          } catch (e) {
            // A handler that threw because the server sent NOTHING is a
            // different fault from a handler with a bug in it, and it gets a
            // different sentence. google.script.run delivers null rather than
            // failing when it cannot encode a return value, so "Cannot read
            // properties of null" here means the page had nothing to draw -
            // and naming whichever field it happened to read first sends
            // whoever reads the message off in the wrong direction entirely.
            var empty = (result === null || result === undefined);
            report(empty
              ? name + ' sent nothing back, so there was nothing to draw. Reload the ' +
                'page. If it keeps happening, the deployment may be older than the code ' +
                '- open ?page=diag on this address and compare the deployment URL it ' +
                'reports with the one in your browser.'
              : 'Could not display the result of ' + name + '. This is a fault in ' +
                'the portal, not in anything you did.',
              name + ': ' + (empty ? 'the server returned no data. ' : '') +
              (e && e.message ? e.message : String(e)) +
              '\n\n' + (e && e.stack ? String(e.stack).split('\n').slice(0, 4).join('\n') : ''));
          }
        });

        r = r.withFailureHandler(function (e) {
          done();
          if (abandoned()) return;
          if (fail) {
            try { fail(e); return; } catch (inner) { /* fall through to the banner */ }
          }
          report(e && e.message ? e.message : 'The server returned an error.',
                 name + ' failed on the server.');
        });

        return r.apiCall(SESSION.token, name, args);
      };
    }
  });
  return proxy;
}

/**
 * The sign-in panel. Shown by any page that finds no session.
 *
 * @param {string} note  optional line explaining why they are seeing it
 */
function signInPanel(note) {
  // The caller writes this string into the page after we return, so the field
  // does not exist yet. One tick later it does, and somebody who came here to
  // sign in can start typing without reaching for the mouse.
  setTimeout(function () { focusOn('siEmail'); }, 0);

  return '<div class="signin-split">' +
    '<div class="signin-form">' +
      (note ? banner('info', note) : '') +
      '<div id="signinBody">' + emailStep() + '</div>' +
      '<div id="signinMsg"></div>' +
      signInHelp() +
    '</div>' +
    signInArt() +
  '</div>';
}

/** Where to write when the code never comes. */
function signInHelp() {
  var addr = (typeof SUPPORT_EMAIL !== 'undefined' && SUPPORT_EMAIL)
    ? String(SUPPORT_EMAIL) : '';
  if (!addr) return '';
  return '<p class="signin-foot">Trouble signing in? Write to ' +
    '<a href="mailto:' + esc(addr) + '">' + esc(addr) + '</a>.</p>';
}

/**
 * The right-hand panel: a hostel, drawn rather than described.
 *
 * Deliberately wordless. Everything this page has to say fits beside the field
 * it applies to, and a picture holds the other half of the card without adding
 * another paragraph to read.
 *
 * Inline SVG, not an image file: it costs no request, cannot 404 behind a
 * corporate proxy, and takes its colours from the same palette as the rest.
 */
function signInArt() {
  var lit = { '0-2': 1, '1-0': 1, '1-3': 1, '2-1': 1, '3-2': 1, '3-3': 1 };
  var windows = '';
  // Four rows, not five: the fifth would have run through the doorway.
  for (var r = 0; r < 4; r++) {
    for (var c = 0; c < 4; c++) {
      // Written out as a loop because twenty rectangles typed in a row hide the
      // shape they make, which is the only reason any of them are here.
      windows += '<rect x="' + (40 + c * 25) + '" y="' + (78 + r * 25) + '" ' +
        'width="15" height="16" rx="2" ' +
        (lit[r + '-' + c] ? 'fill="#e8971a"' : 'fill="#ffffff" fill-opacity=".13"') + '/>';
    }
  }

  return '<div class="signin-art" aria-hidden="true">' +
    '<svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg" fill="none" ' +
         'stroke="#8ea3c4" stroke-width="1.6" stroke-linecap="round" ' +
         'stroke-linejoin="round">' +

      // The main block, and its roof.
      '<path d="M28 74h122v130H28z"/>' +
      '<path d="M20 74l69-30 69 30"/>' +
      windows +

      // A lower wing to the right, so the silhouette is a place and not a slab.
      '<path d="M150 128h84v76h-84z"/>' +
      '<rect x="166" y="146" width="16" height="17" rx="2" fill="#ffffff" fill-opacity=".13"/>' +
      '<rect x="196" y="146" width="16" height="17" rx="2" fill="#e8971a"/>' +
      '<path d="M166 204v-22h20v22"/>' +

      // The way in.
      '<path d="M74 204v-30h30v30"/>' +
      '<path d="M89 186v6"/>' +

      // Ground, and two plants for scale.
      '<path d="M8 204h244" stroke="#ffffff" stroke-opacity=".22"/>' +
      '<path d="M250 204c0-12-7-18-14-18M236 204c0-8 5-12 10-12"/>' +
      '<path d="M14 204c0-14 8-20 15-20M29 204c0-9-5-13-10-13"/>' +
    '</svg>' +
  '</div>';
}

function emailStep() {
  return '<h2>Sign in</h2>' +
    '<p class="lede">We will email you a six-digit code.</p>' +
    '<label class="field signin-field"><span class="lab">Email address</span>' +
    '<input type="email" id="siEmail" autocomplete="email" inputmode="email" ' +
    'placeholder="you@example.com" onkeydown="if(event.key===&quot;Enter&quot;)sendCode()">' +
    // The one thing a first-year has to be told, said where it answers the
    // question rather than in a panel arguing the case for the whole portal.
    '<span class="help">Any address works. You do not need a college one.</span></label>' +
    '<button class="btn" id="siBtn" onclick="sendCode()">Send code</button>';
}

function codeStep(email) {
  return '<h2>Enter your code</h2>' +
    '<p class="lede">It is good for ten minutes.</p>' +
    '<div class="signin-to"><span class="addr">' + esc(email) + '</span>' +
      '<button type="button" class="linkish" onclick="backToEmail()">Change</button></div>' +
    '<label class="field signin-field"><span class="lab">Six-digit code</span>' +
    '<input type="text" id="siCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" ' +
    'placeholder="000000" onkeydown="if(event.key===&quot;Enter&quot;)submitCode()">' +
    '</label>' +
    '<button class="btn" id="siBtn" onclick="submitCode()">Sign in</button>' +
    // Resending used to mean going back and typing the address in again, which
    // is the last thing anybody wants when the first mail has not arrived.
    '<p class="signin-foot">Not arrived? Check spam, or ' +
    '<button type="button" class="linkish" id="siResend" ' +
    'onclick="resendCode()">send another code</button>.</p>';
}

var _siEmail = '';

function backToEmail() {
  setHtml('signinBody', emailStep());
  setHtml('signinMsg', '');
  focusOn('siEmail');
}

/** Focus without stealing it from someone already typing. */
function focusOn(id) {
  var node = el(id);
  if (!node) return;
  try {
    if (document.activeElement && document.activeElement !== document.body &&
        document.activeElement !== node) return;
    node.focus();
  } catch (e) { /* focus is a nicety, never a requirement */ }
}

/**
 * Another code for the same address.
 *
 * The server allows four an hour, which is generous for a person and mean for
 * a script. The thirty seconds here is not the security control - it is so
 * that pressing the button twice in frustration does not spend two of them.
 */
function resendCode() {
  var btn = el('siResend');
  if (!_siEmail || (btn && btn.disabled)) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending\u2026'; }

  srv().withSuccessHandler(function () {
      setHtml('signinMsg', banner('good', 'A new code is on its way to ' + _siEmail + '.'));
      countdown(btn, 30, 'Send another code');
    })
    .withFailureHandler(function (e) {
      setHtml('signinMsg', banner('err', e.message));
      countdown(btn, 30, 'Send another code');
    })
    .apiRequestSignInCode(_siEmail);
}

/** Count a button back to life, so the wait is visible rather than mysterious. */
function countdown(btn, seconds, label) {
  if (!btn) return;
  var left = seconds;
  btn.disabled = true;
  btn.textContent = label + ' (' + left + ')';
  var t = setInterval(function () {
    left--;
    // The panel may have been replaced - by signing in, or by going back to the
    // address step. Stop rather than write into a button that is not there.
    if (!el('siResend')) { clearInterval(t); return; }
    if (left <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = label;
      return;
    }
    btn.textContent = label + ' (' + left + ')';
  }, 1000);
}

function sendCode() {
  var input = el('siEmail');
  if (!input) return;
  var addr = String(input.value || '').trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(addr)) {
    setHtml('signinMsg', banner('err', 'That does not look like an email address.'));
    return;
  }
  _siEmail = addr;
  var btn = el('siBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending'; }

  srv().withSuccessHandler(function () {
      setHtml('signinBody', codeStep(_siEmail));
      setHtml('signinMsg', '');
      var b = el('siResend');
      if (b) countdown(b, 30, 'Send another code');
      focusOn('siCode');
    })
    .withFailureHandler(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Email me a code'; }
      setHtml('signinMsg', banner('err', e.message));
    })
    .apiRequestSignInCode(addr);
}

function submitCode() {
  var input = el('siCode');
  if (!input) return;
  var btn = el('siBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking'; }

  srv().withSuccessHandler(function (r) {
      saveToken(r.token);
      // The page that showed the panel knows how to draw itself for a signed-in
      // visitor; let it, rather than throwing the document away and starting
      // again. Only a page that offers no way back falls through to navigating.
      if (typeof onSignedIn === 'function') { onSignedIn(); return; }
      reloadTop();
    })
    .withFailureHandler(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
      setHtml('signinMsg', banner('err', e.message));
    })
    .apiVerifySignInCode(_siEmail, String(input.value || ''));
}

var FLASH_KEY = 'ggsipu.hostel.flash';

/**
 * Leave a message for the page we are about to navigate to.
 *
 * Submitting the application form does move the visitor to their dashboard -
 * that is the right destination, not a refresh - but they arrived to a page
 * that said nothing about what had just happened. The query string cannot carry
 * it: the frame's URL is not the address bar's.
 */
function flashOnNextPage(kind, text) {
  try { window.localStorage.setItem(FLASH_KEY, JSON.stringify({ kind: kind, text: text })); }
  catch (e) { /* the navigation still happens; only the note is lost */ }
}

/** Take the message left by the previous page, once. */
function takeFlash() {
  try {
    var raw = window.localStorage.getItem(FLASH_KEY);
    if (!raw) return null;
    window.localStorage.removeItem(FLASH_KEY);
    return JSON.parse(raw);
  } catch (e) { return null; }
}

/**
 * Reload the page the visitor is actually looking at.
 *
 * NOT window.top.location.reload(). The app runs in a sandboxed iframe served
 * from googleusercontent.com while the address bar is on script.google.com, so
 * the two frames are different origins. A cross-origin location may be WRITTEN
 * to - that is a navigation, and navigation is permitted - but not READ from,
 * and reload() has to be read off the object before it can be called. It throws
 * "Blocked a frame with origin ... from accessing a cross-origin frame", which
 * surfaces as a failure on whatever call had just succeeded.
 *
 * Assigning href does the same job and is allowed.
 *
 * @param {string=} query e.g. '?page=admin'. Defaults to the student portal.
 */
/**
 * Where this account belongs.
 *
 * An administrator's home is the dashboard and a student's is their own
 * application, and neither has any business on the other. doGet cannot make
 * this decision: a visitor signed in with an email code carries their session
 * in the browser, and the token arrives on the API call rather than the page
 * request - so the server building the page genuinely does not know who is
 * asking. The pages settle it on their first answer instead.
 */
function homeFor(who) {
  return (who && who.isAdmin) ? '?page=admin' : '?';
}

/**
 * Move the whole browser tab to another page of this app.
 *
 * This is the least reliable thing the client does, and it is worth being
 * honest about why. The app runs inside a sandboxed iframe served from a
 * different origin, and that sandbox permits top-level navigation only "by
 * user activation" - so a navigation started from a page-load callback rather
 * than from a click can be refused by the browser with no error to catch. The
 * page then simply sits there, which reads as a hang.
 *
 * So: try, and if nothing has happened shortly afterwards, put a real link on
 * the screen. A link carries the activation the automatic attempt lacked, and
 * a visible way forward beats a page that has quietly stopped.
 */
function reloadTop(query, label) {
  var url = appUrl(query || '?');
  try {
    window.top.location.href = url;
  } catch (e) {
    // Not a frame we are allowed to navigate. Move this one instead.
    try { window.location.href = url; } catch (e2) { /* offer the link below */ }
  }

  // Long enough that a page which IS on its way does not flash a warning at
  // the reader on the way out.
  setTimeout(function () { offerLink_(url, label); }, 2500);
}

/**
 * The visible way forward when a navigation did not take.
 *
 * Deliberately additive: it is written into #msg or over #root only if the
 * page is still here to write into, which by definition means the navigation
 * did not happen.
 */
function offerLink_(url, label) {
  var box = el('msg') || el('root');
  if (!box) return;
  setHtml(box.id,
    '<div class="banner info"><span class="bic">i</span><span>' +
    'Your browser did not follow the link automatically. ' +
    '<a href="' + esc(url) + '" target="_top">' +
    esc(label || 'Continue') + '</a></span></div>');
}

/**
 * Sign out without leaving the page.
 *
 * The session is a token this browser holds, so signing out is discarding it -
 * there is nothing on the server to tell. Navigating afterwards was pure
 * habit, and it was the riskiest moment in the whole app: a signed-out visitor
 * being sent to the deployment URL is exactly when Google is most likely to
 * answer with one of its own error pages instead of ours.
 *
 * Pages that can draw their own signed-out state say so with onSignedOut().
 */
function signOut() {
  saveToken(null);
  SESSION.email = ''; SESSION.isAdmin = false; SESSION.via = null; SESSION.checked = false;
  if (typeof onSignedOut === 'function') { onSignedOut(); return; }
  reloadTop('?', 'Go to the sign-in page');
}

/**
 * chrome.html - shared page furniture and helpers.
 *
 * Included by every page so the masthead, navigation and formatting helpers
 * stay identical across the portal. Included BEFORE each page's own script.
 */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function el(id) { return document.getElementById(id); }

/**
 * Write into an element that may no longer be there.
 *
 * Every panel on every page is painted by a callback that runs some time after
 * the call that asked for it. In between, the person can move to another tab,
 * sign out, or trigger a redraw - and the node the callback was going to write
 * into stops existing. The assignment then throws inside a success handler,
 * which surfaces as "Cannot set properties of null" over the top of a page that
 * was working perfectly well.
 *
 * Nothing has gone wrong in that situation. The answer simply arrived for a
 * screen nobody is looking at any more, and the right thing to do with it is
 * nothing. Every write goes through here so that no handler has to remember.
 *
 * @return {boolean} whether it landed anywhere.
 */
function setHtml(id, html) {
  var node = el(id);
  if (!node) return false;
  node.innerHTML = html;
  return true;
}

/**
 * Absolute URL for an in-app link.
 *
 * Apps Script serves the page inside a sandboxed iframe hosted on
 * googleusercontent.com. A relative href navigates THAT frame relative to its
 * own origin, which lands nowhere and shows a blank screen. Every internal link
 * must therefore be absolute and target _top.
 */
function appUrl(query) {
  var base = (typeof WEBAPP_URL === 'string' && WEBAPP_URL) ? WEBAPP_URL : '';
  if (!query || query === '?') return base;
  return base + (query.charAt(0) === '?' ? query : '?' + query);
}

function appLink(query, text, cls) {
  return '<a href="' + esc(appUrl(query)) + '" target="_top"' +
         (cls ? ' class="' + cls + '"' : '') + '>' + esc(text) + '</a>';
}

function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2)
    .map(function (w) { return w.charAt(0); }).join('').toUpperCase() || '?';
}

/**
 * The university emblem, with the monogram behind it.
 *
 * The image is whatever LOGO_URL in the Config sheet points at, so the real
 * crest can be swapped in without a code change or a redeploy. If it is unset,
 * or the file cannot be fetched, the monogram stays - a masthead with a broken
 * image icon in it looks worse than one with no image at all, and this page is
 * the first thing a judge sees.
 */
function crestMarkup() {
  var url = (typeof LOGO_URL !== 'undefined' && LOGO_URL) ? String(LOGO_URL) : '';
  if (!url) return '<div class="crest">IPU</div>';
  return '<div class="crest has-img">' +
    '<img src="' + esc(url) + '" alt="Guru Gobind Singh Indraprastha University" ' +
    'onerror="this.parentNode.className=&quot;crest&quot;;this.parentNode.textContent=&quot;IPU&quot;">' +
    '</div>';
}

/** Renders the masthead and navigation into #chrome. */
function paintChrome(opts) {
  opts = opts || {};
  var tabs = opts.tabs || [];
  var user = opts.user || null;

  var nav = tabs.map(function (t) {
    return '<a href="' + esc(appUrl(t.href)) + '" target="_top"' +
           (t.on ? ' class="on"' : '') + '>' + esc(t.label) + '</a>';
  }).join('');

  var chip = user
    ? '<div class="userchip"><span class="av">' + esc(initials(user.name || user.email)) +
      '</span><span class="nm">' + esc(user.name || user.email) + '</span>' +
      (user.role ? '<span class="rl">' + esc(user.role) + '</span>' : '') +
      // Only offered to someone holding a browser session. A visitor Google
      // identified has nothing here to sign out of.
      (user.signOut ? '<button class="signout" onclick="signOut()">Sign out</button>' : '') +
      '</div>'
    : '';

  var target = el('chrome');
  if (!target) return;
  target.innerHTML =
    '<header class="masthead"><div class="row">' +
      crestMarkup() +
      '<div class="who-we-are">' +
        '<div class="org">Guru Gobind Singh Indraprastha University</div>' +
        '<div class="unit">' + esc(opts.unit || 'Hostel Allocation Portal') + '</div>' +
      '</div>' +
      '<div class="spacer"></div>' + chip +
    '</div></header>' +
    (nav ? '<nav class="navbar"><div class="row">' + nav + '</div></nav>' : '');
}

/** Human labels for the enum values stored in the sheet. */
var LABEL = {
  status: {
    DRAFT:'Draft', SUBMITTED:'Submitted', VERIFIED:'Verified', REJECTED:'Not eligible',
    ALLOTTED:'Room allotted', WAITLISTED:'On waiting list', WITHDRAWN:'Withdrawn',
    CANCELLED:'Cancelled'
  },
  roomType: { SINGLE:'Single room', TRIPLE:'3-seater room', QUAD:'4-seater room' },
  // The priority groups, in the words the brochure uses.
  tier: {
    PWD:'Disabled / handicapped', OUTSIDE_DELHI:'Outside Delhi',
    PARENT_TRANSFERRED:'Delhi, parent transferred out', DELHI:'Delhi category',
    FOREIGN:'Foreign student', READMISSION:'Re-admission'
  },
  admissionType: { FRESH:'Fresh admission', READMISSION:'Re-admission' },
  residence: { DELHI:'Delhi', OUTSIDE_DELHI:'Outside Delhi' },
  campus:   { DWARKA:'Dwarka Campus', EDC:'East Delhi Campus' },
  gender:   { M:'Boys', F:'Girls', CO:'Co-educational' },
  doc: {
    VERIFIED:'Verified', UPLOADED:'Under review', REJECTED:'Needs resubmission',
    WAIVED:'Not required', REQUIRED:'Not uploaded yet', PENDING:'Awaiting upload',
    SUBMITTED:'Under review'
  },
  grievance: {
    AUTO_ANSWERED:'Answered', RESOLVED:'Resolved', ESCALATED:'With the hostel office',
    OPEN:'Open', CLOSED:'Closed'
  },
  category: {
    GEN:'General', OBC:'OBC', SC:'Scheduled Caste', ST:'Scheduled Tribe',
    EWS:'EWS', OPEN:'Open merit', CONVERTED:'Converted seat',
    PWD_HORIZONTAL:'PwD reservation'
  }
};

function label(kind, value, fallback) {
  var m = LABEL[kind] || {};
  return m[value] || fallback || value || '';
}

function pill(kind, text) {
  return '<span class="pill ' + kind + '">' + esc(text) + '</span>';
}

/**
 * A collapsed block for reference numbers, hashes and seeds.
 * They are evidence rather than decoration, so they stay one click away
 * instead of making the page look like a console.
 */
function techDetails(title, pairs) {
  var rows = pairs.filter(function (p) { return p[1]; }).map(function (p) {
    return '<dt>' + esc(p[0]) + '</dt><dd class="' + (p[2] === 'mono' ? 'mono' : '') + '">' +
           esc(p[1]) + '</dd>';
  }).join('');
  if (!rows) return '';
  return '<details class="tech"><summary>' + esc(title || 'Reference details') + '</summary>' +
         '<div class="inner"><dl class="kv">' + rows + '</dl></div></details>';
}

function banner(kind, text, icon) {
  var ic = icon || { err:'!', good:'✓', info:'i', warn:'!' }[kind] || 'i';
  return '<div class="banner ' + kind + '"><span class="bic">' + ic + '</span>' +
         '<span>' + esc(text) + '</span></div>';
}

/**
 * The line icons this portal uses, and the only ones it uses.
 *
 * Emoji were doing this job, and they are the single clearest tell that a
 * university portal was assembled rather than designed. Every platform draws
 * them differently - a padlock is flat and grey on Windows, gold and shaded on
 * a Mac, a different shape again on Android - so the one thing you cannot do
 * with an emoji is control what the reader sees. At the 34px these were being
 * shown at, that is not a small difference.
 *
 * These are drawn in the same weight as the icons already on the admin rail:
 * one stroke width, no fill, currentColor. Nothing here is decorative - each
 * one names the state the page is in, and a page with no state to name gets no
 * icon at all.
 */
var GLYPH = {
  lock:     'M7 11V8a5 5 0 0110 0v3M5.5 11h13a1 1 0 011 1v8a1 1 0 01-1 1h-13a1 1 0 01-1-1v-8a1 1 0 011-1z',
  building: 'M3 21h18M5 21V6l7-3 7 3v15M9.5 21v-4h5v4M9 9.5h.01M15 9.5h.01M9 13h.01M15 13h.01',
  calendar: 'M4 6.5h16v14H4zM4 10.5h16M8.5 3.5v4M15.5 3.5v4',
  check:    'M4.5 12.5l5 5 10-11',
  spark:    'M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1M12 8a4 4 0 100 8 4 4 0 000-8z',
  person:   'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5a7.5 7.5 0 0115 0',
  chat:     'M4 5h16v11H9l-5 4z',
  doc:      'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6'
};

/** One icon, at the size the caller asks for, in the colour it inherits. */
function icon(name, size) {
  var d = GLYPH[name];
  if (!d) return '';
  size = size || 22;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" ' +
    'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="' + d + '"/></svg>';
}

/**
 * @param {string} glyph  a name from GLYPH, or '' for no icon at all
 */
function emptyState(glyph, title, body) {
  return '<div class="empty">' +
         (glyph ? '<div class="big">' + icon(glyph, 30) + '</div>' : '') +
         '<h3 style="margin:0 0 4px">' + esc(title) + '</h3>' +
         (body ? '<p class="small" style="margin:0;max-width:420px;display:inline-block">' +
           esc(body) + '</p>' : '') + '</div>';
}

function loadingState(text) {
  return '<div class="empty"><span class="spin"></span> &nbsp;' + esc(text || 'Loading') + '</div>';
}

function card(title, bodyHtml, opts) {
  opts = opts || {};
  return '<div class="card"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' +
    (title ? '<div class="hd"><h2>' + esc(title) + '</h2>' +
      (opts.sub ? '<span class="sub">' + esc(opts.sub) + '</span>' : '') +
      '<span class="grow"></span>' + (opts.action || '') + '</div>' : '') +
    '<div class="bd' + (opts.tight ? ' tight' : '') + '">' + bodyHtml + '</div></div>';
}
</script>
