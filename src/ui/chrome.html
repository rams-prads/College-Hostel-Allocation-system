<script>
/* ===================================================================== auth
 *
 * Google identifies the project owner and their own Workspace domain, and
 * nobody else. A first-year applicant has no college address yet, so for them
 * the session is a signed token this browser holds and sends with each call.
 *
 * srv() is a drop-in for google.script.run: same chaining, but it routes
 * through apiCall so the token rides along. Every existing call site changed by
 * one word, which is why none of them were missed.
 */
var SESSION = { token: null, email: '', isAdmin: false, via: null, checked: false };

var TOKEN_KEY = 'ggsipu.hostel.session';

function loadToken() {
  try { SESSION.token = window.localStorage.getItem(TOKEN_KEY) || null; }
  catch (e) { SESSION.token = null; }   // private windows throw rather than return null
  return SESSION.token;
}
function saveToken(t) {
  SESSION.token = t || null;
  try {
    if (t) window.localStorage.setItem(TOKEN_KEY, t);
    else window.localStorage.removeItem(TOKEN_KEY);
  } catch (e) { /* the in-memory copy still carries this page load */ }
}

/**
 * Show a failure the user can act on, wherever the page happens to be.
 *
 * Written to #msg if the page has one, otherwise over #root - never nowhere.
 */
function showFailure(message, detail) {
  var box = el('msg') || el('root');
  if (!box) return;
  var body = banner('err', message) +
    (detail ? '<details class="tech"><summary>Technical detail</summary>' +
              '<pre class="small" style="white-space:pre-wrap;margin:0">' + esc(detail) +
              '</pre></details>' : '');
  if (el('msg')) box.innerHTML = body; else box.innerHTML = body;
}

var CALL_TIMEOUT_MS = 25000;

function srv() {
  var ok = null, fail = null;

  // The handlers must return the PROXY, not the object behind it. Returning the
  // target breaks the chain at the second link: .withFailureHandler() would hand
  // back a bare object with no api methods on it, and every call site in the
  // project chains twice.
  var proxy = new Proxy({}, {
    get: function (_, prop) {
      if (prop === 'withSuccessHandler') return function (h) { ok = h; return proxy; };
      if (prop === 'withFailureHandler') return function (h) { fail = h; return proxy; };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var name = String(prop);
        var settled = false;

        // A page that is only ever going to show a spinner should say so. Without
        // this, a call that never comes back is indistinguishable from one that
        // is merely slow, and the user waits forever on a screen with no
        // information at all.
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          showFailure('This is taking longer than it should. The server has not ' +
                      'answered in 25 seconds. Reload the page; if it keeps happening, ' +
                      'the deployment may be serving an older version of the code.',
                      name);
        }, CALL_TIMEOUT_MS);

        function done() { settled = true; clearTimeout(timer); }

        var r = google.script.run;

        // An exception thrown INSIDE a success handler is caught by nobody:
        // google.script.run does not route it to the failure handler, and the
        // page is left on whatever it was showing - almost always a spinner.
        // Every stuck-loading screen in this project has been that. Catch it here
        // once, so no handler anywhere has to remember to.
        r = r.withSuccessHandler(function (result) {
          done();
          if (!ok) return;
          try {
            ok(result);
          } catch (e) {
            showFailure('The page could not display what the server sent back. ' +
                        'This is a fault in the portal, not in anything you did.',
                        name + ': ' + (e && e.message ? e.message : String(e)));
          }
        });

        r = r.withFailureHandler(function (e) {
          done();
          if (fail) {
            try { fail(e); return; } catch (inner) { /* fall through to the banner */ }
          }
          showFailure(e && e.message ? e.message : 'The server returned an error.', name);
        });

        return r.apiCall(SESSION.token, name, args);
      };
    }
  });
  return proxy;
}

/**
 * The sign-in panel. Shown by any page that finds no session.
 *
 * @param {string} note  optional line explaining why they are seeing it
 */
function signInPanel(note) {
  return card('',
    '<div class="signin">' +
    '<div class="big">&#127891;</div>' +
    '<h3>Sign in to continue</h3>' +
    (note ? '<p class="small muted intro">' + esc(note) + '</p>' : '') +
    '<p class="small muted intro">Enter the email address you want to apply with. ' +
    'Any address works &mdash; first-year students will not have a college one yet.</p>' +
    '<div id="signinBody">' + emailStep() + '</div>' +
    '<div id="signinMsg"></div>' +
    '</div>');
}

function emailStep() {
  return '<label class="field signin-field"><span class="lab">Email address</span>' +
    '<input type="email" id="siEmail" autocomplete="email" inputmode="email" ' +
    'placeholder="you@example.com" onkeydown="if(event.key===&quot;Enter&quot;)sendCode()">' +
    '</label>' +
    '<button class="btn" id="siBtn" onclick="sendCode()">Email me a code</button>';
}

function codeStep(email) {
  return '<p class="small muted intro">We sent a six-digit code to <strong>' +
    esc(email) + '</strong>. It expires in ten minutes.</p>' +
    '<label class="field signin-field"><span class="lab">Six-digit code</span>' +
    '<input type="text" id="siCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" ' +
    'placeholder="000000" onkeydown="if(event.key===&quot;Enter&quot;)submitCode()">' +
    '</label>' +
    '<button class="btn" id="siBtn" onclick="submitCode()">Sign in</button> ' +
    '<button class="btn ghost" onclick="backToEmail()">Use a different address</button>';
}

var _siEmail = '';

function backToEmail() {
  el('signinBody').innerHTML = emailStep();
  el('signinMsg').innerHTML = '';
}

function sendCode() {
  var input = el('siEmail');
  if (!input) return;
  var addr = String(input.value || '').trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(addr)) {
    el('signinMsg').innerHTML = banner('err', 'That does not look like an email address.');
    return;
  }
  _siEmail = addr;
  var btn = el('siBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending'; }

  srv().withSuccessHandler(function () {
      el('signinBody').innerHTML = codeStep(_siEmail);
      el('signinMsg').innerHTML = '';
      if (el('siCode')) el('siCode').focus();
    })
    .withFailureHandler(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Email me a code'; }
      el('signinMsg').innerHTML = banner('err', e.message);
    })
    .apiRequestSignInCode(addr);
}

function submitCode() {
  var input = el('siCode');
  if (!input) return;
  var btn = el('siBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking'; }

  srv().withSuccessHandler(function (r) {
      saveToken(r.token);
      window.top.location.href = appUrl('?');
    })
    .withFailureHandler(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
      el('signinMsg').innerHTML = banner('err', e.message);
    })
    .apiVerifySignInCode(_siEmail, String(input.value || ''));
}

function signOut() {
  saveToken(null);
  window.top.location.href = appUrl('?');
}

/**
 * chrome.html - shared page furniture and helpers.
 *
 * Included by every page so the masthead, navigation and formatting helpers
 * stay identical across the portal. Included BEFORE each page's own script.
 */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function el(id) { return document.getElementById(id); }

/**
 * Absolute URL for an in-app link.
 *
 * Apps Script serves the page inside a sandboxed iframe hosted on
 * googleusercontent.com. A relative href navigates THAT frame relative to its
 * own origin, which lands nowhere and shows a blank screen. Every internal link
 * must therefore be absolute and target _top.
 */
function appUrl(query) {
  var base = (typeof WEBAPP_URL === 'string' && WEBAPP_URL) ? WEBAPP_URL : '';
  if (!query || query === '?') return base;
  return base + (query.charAt(0) === '?' ? query : '?' + query);
}

function appLink(query, text, cls) {
  return '<a href="' + esc(appUrl(query)) + '" target="_top"' +
         (cls ? ' class="' + cls + '"' : '') + '>' + esc(text) + '</a>';
}

function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2)
    .map(function (w) { return w.charAt(0); }).join('').toUpperCase() || '?';
}

/** Renders the masthead and navigation into #chrome. */
function paintChrome(opts) {
  opts = opts || {};
  var tabs = opts.tabs || [];
  var user = opts.user || null;

  var nav = tabs.map(function (t) {
    return '<a href="' + esc(appUrl(t.href)) + '" target="_top"' +
           (t.on ? ' class="on"' : '') + '>' + esc(t.label) + '</a>';
  }).join('');

  var chip = user
    ? '<div class="userchip"><span class="av">' + esc(initials(user.name || user.email)) +
      '</span><span class="nm">' + esc(user.name || user.email) + '</span>' +
      (user.role ? '<span class="rl">' + esc(user.role) + '</span>' : '') +
      // Only offered to someone holding a browser session. A visitor Google
      // identified has nothing here to sign out of.
      (user.signOut ? '<button class="signout" onclick="signOut()">Sign out</button>' : '') +
      '</div>'
    : '';

  var target = el('chrome');
  if (!target) return;
  target.innerHTML =
    '<header class="masthead"><div class="row">' +
      '<div class="crest">IPU</div>' +
      '<div class="who-we-are">' +
        '<div class="org">Guru Gobind Singh Indraprastha University</div>' +
        '<div class="unit">' + esc(opts.unit || 'Hostel Allocation Portal') + '</div>' +
      '</div>' +
      '<div class="spacer"></div>' + chip +
    '</div></header>' +
    (nav ? '<nav class="navbar"><div class="row">' + nav + '</div></nav>' : '');
}

/** Human labels for the enum values stored in the sheet. */
var LABEL = {
  status: {
    DRAFT:'Draft', SUBMITTED:'Submitted', VERIFIED:'Verified', REJECTED:'Not eligible',
    ALLOTTED:'Room allotted', WAITLISTED:'On waiting list', WITHDRAWN:'Withdrawn',
    CANCELLED:'Cancelled'
  },
  roomType: { SINGLE:'Single room', DOUBLE:'2-seater room', TRIPLE:'3-seater room' },
  campus:   { DWARKA:'Dwarka Campus', EDC:'East Delhi Campus' },
  gender:   { M:'Boys', F:'Girls', CO:'Co-educational' },
  doc: {
    VERIFIED:'Verified', UPLOADED:'Under review', REJECTED:'Needs resubmission',
    WAIVED:'Not required', REQUIRED:'Not uploaded yet', PENDING:'Awaiting upload',
    SUBMITTED:'Under review'
  },
  grievance: {
    AUTO_ANSWERED:'Answered', RESOLVED:'Resolved', ESCALATED:'With the hostel office',
    OPEN:'Open', CLOSED:'Closed'
  },
  category: {
    GEN:'General', OBC:'OBC', SC:'Scheduled Caste', ST:'Scheduled Tribe',
    EWS:'EWS', OPEN:'Open merit', CONVERTED:'Converted seat',
    PWD_HORIZONTAL:'PwD reservation'
  }
};

function label(kind, value, fallback) {
  var m = LABEL[kind] || {};
  return m[value] || fallback || value || '';
}

function pill(kind, text) {
  return '<span class="pill ' + kind + '">' + esc(text) + '</span>';
}

/**
 * A collapsed block for reference numbers, hashes and seeds.
 * They are evidence rather than decoration, so they stay one click away
 * instead of making the page look like a console.
 */
function techDetails(title, pairs) {
  var rows = pairs.filter(function (p) { return p[1]; }).map(function (p) {
    return '<dt>' + esc(p[0]) + '</dt><dd class="' + (p[2] === 'mono' ? 'mono' : '') + '">' +
           esc(p[1]) + '</dd>';
  }).join('');
  if (!rows) return '';
  return '<details class="tech"><summary>' + esc(title || 'Reference details') + '</summary>' +
         '<div class="inner"><dl class="kv">' + rows + '</dl></div></details>';
}

function banner(kind, text, icon) {
  var ic = icon || { err:'!', good:'✓', info:'i', warn:'!' }[kind] || 'i';
  return '<div class="banner ' + kind + '"><span class="bic">' + ic + '</span>' +
         '<span>' + esc(text) + '</span></div>';
}

function emptyState(icon, title, body) {
  return '<div class="empty"><div class="big">' + icon + '</div>' +
         '<h3 style="margin:0 0 4px">' + esc(title) + '</h3>' +
         (body ? '<p class="small" style="margin:0;max-width:420px;display:inline-block">' +
           esc(body) + '</p>' : '') + '</div>';
}

function loadingState(text) {
  return '<div class="empty"><span class="spin"></span> &nbsp;' + esc(text || 'Loading') + '</div>';
}

function card(title, bodyHtml, opts) {
  opts = opts || {};
  return '<div class="card"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' +
    (title ? '<div class="hd"><h2>' + esc(title) + '</h2>' +
      (opts.sub ? '<span class="sub">' + esc(opts.sub) + '</span>' : '') +
      '<span class="grow"></span>' + (opts.action || '') + '</div>' : '') +
    '<div class="bd' + (opts.tight ? ' tight' : '') + '">' + bodyHtml + '</div></div>';
}
</script>
