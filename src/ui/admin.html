<?!= include('ui/styles'); ?>
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 11px; }
  .tile { background: var(--surface-2); border-radius: 9px; padding: 13px 15px; }
  .tile .n { font-size: 25px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1;
             font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.grid th { text-align: left; font-size: 11.5px; text-transform: uppercase;
                  letter-spacing: .05em; color: var(--muted); font-weight: 620;
                  padding: 0 10px 7px 0; border-bottom: 1px solid var(--border); }
  table.grid td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border);
                  vertical-align: middle; }
  table.grid tr:last-child td { border-bottom: 0; }
  .meter { height: 7px; background: var(--surface-2); border-radius: 4px;
           overflow: hidden; min-width: 80px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter i.hot { background: var(--bad); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .ledger-ok  { background: var(--ok-soft);  border: 1px solid var(--ok);  color: var(--ok); }
  .ledger-bad { background: var(--bad-soft); border: 1px solid var(--bad); color: var(--bad); }
  .ledger { padding: 13px 15px; border-radius: 9px; font-size: 13.5px; }
  .ledger .t { font-weight: 640; font-size: 14.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>

<header class="top">
  <div class="inner">
    <div><h1>Administrator Dashboard</h1><div class="sub">GGSIPU Hostel Allocation</div></div>
    <div class="who" id="who"><a href="?" style="color:inherit">Student view</a></div>
  </div>
</header>

<div class="wrap" id="root"><div class="empty">Loading dashboard&hellip;</div></div>

<script>
  var D = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function el(id) { return document.getElementById(id); }

  function load() {
    google.script.run.withSuccessHandler(render).withFailureHandler(function (e) {
      el('root').innerHTML = '<div class="banner err">' + esc(e.message) + '</div>';
    }).apiAdminOverview();
  }
  load();

  function render(d) {
    D = d;
    el('who').innerHTML = esc(d.admin.name || d.admin.email) + ' &middot; ' + esc(d.admin.role) +
      ' &middot; <a href="?" style="color:inherit">Student view</a>';

    var m = d.latestRun && d.latestRun.metrics ? d.latestRun.metrics.summary : null;

    el('root').innerHTML = [
      '<div id="msg"></div>',
      ledgerCard(d),
      countsCard(d),
      m ? metricsCard(d, m) : noRunCard(),
      occupancyCard(d),
      m ? quotaCard(d.latestRun.metrics) : '',
      lookupCard(),
      '<div id="simCard"></div>',
      '<div id="grievCard"></div>',
      '<div id="swapCard"></div>',
      operationsCard(d)
    ].join('');

    loadSimulator();
    loadGrievances();
    loadSwaps();
  }

  /* ============================================== student lookup / view-as */

  function lookupCard() {
    return '<div class="card"><h2>Look up a student</h2>' +
      '<p class="small muted" style="margin:-4px 0 11px">Open any applicant\u2019s portal exactly ' +
      'as they see it, including the explanation of their own outcome. Useful at a counter, and ' +
      'the fastest way to answer "why did I not get a room".</p>' +
      '<label class="field" style="margin-bottom:9px">' +
      '<input type="text" id="lookupQ" placeholder="Name, enrolment number or application ID" ' +
      'oninput="doLookup(this.value)"></label>' +
      '<div id="lookupResults"></div>' +
      '<div id="studentView"></div></div>';
  }

  var lookupTimer = null;
  function doLookup(q) {
    clearTimeout(lookupTimer);
    if (!q || q.length < 2) { el('lookupResults').innerHTML = ''; return; }
    lookupTimer = setTimeout(function () {
      google.script.run.withSuccessHandler(function (rows) {
        if (!rows.length) {
          el('lookupResults').innerHTML = '<p class="muted small">No match.</p>';
          return;
        }
        el('lookupResults').innerHTML = '<div class="scroll-x"><table class="grid"><tbody>' +
          rows.map(function (r) {
            return '<tr><td><strong>' + esc(r.name) + '</strong>' +
              '<div class="muted small">' + esc(r.enrollmentNo) + ' \u00b7 ' +
              esc(r.programme) + ' \u00b7 ' + esc(r.category) + '</div></td>' +
              '<td><span class="pill info">' + esc(r.status.toLowerCase()) + '</span></td>' +
              '<td><button class="btn ghost" style="padding:5px 11px;font-size:13px" ' +
              'onclick="viewStudent(&quot;' + esc(r.appId) + '&quot;)">Open portal</button></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).withFailureHandler(function () {}).apiAdminFindStudent(q);
    }, 250);
  }

  function viewStudent(appId) {
    el('studentView').innerHTML =
      '<div class="banner info" style="margin-top:12px"><span class="spin"></span> Loading\u2026</div>';
    google.script.run
      .withSuccessHandler(paintStudentView)
      .withFailureHandler(function (e) {
        el('studentView').innerHTML = '<div class="banner err" style="margin-top:12px">' +
          esc(e.message) + '</div>';
      })
      .apiGetStudentView(appId);
  }

  function paintStudentView(v) {
    if (!v.student) { el('studentView').innerHTML = ''; return; }

    var outcome;
    if (v.allocation) {
      outcome = '<div class="ledger ledger-ok"><div class="t">Room ' + esc(v.allocation.roomNo) +
        ' \u00b7 ' + esc(v.allocation.hostelName) + '</div><div>' +
        (v.allocation.prefRankMet >= 1 ? 'Preference ' + esc(v.allocation.prefRankMet) + ' granted'
                                       : 'Assigned outside stated preferences') +
        (v.allocation.isAccessible ? ' \u00b7 accessible room' : '') + '</div></div>';
    } else if (v.waitlist) {
      outcome = '<div class="ledger" style="background:var(--warn-soft);border:1px solid var(--warn);' +
        'color:var(--warn)"><div class="t">Waiting list position ' + esc(v.waitlist.position) +
        '</div><div>' + esc(v.waitlist.etaPercent) + '% estimated chance of allotment</div></div>';
    } else {
      outcome = '<div class="ledger" style="background:var(--bad-soft);border:1px solid var(--bad);' +
        'color:var(--bad)"><div class="t">' + esc(v.application ? v.application.status : 'No application') +
        '</div></div>';
    }

    var why = '';
    if (v.explanation) {
      why = '<div class="grp-title" style="margin:14px 0 7px">What this student is shown</div>' +
        '<div class="why"><h3 style="margin:0 0 9px">' + esc(v.explanation.headline) + '</h3>' +
        v.explanation.groups.map(function (g) {
          return '<div class="grp"><div class="grp-title">' + esc(g.title) + '</div><ul>' +
            g.items.map(function (i) {
              return '<li class="' + (i.ok ? 'yes' : 'no') + '"><span class="mark">' +
                (i.ok ? '\u2713' : '\u2717') + '</span><span>' + esc(i.text) + '</span></li>';
            }).join('') + '</ul></div>';
        }).join('') + '</div>';
    }

    el('studentView').innerHTML = '<div class="divider"></div>' +
      '<h3 style="margin:0 0 3px">' + esc(v.student.name) + '</h3>' +
      '<p class="muted small" style="margin:0 0 11px">' + esc(v.student.enrollmentNo) + ' \u00b7 ' +
      esc(v.student.programme) + ' ' + esc(v.student.branch) + ', year ' + esc(v.student.year) +
      ' \u00b7 ' + esc(v.student.category) + (v.student.isPwD ? ' PwD' : '') +
      ' \u00b7 ' + esc(v.student.homeState) + '</p>' +
      outcome + why +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn quiet" onclick="el(&quot;studentView&quot;).innerHTML=&quot;&quot;">Close</button></div>';
  }

  /* ================================================= what-if simulator */

  var KNOBS = [], PENDING = {};

  function loadSimulator() {
    google.script.run.withSuccessHandler(function (k) {
      KNOBS = k; paintSimulator();
    }).withFailureHandler(function () {}).apiAdminSimulatorKnobs();
  }

  function paintSimulator() {
    var rows = KNOBS.map(function (k, i) {
      var pending = PENDING[k.category + '|' + k.key];
      var val = pending !== undefined ? pending : k.value;
      var changed = pending !== undefined && Number(pending) !== Number(k.value);
      return '<tr><td><div class="n" style="font-weight:560">' + esc(k.label) + '</div>' +
        '<div class="muted small">' + esc(k.help) + '</div></td>' +
        '<td style="width:150px"><input type="number" step="' + esc(k.step) + '" min="' +
          esc(k.min) + '" max="' + esc(k.max) + '" value="' + esc(val) +
          '" oninput="setKnob(' + i + ', this.value)" ' +
          'style="' + (changed ? 'border-color:var(--accent);font-weight:600' : '') + '"></td>' +
        '<td class="num muted small">' + (changed ? 'was ' + esc(k.value) : '') + '</td></tr>';
    }).join('');

    var pendingCount = Object.keys(PENDING).filter(function (key) {
      var k = KNOBS.filter(function (x) { return x.category + '|' + x.key === key; })[0];
      return k && Number(PENDING[key]) !== Number(k.value);
    }).length;

    el('simCard').innerHTML = '<div class="card"><h2>What-if simulator</h2>' +
      '<p class="small muted" style="margin:-4px 0 12px">Change a rule and see the effect ' +
      '<strong>before</strong> committing. Nothing is written until you press Commit \u2014 the ' +
      'modified policy exists only in memory while the simulation runs.</p>' +
      '<div id="simMsg"></div>' +
      '<div class="scroll-x"><table class="grid"><tbody>' + rows + '</tbody></table></div>' +
      '<div class="btn-row" style="margin-top:12px">' +
        '<button class="btn" ' + (pendingCount ? '' : 'disabled') +
          ' onclick="runSim()">Simulate ' + (pendingCount ? '(' + pendingCount + ' change' +
          (pendingCount === 1 ? '' : 's') + ')' : '') + '</button>' +
        '<button class="btn quiet" onclick="resetKnobs()">Reset</button>' +
      '</div><div id="simResult"></div></div>';
  }

  function setKnob(i, value) {
    PENDING[KNOBS[i].category + '|' + KNOBS[i].key] = value;
    var btn = el('simCard').querySelector('.btn');
    if (btn) btn.disabled = false;
  }

  function resetKnobs() { PENDING = {}; el('simResult').innerHTML = ''; paintSimulator(); }

  function pendingChanges() {
    return KNOBS.filter(function (k) {
      var v = PENDING[k.category + '|' + k.key];
      return v !== undefined && Number(v) !== Number(k.value);
    }).map(function (k) {
      return { category: k.category, key: k.key,
               value: Number(PENDING[k.category + '|' + k.key]) };
    });
  }

  function runSim() {
    var changes = pendingChanges();
    if (!changes.length) return;
    el('simResult').innerHTML =
      '<div class="banner info" style="margin-top:12px"><span class="spin"></span> ' +
      'Running two full allocations to isolate the effect\u2026</div>';

    google.script.run
      .withSuccessHandler(paintSimResult)
      .withFailureHandler(function (e) {
        el('simResult').innerHTML = '<div class="banner err" style="margin-top:12px">' +
          esc(e.message) + '</div>';
      })
      .apiAdminSimulate(changes, null);
  }

  function delta(n, invert) {
    if (n === 0 || n === undefined) return '<span class="muted">no change</span>';
    var good = invert ? n < 0 : n > 0;
    var col = good ? 'var(--ok)' : 'var(--bad)';
    return '<span style="color:' + col + ';font-weight:620">' +
      (n > 0 ? '+' : '') + n + '</span>';
  }

  function paintSimResult(r) {
    var changeList = r.changes.map(function (c) {
      return '<li>' + esc(c.key) + ': <strong>' + esc(c.from) + ' \u2192 ' + esc(c.to) +
        '</strong></li>';
    }).join('');

    var moves = r.sample.map(function (m) {
      var badge = { LOST: 'bad', GAINED: 'ok', MOVED: 'info' }[m.change];
      var word = { LOST: 'loses their seat', GAINED: 'gains a seat', MOVED: 'moves room' }[m.change];
      return '<tr><td>' + esc(m.name) + '<div class="muted small">' + esc(m.category) +
        '</div></td>' +
        '<td><span class="pill ' + badge + '">' + esc(word) + '</span></td>' +
        '<td class="muted small">' + (m.from ? esc(m.from.hostelName) + ' ' + esc(m.from.roomNo) : '\u2014') +
        ' \u2192 ' + (m.to ? esc(m.to.hostelName) + ' ' + esc(m.to.roomNo) : '\u2014') + '</td></tr>';
    }).join('');

    el('simResult').innerHTML =
      '<div class="divider"></div>' +
      '<div class="grp-title" style="margin-bottom:7px">Simulated changes</div>' +
      '<ul class="small" style="margin:0 0 12px;padding-left:20px">' + changeList + '</ul>' +
      '<div class="scroll-x"><table class="grid"><thead><tr><th>Measure</th>' +
      '<th class="num">Before</th><th class="num">After</th><th class="num">Change</th></tr></thead><tbody>' +
        simRow('Allotted', r.before.allocated, r.after.allocated, r.deltas.allocated, false) +
        simRow('Waitlisted', r.before.waitlisted, r.after.waitlisted, r.deltas.waitlisted, true) +
        simRow('First preference met %', r.before.pref1Pct, r.after.pref1Pct, r.deltas.pref1Pct, false) +
        simRow('Room utilisation %', r.before.utilisationPct, r.after.utilisationPct, r.deltas.utilisationPct, false) +
        simRow('Roommate compatibility %', r.before.meanCompatPct, r.after.meanCompatPct, r.deltas.meanCompatPct, false) +
      '</tbody></table></div>' +

      '<div class="tiles" style="margin-top:13px">' +
        '<div class="tile"><div class="n" style="color:var(--bad)">' + esc(r.movement.lost) +
          '</div><div class="l">lose their seat</div></div>' +
        '<div class="tile"><div class="n" style="color:var(--ok)">' + esc(r.movement.gained) +
          '</div><div class="l">gain a seat</div></div>' +
        '<div class="tile"><div class="n">' + esc(r.movement.moved) +
          '</div><div class="l">change room</div></div>' +
        '<div class="tile"><div class="n">' + esc(r.movement.unchanged) +
          '</div><div class="l">unaffected</div></div>' +
      '</div>' +

      (moves ? '<div class="grp-title" style="margin:15px 0 7px">Who is affected</div>' +
        '<div class="scroll-x"><table class="grid"><tbody>' + moves + '</tbody></table></div>' +
        '<p class="small muted" style="margin:8px 0 0">Showing a sample. ' +
        esc(r.movement.totalAffected) + ' students are affected in total.</p>' : '') +

      '<div class="divider"></div>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="commitSim()">Commit this policy</button>' +
        '<button class="btn quiet" onclick="resetKnobs()">Discard</button>' +
        '<span class="small muted">Policy hash ' + esc(r.policyHashBefore) + ' \u2192 ' +
        esc(r.policyHashAfter) + '</span>' +
      '</div>';
  }

  function simRow(label, before, after, d, invert) {
    return '<tr><td>' + esc(label) + '</td><td class="num">' + esc(before) +
      '</td><td class="num">' + esc(after) + '</td><td class="num">' +
      delta(d, invert) + '</td></tr>';
  }

  function commitSim() {
    var changes = pendingChanges();
    if (!confirm('Write these policy changes and run a real allocation? ' +
                 'This replaces the current committed result.')) return;
    busy('Committing policy and reallocating\u2026');
    google.script.run
      .withSuccessHandler(function (r) {
        done('good', 'Policy committed and reallocated: ' + r.metrics.allocated +
          ' allotted, ' + r.metrics.waitlisted + ' waitlisted. Policy hash ' + r.policyHash + '.');
        PENDING = {}; load();
      })
      .withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminCommitSimulation(changes, null);
  }

  /* ==================================================== grievance inbox */

  function loadGrievances() {
    google.script.run.withSuccessHandler(paintGrievances)
      .withFailureHandler(function () {}).apiAdminGrievanceInbox(null, 40);
  }

  function paintGrievances(d) {
    var st = d.stats;
    if (!st.total) {
      el('grievCard').innerHTML = '<div class="card"><h2>Grievances</h2>' +
        '<p class="muted small" style="margin:0">No grievances have been raised.</p></div>';
      return;
    }

    var rows = d.tickets.map(function (t) {
      var cls = { AUTO_ANSWERED: 'ok', RESOLVED: 'ok', ESCALATED: 'warn',
                  OPEN: 'info' }[t.status] || 'info';
      return '<tr><td><div style="font-weight:560">' + esc(t.name) + '</div>' +
        '<div class="muted small">' + esc(t.category) + ' \u00b7 ' + esc(t.ticketId) + '</div></td>' +
        '<td class="small">' + esc(t.text.slice(0, 90)) +
          (t.text.length > 90 ? '\u2026' : '') +
          (t.anomalies && t.anomalies.length
            ? '<div style="color:var(--bad);margin-top:4px">\u26a0 ' +
              esc(t.anomalies.join(' ')) + '</div>' : '') + '</td>' +
        '<td><span class="pill ' + cls + '">' + esc(t.status.replace(/_/g, ' ').toLowerCase()) +
          '</span></td></tr>';
    }).join('');

    el('grievCard').innerHTML = '<div class="card"><h2>Grievances</h2>' +
      '<div class="tiles" style="margin-bottom:13px">' +
        '<div class="tile"><div class="n">' + esc(st.total) + '</div><div class="l">total</div></div>' +
        '<div class="tile"><div class="n" style="color:var(--ok)">' + esc(st.autoResolvedPct) +
          '%</div><div class="l">answered automatically</div></div>' +
        '<div class="tile"><div class="n" style="color:var(--warn)">' +
          esc(st.byStatus.ESCALATED || 0) + '</div><div class="l">need a person</div></div>' +
      '</div>' +
      '<div class="scroll-x"><table class="grid"><thead><tr><th>Student</th>' +
      '<th>Complaint</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="small muted" style="margin:10px 0 0">Allocation disputes are re-checked against ' +
      'the recorded run before any reply is sent. A ticket only reaches this queue as ' +
      '<em>escalated</em> when that check finds something wrong \u2014 which is exactly the case ' +
      'worth a warden\u2019s time.</p></div>';
  }

  /* ======================================================== swap board */

  function loadSwaps() {
    google.script.run.withSuccessHandler(paintSwaps)
      .withFailureHandler(function () {}).apiAdminSwapBoard();
  }

  function paintSwaps(d) {
    if (!d.total) {
      el('swapCard').innerHTML = '<div class="card"><h2>Room swaps</h2>' +
        '<p class="muted small" style="margin:0">No swap requests yet.</p></div>';
      return;
    }
    var rows = d.open.map(function (t) {
      return '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.hostelName) + ' ' + esc(t.roomNo) +
        '</td><td class="muted small">' + esc(t.reason || '\u2014') + '</td></tr>';
    }).join('');

    el('swapCard').innerHTML = '<div class="card"><h2>Room swaps</h2>' +
      '<div class="tiles" style="margin-bottom:13px">' +
        '<div class="tile"><div class="n" style="color:var(--ok)">' + esc(d.counts.APPROVED || 0) +
          '</div><div class="l">approved automatically</div></div>' +
        '<div class="tile"><div class="n">' + esc(d.counts.OPEN || 0) +
          '</div><div class="l">on the board</div></div>' +
        '<div class="tile"><div class="n">' + esc(d.counts.REJECTED || 0) +
          '</div><div class="l">refused by policy</div></div>' +
      '</div>' +
      (rows ? '<div class="scroll-x"><table class="grid"><thead><tr><th>Student</th>' +
        '<th>Current room</th><th>Reason</th></tr></thead><tbody>' + rows +
        '</tbody></table></div>' : '') +
      '<p class="small muted" style="margin:10px 0 0">Swaps both students agree to are validated ' +
      'against gender, accessibility and quota rules and applied without an administrator. ' +
      'Nothing in this list is waiting on you.</p></div>';
  }

  /* The tamper-evidence badge. Novelty feature 1, second half. */
  function ledgerCard(d) {
    var ok = d.ledger.intact;
    return '<div class="card"><h2>Audit ledger</h2>' +
      '<div class="ledger ' + (ok ? 'ledger-ok' : 'ledger-bad') + '">' +
        '<div class="t">' + (ok ? '&#10003; Chain intact' : '&#10007; TAMPERING DETECTED') + '</div>' +
        '<div style="margin-top:3px">' + esc(d.ledger.reason) + '</div>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:11px">' +
        '<button class="btn ghost" onclick="showLedger()">View recent entries</button>' +
      '</div><div id="ledgerDetail"></div></div>';
  }

  function showLedger() {
    el('ledgerDetail').innerHTML = '<p class="muted small">Loading&hellip;</p>';
    google.script.run.withSuccessHandler(function (r) {
      var rows = r.recent.map(function (e) {
        return '<tr><td class="num">' + esc(e.seq) + '</td><td>' + esc(e.ts) + '</td>' +
          '<td>' + esc(e.action) + '</td><td class="muted small">' + esc(e.actor) + '</td>' +
          '<td><code>' + esc(e.hash) + '&hellip;</code></td></tr>';
      }).join('');
      el('ledgerDetail').innerHTML =
        '<div class="divider"></div><div class="scroll-x"><table class="grid">' +
        '<thead><tr><th>Seq</th><th>When</th><th>Action</th><th>Actor</th><th>Hash</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
        '<p class="small muted" style="margin:9px 0 0">Each row\'s hash covers the previous row\'s ' +
        'hash. Editing any historical entry breaks every hash after it.</p>';
    }).apiAdminVerifyLedger();
  }

  function countsCard(d) {
    var c = d.counts, cap = d.capacity;
    return '<div class="card"><h2>At a glance</h2><div class="tiles">' +
      tile(c.applications, 'Applications') +
      tile(c.allotted, 'Allotted') +
      tile(c.waitlisted, 'Waitlisted') +
      tile(c.rejected, 'Not eligible') +
      tile(cap.vacant, 'Vacant beds') +
      tile(d.docQueue, 'Docs to verify') +
      '</div></div>';
  }
  function tile(n, l) {
    return '<div class="tile"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>';
  }

  function noRunCard() {
    return '<div class="card"><h3>No allocation has been run yet</h3>' +
      '<p class="muted">Run the allocation to produce allotments, a waiting list and fairness metrics.</p>' +
      '<div class="btn-row"><button class="btn" onclick="runAllocation()">Run allocation</button>' +
      '<button class="btn ghost" onclick="preview()">Preview without committing</button></div></div>';
  }

  function metricsCard(d, m) {
    return '<div class="card"><h2>Fairness and efficiency</h2>' +
      '<div class="tiles">' +
        tile(m.pref1Pct + '%', 'First preference met') +
        tile(m.meanPrefRank, 'Mean preference granted') +
        tile(m.utilisationPct + '%', 'Room utilisation') +
        tile(m.meanCompatPct + '%', 'Roommate compatibility') +
        tile(m.accessibilityHonouredPct + '%', 'Accessibility honoured') +
        tile(m.paretoSwaps, 'Pareto swaps found') +
      '</div>' +
      '<p class="small muted" style="margin:12px 0 0">' +
      '<strong>Pareto swaps found: ' + esc(m.paretoSwaps) + '.</strong> After allocating, the engine ' +
      'searches for any two students who would both rather have each other\'s room. Zero means no ' +
      'such pair exists, so no student can be made better off without making another worse off.</p>' +
      '<div class="divider"></div>' +
      '<dl class="kv">' +
        '<dt>Run</dt><dd><code>' + esc(d.latestRun.runId) + '</code></dd>' +
        '<dt>Seed</dt><dd><code>' + esc(d.latestRun.seed) + '</code></dd>' +
        '<dt>Policy hash</dt><dd><code>' + esc(d.latestRun.policyHash) + '</code></dd>' +
        '<dt>Completed</dt><dd>' + esc(d.latestRun.finishedAt) + '</dd>' +
      '</dl>' +
      '<p class="small muted" style="margin:9px 0 0">The seed and policy hash together make this run ' +
      'reproducible: re-running with both unchanged produces an identical allocation.</p></div>';
  }

  function occupancyCard(d) {
    var rows = d.occupancy.map(function (h) {
      var hot = h.pct >= 98;
      return '<tr><td><strong>' + esc(h.name) + '</strong><div class="muted small">' +
        esc(h.campus) + ' &middot; ' + (h.gender === 'M' ? 'Boys' : h.gender === 'F' ? 'Girls' : 'Co-ed') +
        '</div></td>' +
        '<td style="width:34%"><span class="meter"><i class="' + (hot ? 'hot' : '') +
          '" style="width:' + h.pct + '%"></i></span></td>' +
        '<td class="num">' + esc(h.pct) + '%</td>' +
        '<td class="num">' + esc(h.occupied) + ' / ' + esc(h.total) + '</td>' +
        '<td class="num">' + esc(h.vacant) + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>Occupancy and vacancies</h2><div class="scroll-x">' +
      '<table class="grid"><thead><tr><th>Hostel</th><th>Occupancy</th><th class="num">%</th>' +
      '<th class="num">Beds</th><th class="num">Vacant</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }

  function quotaCard(metrics) {
    var rows = metrics.quotaTable.map(function (q) {
      if (q.category === 'CONVERTED') {
        return '<tr><td><strong>Converted</strong><div class="muted small">' +
          'unfilled reserved seats reissued in merit order</div></td>' +
          '<td class="num">&mdash;</td><td class="num">' + esc(q.filled) + '</td>' +
          '<td class="num">&mdash;</td></tr>';
      }
      return '<tr><td>' + esc(q.category) + '</td>' +
        '<td class="num">' + esc(q.reservedSeats) + '</td>' +
        '<td class="num">' + esc(q.filled) + '</td>' +
        '<td class="num">' + (q.unfilled > 0
          ? '<span class="muted">' + esc(q.unfilled) + ' converted</span>' : '&mdash;') + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>Quota compliance</h2><div class="scroll-x">' +
      '<table class="grid"><thead><tr><th>Category</th><th class="num">Reserved</th>' +
      '<th class="num">Filled</th><th class="num">Unfilled</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<p class="small muted" style="margin:10px 0 0">Seats a category could not fill are ' +
      'dereserved and reissued to the waiting list in merit order, rather than left empty.</p></div>';
  }

  function operationsCard(d) {
    return '<div class="card"><h2>Operations</h2>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="runAllocation()">Run allocation</button>' +
        '<button class="btn ghost" onclick="preview()">Preview only</button>' +
        '<button class="btn ghost" onclick="letters()">Generate letters</button>' +
        '<button class="btn ghost" onclick="notifyAll()">Send notifications</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<dl class="kv">' +
        '<dt>Email sending</dt><dd>' + (d.email.enabled
          ? '<span class="pill ok">Enabled</span>'
          : '<span class="pill warn">Disabled (safe for rehearsal)</span>') + '</dd>' +
        '<dt>Remaining quota today</dt><dd>' + esc(d.email.remainingQuota) + '</dd>' +
        '<dt>Sent / queued</dt><dd>' + esc(d.email.sent) + ' / ' + esc(d.email.queued) + '</dd>' +
      '</dl>' +
      '<p class="small muted" style="margin:9px 0 0">Letters and emails are generated in batches ' +
      'so each call finishes inside the Apps Script execution limit. Run them repeatedly until ' +
      'nothing remains.</p></div>';
  }

  /* ------------------------------------------------------------- actions */
  function busy(text) {
    el('msg').innerHTML = '<div class="banner info"><span class="spin"></span> ' + esc(text) + '</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function done(kind, text) {
    el('msg').innerHTML = '<div class="banner ' + kind + '">' + esc(text) + '</div>';
  }

  function runAllocation() {
    if (!confirm('Run the allocation and commit it? This replaces the previous committed result.')) return;
    busy('Allocating rooms…');
    google.script.run
      .withSuccessHandler(function (r) {
        done('good', 'Allocation complete: ' + r.metrics.summary.allocated + ' allotted, ' +
          r.metrics.summary.waitlisted + ' waitlisted, ' + r.converted +
          ' converted seats reissued. Took ' + r.elapsedSec + 's.');
        load();
      })
      .withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminRunAllocation({});
  }

  function preview() {
    busy('Running a preview — nothing will be written…');
    google.script.run
      .withSuccessHandler(function (r) {
        var m = r.metrics.summary;
        done('info', 'Preview only, nothing committed: ' + m.allocated + ' would be allotted, ' +
          m.waitlisted + ' waitlisted, first preference met ' + m.pref1Pct + '%, ' +
          'utilisation ' + m.utilisationPct + '%.');
      })
      .withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminPreviewAllocation({});
  }

  function letters() {
    busy('Generating allotment letters…');
    google.script.run
      .withSuccessHandler(function (r) {
        done(r.remaining ? 'info' : 'good',
          'Generated ' + r.generated + ' of ' + r.total + ' letters.' +
          (r.remaining ? ' ' + r.remaining + ' remaining — run again to continue.' : ' All done.'));
      })
      .withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminGenerateLetters(null, 25);
  }

  function notifyAll() {
    busy('Dispatching notifications…');
    google.script.run
      .withSuccessHandler(function (r) {
        done(r.failed ? 'err' : 'good',
          'Sent ' + r.sent + ', queued ' + r.queued + ', skipped ' + r.skipped +
          ', failed ' + r.failed + (r.remaining ? ', ' + r.remaining + ' remaining' : '') + '.');
        load();
      })
      .withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminNotify(null, 50);
  }
</script>
