<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<?!= include('ui/wander'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL    = '<?= webAppUrl() ?>';
  var LOGO_URL      = '<?= logoUrl() ?>';
  var SUPPORT_EMAIL = '<?= supportEmail() ?>';
</script>

<div id="chrome"></div>
<div id="root"></div>

<script>
  document.body.classList.add('admin');

  var D = null, KNOBS = [], PENDING = {}, PENDING_NOTE = null;

  /* ================================================================ tabs
     One section open at a time. Everything below used to be stacked on a
     single page, which meant scrolling past six things to reach the seventh
     with no way to tell where you were or what still needed attention. */
  var TAB = 'overview';

  var ICON = {
    overview:    'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
    allocation:  'M4 20V10M10 20V4M16 20v-7M22 20H2',
    occupancy:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
    waitlist:    'M12 6v6l4 2M12 3a9 9 0 100 18 9 9 0 000-18z',
    verification:'M9 12l2 2 4-4M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z',
    students:    'M12 3l9 5-9 5-9-5zM5 11v5c0 1 3 3 7 3s7-2 7-3v-5',
    requests:    'M4 5h16v12H8l-4 3z',
    policy:      'M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1M12 8a4 4 0 100 8 4 4 0 000-8z',
    operations:  'M13 2L4 14h6l-1 8 9-12h-6z',
    assistant:   'M21 12a8 8 0 11-3.2-6.4M12 8v4M12 16h.01'
  };

  var TABS = [
    { id: 'overview',     label: 'Overview',
      title: 'Overview', blurb: 'The state of this year\u2019s allocation at a glance.' },
    { id: 'allocation',   label: 'Allocation',
      title: 'Allocation', blurb: 'Run the allocation, and how fair the last one was.' },
    { id: 'occupancy',    label: 'Occupancy',
      title: 'Occupancy and vacancies', blurb: 'Where the beds are, and which are free.' },
    { id: 'waitlist',     label: 'Waiting list',
      title: 'Waiting list',
      blurb: 'Everyone who applied and has no seat, in the order they would be offered one.' },
    { id: 'verification', label: 'Verification',
      title: 'Verification',
      blurb: 'One applicant at a time, with the evidence beside what they declared. ' +
             'Ordered by risk first and by how long they have waited second.' },
    { id: 'students',     label: 'Students',
      title: 'Students', blurb: 'Open any applicant\u2019s portal exactly as they see it.' },
    { id: 'requests',     label: 'Requests',
      title: 'Resident reports and swaps',
      blurb: 'What students living in the hostels have reported or asked for.' },
    { id: 'policy',       label: 'Policy',
      title: 'Policy', blurb: 'Change a rule and see who moves, before committing it.' },
    { id: 'operations',   label: 'Operations',
      title: 'Operations', blurb: 'Letters, notifications and the audit trail.' },
    { id: 'assistant',    label: 'Assistant',
      title: 'Wander', blurb: 'Load the hostel rules, and ask questions of them yourself.' }
  ];

  /** Counts that belong on the rail, so an officer sees the work without hunting. */
  function tabCount(id, d) {
    if (id === 'verification') return Number(d && d.docQueue) || 0;
    if (id === 'waitlist') return Number(d && d.counts && d.counts.waitlisted) || 0;
    return 0;
  }

  function sidebar(d) {
    return '<div class="arail-title">Sections</div><ul class="anav">' +
      TABS.map(function (t) {
        var n = tabCount(t.id, d);
        return '<li><button type="button" aria-current="' + (TAB === t.id) +
          '" onclick="goTab(&quot;' + t.id + '&quot;)">' +
          '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="' + ICON[t.id] + '"/></svg></span>' +
          '<span>' + esc(t.label) + '</span>' +
          (n ? '<span class="cnt">' + esc(n) + '</span>' : '') +
          '</button></li>';
      }).join('') + '</ul>';
  }

  function goTab(id) {
    TAB = id;
    setHtml('sidebar', sidebar(D));
    paintTab();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  loadToken();
  setHtml('root', loadingState('Loading dashboard'));

  function onSignedOut() {
    paintChrome({ unit: 'Hostel Administration' });
    setHtml('root', '<div class="wrap narrow">' + signInPanel() + '</div>');
  }

  /** Called by the shared sign-in panel once a session exists. */
  function onSignedIn() {
    setHtml('root', loadingState('Loading dashboard'));
    // Signing out of an administrator account and back in as a student happens
    // on this page, so the account that just arrived is not necessarily one
    // this page is for. Ask, and send them where they belong rather than
    // letting the first call fail and explaining afterwards.
    srv().withSuccessHandler(function (who) {
      if (!who.isAdmin) { reloadTop(homeFor(who)); return; }
      load();
    }).withFailureHandler(function () { load(); }).apiWhoAmI();
  }

  /**
   * Re-fetch and redraw.
   *
   * `note` survives the redraw. Writing a confirmation and then calling load()
   * put the message into a #msg that the redraw immediately replaced, so the
   * admin pressed a button, waited, and saw nothing happen.
   */
  function load(note) {
    PENDING_NOTE = note || null;
    srv().withSuccessHandler(render).withFailureHandler(function (e) {
      // An unsigned visitor and a signed-in non-administrator both land here and
      // need different things: one needs a way in, the other needs telling.
      if (!SESSION.token && /sign in/i.test(e.message)) {
        paintChrome({ unit: 'Hostel Administration' });
        setHtml('root', '<div class="wrap narrow">' +
          signInPanel('This page is for hostel administrators.') + '</div>');
        return;
      }
      // Signed in, and not an administrator. That is not an error to report -
      // it is an ordinary student who followed a link, and what they need is
      // the way back to their own application.
      if (SESSION.token && /administrator|admin/i.test(e.message)) {
        paintChrome({ unit: 'Hostel Administration' });
        setHtml('root', '<div class="wrap narrow">' + card('',
          emptyState('&#128274;', 'This page is for hostel administrators',
                     'Your account does not administer the hostel system.') +
          '<div style="text-align:center;margin-top:4px">' +
          '<a class="btn" href="' + appUrl('?') + '" target="_top">' +
          'Go to my application</a></div>') + '</div>');
        return;
      }
      setHtml('root', '<div class="wrap">' + banner('err', e.message) + '</div>');
    }).apiAdminOverview();
  }
  load();

  function render(d) {
    if (!d) { showFailure(emptyResponseNote('The dashboard')); return; }

    D = d;
    paintChrome({
      unit: 'Hostel Administration',
      user: { name: d.admin.name || d.admin.email, role: d.admin.role.replace(/_/g, ' '),
              signOut: !!SESSION.token },
      // Nothing here links to the student portal. An administrator has no
      // application of their own to look at, and the way to see a student's
      // screen is the Students tab, which opens it inside this page.
      tabs: []
    });

    setHtml('root', '<div class="ashell">' +
        '<aside class="asidebar" id="sidebar">' + sidebar(d) + '</aside>' +
        '<main class="amain"><div id="msg"></div><div id="tabBody"></div></main>' +
      '</div>');

    paintTab();

    if (PENDING_NOTE) {
      setHtml('msg', banner(PENDING_NOTE.kind, PENDING_NOTE.text));
      PENDING_NOTE = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  /**
   * Draw the open section, and fetch only what that section needs.
   *
   * Loading all six panels on every visit meant six round trips before the
   * page settled, five of them for things nobody was looking at.
   */
  function paintTab() {
    var d = D;
    var meta = TABS.filter(function (t) { return t.id === TAB; })[0] || TABS[0];
    var m = d.latestRun && d.latestRun.metrics ? d.latestRun.metrics.summary : null;

    var body = '';
    if (TAB === 'overview') {
      body = summaryBand(d) + pipelineCard(d) + ledgerCard(d);
    } else if (TAB === 'allocation') {
      body = runCard(d) + (m ? metricsCard(d, m) : noRunCard(d)) +
             (m ? quotaCard(d.latestRun.metrics) : '');
    } else if (TAB === 'occupancy') {
      body = occupancyCard(d);
    } else if (TAB === 'waitlist') {
      body = '<div id="wlCard"></div>';
    } else if (TAB === 'verification') {
      body = '<div id="vStats"></div>' +
        '<div class="vconsole">' +
          '<aside class="vqueue" id="vQueue"></aside>' +
          '<section id="vCase"></section>' +
        '</div>';
    } else if (TAB === 'students') {
      body = lookupCard();
    } else if (TAB === 'requests') {
      body = '<div id="grievCard"></div><div id="swapCard"></div>';
    } else if (TAB === 'policy') {
      body = '<div id="simCard"></div>';
    } else if (TAB === 'operations') {
      body = operationsCard(d);
    } else if (TAB === 'assistant') {
      body = '<div id="ruleBookCard"></div><div id="wanderCardHost"></div>';
    }

    setHtml('tabBody', '<div class="apagehead"><h1>' + esc(meta.title) + '</h1>' +
      '<p>' + esc(meta.blurb) +
      (TAB === 'allocation' && d.latestRun && d.latestRun.finishedAt
        ? ' Last run ' + esc(d.latestRun.finishedAt) + '.' : '') +
      '</p></div>' + body);

    if (TAB === 'overview')     { loadLedgerBadge(); }
    if (TAB === 'waitlist')     { loadWaitlist(); }
    if (TAB === 'verification') { loadVerification(); }
    if (TAB === 'requests')     { loadGrievances(); loadSwaps(); }
    if (TAB === 'policy')       { loadSimulator(); }
    if (TAB === 'assistant')    { loadRuleBook(); loadWander('wanderCardHost'); }
  }

  /** The buttons that actually start a run, lifted out of Operations. */
  function runCard(d) {
    return card('Run the allocation',
      '<p class="small muted" style="margin:0 0 13px">A preview changes nothing and is ' +
      'the safe way to see what a run would do. Committing replaces the previous ' +
      'result and is recorded in the ledger.</p>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="runAllocation()">Run and save</button>' +
        '<button class="btn ghost" onclick="preview()">Preview only</button>' +
        (Number((d.counts || {}).allotted) > 0
          ? '<button class="btn ghost" onclick="clearAllocation()">Clear the current one</button>'
          : '') +
      '</div>' +
      (Number((d.counts || {}).allotted) > 0
        ? '<p class="small muted" style="margin:12px 0 0">Clearing empties every bed and puts ' +
          'each applicant back in the queue. The record of what was decided stays in the ' +
          'ledger &mdash; only the outcome is undone.</p>'
        : ''));
  }



  function runScans() {
    setHtml('vBulkMsg', '<div class="hint"><span class="spin"></span> ' +
      'Reading documents. This takes a few seconds each and continues in batches.</div>');
    srv().withSuccessHandler(function (r) {
        setHtml('vBulkMsg', banner(r.remaining ? 'info' : 'good',
          'Read ' + r.scanned + '. ' + (r.remaining
            ? r.remaining + ' still to go &mdash; press the button again to continue.'
            : 'All documents have now been read.')));
        loadVerification();
        loadScans();
      })
      .withFailureHandler(function (e) { setHtml('vBulkMsg', banner('err', e.message)); })
      .apiAdminScanDocuments(25);
  }

  function autoClear() {
    if (!window.confirm('Mark every document that agrees with its declaration as verified?\n\n' +
        'Conflicts and unreadable scans are left alone. Each one is recorded as a machine ' +
        'decision, not a person\u2019s.')) return;
    setHtml('vBulkMsg', loadingState('Clearing'));
    srv('vBulkMsg').withSuccessHandler(function (r) {
        var held = (r.skipped || []).length;
        // A button that clears nothing and says nothing is a button people
        // press three times and then report as broken. It was.
        var text = r.cleared
          ? 'Verified ' + r.cleared + ' document' + (r.cleared === 1 ? '' : 's') +
            ' across ' + r.applications + ' application' +
            (r.applications === 1 ? '' : 's') + '.'
          : 'Nothing was cleared.';
        if (held) {
          text += ' ' + held + ' document' + (held === 1 ? '' : 's') +
            ' agreed with the declaration but ' + (held === 1 ? 'was' : 'were') +
            ' held back by identity screening — ' + r.skipped[0].studentName + ': ' +
            r.skipped[0].reason +
            (held > 1 ? ' (and ' + (held - 1) + ' other' + (held === 2 ? '' : 's') + ')' : '') +
            ' Decide ' + (held === 1 ? 'it' : 'them') + ' by hand in the queue below.';
        }
        load({ kind: r.cleared ? 'good' : 'warn', text: text });
      })
      .withFailureHandler(function (e) { setHtml('vBulkMsg', banner('err', e.message)); })
      .apiAdminAutoClear();
  }

  /* ------------------------------------------------ the document queue */

  /**
   * The documents themselves, worst first.
   *
   * apiAdminDocQueue has existed since Phase 4 and no page ever rendered it, so
   * the only way to act on a single document was to edit the sheet by hand.
   */
  // Which of the two questions the queue is answering. "What is waiting on me"
  // is the one an officer opens the tab for; "where is this student's document"
  // is the one they open it for on the phone, and it used to have no answer on
  // any screen at all.



  /** The switch between the two, on both views so it is never a dead end. */



  /* ---------------------------------------------------- verification */



  function sect(title, note) {
    return '<div class="sect"><h2>' + esc(title) + '</h2>' +
           (note ? '<span class="note">' + esc(note) + '</span>' : '') + '</div>';
  }

  /* ------------------------------------------------------ summary band */
  function summaryBand(d) {
    var c = d.counts || {}, cap = d.capacity || {};
    return '<div class="tiles" style="margin-bottom:14px">' +
      tile(c.applications, 'Applications', '') +
      tile(c.allotted, 'Rooms allotted', 'good') +
      tile(c.waitlisted, 'On waiting list', c.waitlisted ? 'hi' : '') +
      tile(c.rejected, 'Not eligible', '') +
      tile(cap.vacant, 'Beds vacant', '') +
      tile(d.docQueue, 'Documents to check', d.docQueue ? 'hi' : '') +
    '</div>';
  }
  function tile(n, l, kind) {
    return '<div class="tile ' + (kind || '') + '"><div class="n">' + esc(n) +
           '</div><div class="l">' + esc(l) + '</div></div>';
  }

  /**
   * The lifecycle, in order, with the current step marked.
   *
   * An officer arriving at this dashboard for the first time - or a judge being
   * shown it - has no way to know that documents are verified before the
   * allocation runs and letters after it. Everything needed was on the page and
   * the ORDER was not, which is the part that matters.
   */
  function pipelineCard(d) {
    var c = d.counts || {};
    var applied = Number(c.applications) || 0;
    var allotted = Number(c.allotted) || 0;
    var toCheck = Number(d.docQueue) || 0;
    var letters = Number(d.lettersDone) || 0;

    var steps = [
      { t: 'Students apply',
        s: applied + ' application' + (applied === 1 ? '' : 's') + ' received',
        done: applied > 0, tab: null },
      { t: 'Documents are checked',
        s: toCheck ? toCheck + ' still need a person' : 'nothing outstanding',
        done: applied > 0 && toCheck === 0, tab: 'verification' },
      { t: 'Allocation runs',
        s: allotted ? allotted + ' rooms allotted' : 'not run yet',
        done: allotted > 0, tab: 'allocation' },
      { t: 'Letters and notices go out',
        s: letters ? letters + ' letters produced' : 'not produced yet',
        done: letters > 0, tab: 'operations' },
      { t: 'Students query the result',
        s: 'answered from the recorded run',
        done: allotted > 0, tab: 'requests' }
    ];

    // The first thing not done is the thing to do next.
    var nextAt = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { nextAt = i; break; } }

    var list = steps.map(function (st, i) {
      var state = st.done ? 'done' : (i === nextAt ? 'now' : '');
      return '<li class="' + state + '">' +
        '<span class="num">' + (st.done ? '&#10003;' : (i + 1)) + '</span>' +
        '<span class="pl"><span class="pt">' + esc(st.t) + '</span>' +
        '<span class="ps">' + esc(st.s) + '</span></span>' +
        (i === nextAt && st.tab
          ? '<button class="btn sm" onclick="goTab(&quot;' + st.tab + '&quot;)">Go</button>'
          : '') + '</li>';
    }).join('');

    return card('How a place is allotted',
      '<p class="small muted" style="margin:0 0 14px">The whole lifecycle, in order. ' +
      'The highlighted step is the one waiting on you.</p>' +
      '<ul class="pipeline">' + list + '</ul>');
  }

  /* ----------------------------------------------------------- ledger */
  function ledgerCard(d) {
    return card('Audit ledger',
      '<div id="ledgerBadge">' + loadingState('Verifying the chain') + '</div>' +
      '<div class="btn-row" style="margin-top:13px">' +
        '<button class="btn ghost sm" onclick="showLedger()">View recent activity</button>' +
      '</div><div id="ledgerDetail"></div>');
  }

  /**
   * Verifying re-hashes every row, so the badge arrives after the page rather
   * than holding it up. The page is useful without it; it is not useful blank.
   */
  function loadLedgerBadge() {
    srv('ledgerBadge').withSuccessHandler(function (v) {
      var ok = v && v.intact;
      setHtml('ledgerBadge', '<div class="status ' + (ok ? 'good' : 'bad') + '">' +
        '<div class="sic">' + (ok ? '&#10003;' : '&#10007;') + '</div>' +
        '<div><div class="t">' + (ok ? 'Records intact' : 'Tampering detected') + '</div>' +
        '<div class="s">' + esc((v && v.reason) || '') + '</div></div></div>');
    }).apiAdminLedgerBadge();
  }

  function showLedger() {
    setHtml('ledgerDetail', loadingState('Reading the ledger'));
    srv('ledgerDetail').withSuccessHandler(function (r) {
      var rows = r.recent.map(function (e) {
        return '<tr><td>' + esc(e.ts) + '</td>' +
          '<td>' + esc(String(e.action).replace(/_/g, ' ').toLowerCase()) + '</td>' +
          '<td class="muted small">' + esc(e.actor) + '</td>' +
          '<td class="mono">' + esc(e.hash) + '&hellip;</td></tr>';
      }).join('');
      setHtml('ledgerDetail', '<div class="divider"></div><div class="scroll-x"><table class="grid">' +
        '<thead><tr><th>When</th><th>Activity</th><th>By</th><th>Fingerprint</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
        '<p class="small muted" style="margin:11px 0 0">Each entry&rsquo;s fingerprint covers the ' +
        'one before it. Altering any past record breaks every fingerprint that follows, which is ' +
        'what makes the history verifiable rather than merely stored.</p>');
    }).apiAdminVerifyLedger();
  }

  /* ---------------------------------------------------------- metrics */
  function noRunCard(d) {
    // Never run and just cleared produce identical numbers and are not the same
    // thing to be told - one is a job not started, the other a job undone on
    // purpose, and only one of them means somebody is waiting for a result.
    var cleared = !!(d && d.hadRun);
    return card('', '<div class="empty"><div class="big">&#9881;</div>' +
      '<h3 style="margin:0 0 5px">' + (cleared
        ? 'The allocation has been cleared'
        : 'No allocation has been run yet') + '</h3>' +
      '<p class="small" style="max-width:430px;display:inline-block;margin:0 0 16px">' +
      (cleared
        ? 'Every bed is empty and every applicant is back in the queue. There are no ' +
          'occupancy, preference or quota figures to show until the allocation is run again.'
        : 'Running the allocation produces room allotments, a waiting list and fairness ' +
          'measures.') + '</p><br>' +
      '<div class="btn-row" style="justify-content:center">' +
      '<button class="btn" onclick="runAllocation()">Run allocation</button>' +
      '<button class="btn ghost" onclick="preview()">Preview without saving</button></div></div>');
  }

  function metricsCard(d, m) {
    var body =
      '<div class="tiles">' +
        tile(m.pref1Pct + '%', 'Got their first choice', '') +
        tile(m.meanPrefRank, 'Average choice granted', '') +
        tile(m.utilisationPct + '%', 'Beds in use', m.utilisationPct >= 95 ? 'good' : 'hi') +
        tile(m.meanCompatPct + '%', 'Roommate compatibility', '') +
        tile(m.accessibilityHonouredPct + '%', 'Accessibility honoured',
             m.accessibilityHonouredPct === 100 ? 'good' : 'bad') +
      '</div>' +
      '<div class="status good" style="margin-top:14px">' +
        '<div class="sic">&#10003;</div><div>' +
        '<div class="t">No student can be better off without another being worse off</div>' +
        '<div class="s">After allocating, the engine searched for any two students who would ' +
        'both prefer each other&rsquo;s room, and found ' + esc(m.paretoSwaps) + '.</div></div></div>' +
      techDetails('Run details for audit', [
        ['Run identifier', d.latestRun.runId, 'mono'],
        ['Random seed', d.latestRun.seed, 'mono'],
        ['Policy fingerprint', d.latestRun.policyHash, 'mono'],
        ['Completed', d.latestRun.finishedAt],
        ['Fairness spread (Gini)', String(m.giniSatisfaction)]
      ]) +
      '<p class="small muted" style="margin:11px 0 0">The seed and policy fingerprint together ' +
      'make this run repeatable: running it again with both unchanged produces an identical ' +
      'allocation, months later.</p>';

    return card('Fairness and efficiency', body);
  }

  function quotaCard(metrics) {
    var rows = (metrics.quotaTable || []).map(function (q) {
      if (q.category === 'CONVERTED') {
        return '<tr><td><strong>Converted places</strong>' +
          '<div class="muted small">reserved places no category could fill, reissued in merit order</div></td>' +
          '<td class="num muted">&mdash;</td><td class="num"><strong>' + esc(q.filled) +
          '</strong></td><td class="num muted">&mdash;</td></tr>';
      }
      var name = q.category === 'PwD (horizontal)' ? 'PwD (across all categories)'
                                                   : label('category', q.category, q.category);
      return '<tr><td>' + esc(name) + '</td>' +
        '<td class="num">' + esc(q.reservedSeats) + '</td>' +
        '<td class="num">' + esc(q.filled) + '</td>' +
        '<td class="num">' + (q.unfilled > 0
          ? '<span class="muted">' + esc(q.unfilled) + ' reissued</span>'
          : '<span class="pill ok plain">full</span>') + '</td></tr>';
    }).join('');

    return card('Reservation compliance',
      '<div class="scroll-x"><table class="grid"><thead><tr><th>Category</th>' +
      '<th class="num">Places reserved</th><th class="num">Filled</th>' +
      '<th class="num">Unfilled</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div style="padding:14px 18px"><p class="small muted" style="margin:0">' +
      'Places a category could not fill are reissued to the waiting list in strict merit order ' +
      'rather than left empty.</p></div>', { tight: true });
  }

  /* -------------------------------------------------------- occupancy */
  function occupancyCard(d) {
    // Only hostels that have beds. A hostel with none is either a row somebody
    // began and abandoned or residue from an earlier inventory, and either way
    // "0 / 0, none vacant" is a line that tells the reader nothing and makes
    // the table longer than the building list it is supposed to be.
    var live = (d.occupancy || []).filter(function (h) { return Number(h.total) > 0; });
    var hidden = (d.occupancy || []).length - live.length;

    if (!live.length) {
      return card('', emptyState('&#127968;', 'No rooms are on record',
        'The hostel inventory is empty, so there is nothing to be occupied. ' +
        'Seed or import the inventory first.'));
    }

    var vacant = live.reduce(function (n, h) { return n + Number(h.vacant || 0); }, 0);
    var waiting = Number((d.counts || {}).waitlisted) || 0;

    var rows = live.map(function (h) {
      var cls = h.pct >= 99 ? 'full' : (h.pct >= 90 ? 'hot' : '');
      return '<tr><td><strong>' + esc(h.name) + '</strong>' +
        '<div class="muted small">' + esc(label('campus', h.campus)) + ' &middot; ' +
        esc(label('gender', h.gender)) + '</div></td>' +
        '<td style="width:32%"><span class="meter"><i class="' + cls +
          '" style="width:' + h.pct + '%"></i></span></td>' +
        '<td class="num"><strong>' + esc(h.pct) + '%</strong></td>' +
        '<td class="num muted">' + esc(h.occupied) + ' / ' + esc(h.total) + '</td>' +
        '<td class="num">' + (h.vacant ? esc(h.vacant) : '<span class="muted">none</span>') +
        '</td></tr>';
    }).join('');
    return card('', '<div class="scroll-x"><table class="grid"><thead><tr>' +
      '<th>Hostel</th><th>Occupancy</th><th class="num">%</th>' +
      '<th class="num">Beds used</th><th class="num">Vacant</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      (hidden ? '<p class="small muted" style="padding:12px 18px;margin:0">' +
        esc(hidden) + ' hostel' + (hidden === 1 ? '' : 's') + ' with no rooms on record ' +
        (hidden === 1 ? 'is' : 'are') + ' not shown.</p>' : '') +
      // Offered only when it would do something. A button that can only report
      // "nothing to do" is a button that teaches people to ignore buttons.
      (vacant && waiting
        ? '<div style="padding:14px 18px;border-top:1px solid var(--border)">' +
          '<div id="vacMsg"></div>' +
          '<p class="small muted" style="margin:0 0 10px">' + esc(vacant) + ' bed' +
          (vacant === 1 ? '' : 's') + ' empty and ' + esc(waiting) + ' applicant' +
          (waiting === 1 ? '' : 's') + ' waiting. Offering a bed goes to the ' +
          'highest-placed applicant on the list who can actually live in it &mdash; ' +
          'the same hostel rules the run applied. Nobody already allotted is moved.</p>' +
          '<button class="btn" onclick="fillVacancies()">Offer empty beds to the ' +
          'waiting list</button></div>'
        : ''),
      { tight: true });
  }

  /* ----------------------------------------------------- student lookup */
  /**
   * A read-only link to one student's portal, for showing it on a device that
   * is not signed in as the owner. Only useful while ALLOW_DEMO_LINKS is TRUE,
   * so the failure message says exactly that rather than a bare error.

      '&ldquo;why did I not get a room&rdquo;.</p>' +

              '<button class="btn ghost sm" onclick="demoLink(&quot;' +
              esc(r.appId) + '&quot;)">Preview link</button></td></tr>';

            '<ul class="reasons">' + g.items.map(function (i) {
              return '<li class="' + (i.ok ? 'yes' : 'no') + '"><span class="mk">' +
                (i.ok ? '&#10003;' : '&#10007;') + '</span><span>' + esc(i.text) + '</span></li>';
            }).join('') + '</ul></div>';
        }).join('');

      ', year ' + esc(v.student.year) + ' &middot; ' +
