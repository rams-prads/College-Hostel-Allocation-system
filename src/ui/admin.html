  function closeStudentView() { setHtml('studentView', ''); }

  /* ==================================================== what-if simulator */
  function loadSimulator() {
    setHtml('simCard', card('What-if simulator', loadingState('Loading policy settings')));
    srv().withSuccessHandler(function (k) { KNOBS = k; paintSimulator(); })
      .withFailureHandler(function () { setHtml('simCard', ''); }).apiAdminSimulatorKnobs();
  }

  function paintSimulator() {
    var groups = { reservation: [], weight: [], eligibility: [], capacity: [] };
    KNOBS.forEach(function (k, i) { if (groups[k.category]) groups[k.category].push({ k: k, i: i }); });

    var titles = {
      reservation: 'Reserved places', weight: 'What the merit score rewards',
      eligibility: 'Who may apply', capacity: 'Capacity'
    };

    var sections = Object.keys(groups).filter(function (g) { return groups[g].length; })
      .map(function (g) {
        var rows = groups[g].map(function (x) {
          var key = x.k.category + '|' + x.k.key;
          var pending = PENDING[key];
          var val = pending !== undefined ? pending : x.k.value;
          var changed = pending !== undefined && Number(pending) !== Number(x.k.value);
          return '<tr><td><strong>' + esc(x.k.label) + '</strong>' +
            '<div class="muted small">' + esc(x.k.help) + '</div></td>' +
            '<td style="width:120px"><input type="number" step="' + esc(x.k.step) +
              '" min="' + esc(x.k.min) + '" max="' + esc(x.k.max) + '" value="' + esc(val) +
              '" oninput="setKnob(' + x.i + ',this.value)"' +
              (changed ? ' style="border-color:var(--amber);font-weight:700"' : '') + '></td>' +
            '<td class="num small muted" style="width:80px">' +
              (changed ? 'was ' + esc(x.k.value) : '') + '</td></tr>';
        }).join('');
        return '<div class="grp-title" style="margin:16px 0 6px">' + esc(titles[g] || g) + '</div>' +
               '<div class="scroll-x"><table class="grid"><tbody>' + rows + '</tbody></table></div>';
      }).join('');

    var n = pendingChanges().length;
    setHtml('simCard', card('What-if simulator',
      '<p class="small muted" style="margin:0 0 4px">Change a rule and see the effect ' +
      '<strong>before</strong> committing to it. Nothing is saved until you press Commit &mdash; ' +
      'while the simulation runs, the changed rule exists only in memory.</p>' +
      '<div id="simMsg"></div>' + sections +
      '<div class="btn-row" style="margin-top:16px">' +
        '<button class="btn" id="simBtn" ' + (n ? '' : 'disabled') + ' onclick="runSim()">Simulate' +
          (n ? ' ' + n + ' change' + (n === 1 ? '' : 's') : '') + '</button>' +
        '<button class="btn ghost" onclick="resetKnobs()">Reset</button>' +
      '</div><div id="simResult"></div>'));
  }

  function setKnob(i, value) {
    PENDING[KNOBS[i].category + '|' + KNOBS[i].key] = value;
    var btn = el('simBtn');
    if (btn) {
      var n = pendingChanges().length;
      btn.disabled = !n;
      btn.textContent = 'Simulate' + (n ? ' ' + n + ' change' + (n === 1 ? '' : 's') : '');
    }
  }
  function resetKnobs() { PENDING = {}; paintSimulator(); }
  function pendingChanges() {
    return KNOBS.filter(function (k) {
      var v = PENDING[k.category + '|' + k.key];
      return v !== undefined && Number(v) !== Number(k.value);
    }).map(function (k) {
      return { category: k.category, key: k.key,
               value: Number(PENDING[k.category + '|' + k.key]) };
    });
  }

  function runSim() {
    var changes = pendingChanges();
    if (!changes.length) return;
    setHtml('simResult', '<div class="divider"></div>' +
      banner('info', 'Running two complete allocations so the difference is caused by your ' +
                     'change and nothing else…'));
    srv().withSuccessHandler(paintSimResult)
      .withFailureHandler(function (e) {
        setHtml('simResult', '<div class="divider"></div>' + banner('err', e.message));
      }).apiAdminSimulate(changes, null);
  }

  function delta(n, lowerIsBetter) {
    if (!n) return '<span class="muted">no change</span>';
    var good = lowerIsBetter ? n < 0 : n > 0;
    return '<span style="color:' + (good ? 'var(--ok)' : 'var(--bad)') + ';font-weight:700">' +
      (n > 0 ? '+' : '') + n + '</span>';
  }

  function paintSimResult(r) {
    var changeList = r.changes.map(function (c) {
      var k = KNOBS.filter(function (x) {
        return x.category === c.category && x.key === c.key; })[0];
      return '<li>' + esc(k ? k.label : c.key) + ': <strong>' + esc(c.from) +
             ' &rarr; ' + esc(c.to) + '</strong></li>';
    }).join('');

    var moves = r.sample.map(function (m) {
      var kind = { LOST: 'bad', GAINED: 'ok', MOVED: 'info' }[m.change];
      var word = { LOST: 'loses their room', GAINED: 'gains a room',
                   MOVED: 'changes room' }[m.change];
      return '<tr><td><strong>' + esc(m.name) + '</strong>' +
        '<div class="muted small">' + esc(label('category', m.category, m.category)) + '</div></td>' +
        '<td>' + pill(kind, word) + '</td>' +
        '<td class="muted small">' +
          (m.from ? esc(m.from.hostelName) + ' ' + esc(m.from.roomNo) : '&mdash;') +
          ' &rarr; ' + (m.to ? esc(m.to.hostelName) + ' ' + esc(m.to.roomNo) : '&mdash;') +
        '</td></tr>';
    }).join('');

    setHtml('simResult', '<div class="divider"></div>' +
      '<div class="grp-title">You are proposing</div>' +
      '<ul class="small" style="margin:0 0 14px;padding-left:20px">' + changeList + '</ul>' +
      '<div class="scroll-x"><table class="grid"><thead><tr><th>Measure</th>' +
      '<th class="num">Now</th><th class="num">After</th><th class="num">Change</th></tr></thead><tbody>' +
        simRow('Rooms allotted', r.before.allocated, r.after.allocated, r.deltas.allocated, false) +
        simRow('On waiting list', r.before.waitlisted, r.after.waitlisted, r.deltas.waitlisted, true) +
        simRow('Got their first choice (%)', r.before.pref1Pct, r.after.pref1Pct, r.deltas.pref1Pct, false) +
        simRow('Beds in use (%)', r.before.utilisationPct, r.after.utilisationPct, r.deltas.utilisationPct, false) +
        simRow('Roommate compatibility (%)', r.before.meanCompatPct, r.after.meanCompatPct, r.deltas.meanCompatPct, false) +
      '</tbody></table></div>' +

      '<div class="tiles" style="margin-top:15px">' +
        tile(r.movement.lost, 'lose their room', r.movement.lost ? 'bad' : '') +
        tile(r.movement.gained, 'gain a room', r.movement.gained ? 'good' : '') +
        tile(r.movement.moved, 'change room', '') +
        tile(r.movement.unchanged, 'unaffected', '') +
      '</div>' +

      (moves ? '<div class="grp-title" style="margin:18px 0 8px">Who this affects</div>' +
        '<div class="scroll-x"><table class="grid"><tbody>' + moves + '</tbody></table></div>' +
        '<p class="small muted" style="margin:9px 0 0">A sample. ' + esc(r.movement.totalAffected) +
        ' students are affected in total.</p>' : '') +

      '<div class="divider"></div>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="commitSim()">Commit this policy and reallocate</button>' +
        '<button class="btn ghost" onclick="resetKnobs()">Discard</button>' +
      '</div>' +
      '<p class="small muted" style="margin:10px 0 0">Nothing has been saved. Discarding leaves ' +
      'the current allocation exactly as it is.</p>');
  }

  function simRow(lbl, before, after, d, lowerIsBetter) {
    return '<tr><td>' + esc(lbl) + '</td><td class="num muted">' + esc(before) +
      '</td><td class="num"><strong>' + esc(after) + '</strong></td><td class="num">' +
      delta(d, lowerIsBetter) + '</td></tr>';
  }

  function commitSim() {
    var changes = pendingChanges();
    if (!confirm('Save these policy changes and run a real allocation? ' +
                 'This replaces the current result.')) return;
    busy('Saving policy and reallocating…');
    srv().withSuccessHandler(function (r) {
      done('good', 'Policy saved and rooms reallocated: ' + r.metrics.allocated +
        ' allotted, ' + r.metrics.waitlisted + ' on the waiting list.');
      PENDING = {};
      load({ kind: 'good', text: 'Policy committed and the allocation re-run against it.' });
    }).withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminCommitSimulation(changes, null);
  }

  function fillVacancies() {
    if (!confirm('Offer every empty bed to the waiting list? Students who are ' +
                 'allotted a room this way are moved off the list immediately. ' +
                 'Nobody already holding a room is affected.')) return;
    setHtml('vacMsg', banner('info', '<span class="spin"></span> Working through the empty beds'));
    srv('vacMsg').withSuccessHandler(function (r) {
      // load() carries {kind, text} through the redraw; a bare string arrives
      // as banner(undefined, undefined) and shows nothing at all.
      load({ kind: r.filled ? 'good' : 'warn', text: r.filled
        ? r.filled + ' bed' + (r.filled === 1 ? '' : 's') + ' filled from the waiting list. ' +
          (r.vacantAfter
            ? r.vacantAfter + ' still empty - nobody waiting is eligible for ' +
              (r.vacantAfter === 1 ? 'it' : 'them') + '.'
            : 'Every bed is now taken.')
        : 'No bed could be filled. ' + (r.vacantBefore
            ? 'The ' + r.vacantBefore + ' empty bed' + (r.vacantBefore === 1 ? '' : 's') +
              ' are in hostels no waiting applicant is eligible for.'
            : 'There are no empty beds.') });
    }).apiAdminFillVacancies(50);
  }

  /* ==================================================== verification console

     One applicant, one screen, one decision.

     What was here before was three lists - documents needing a decision, an
     identity queue, and a scan summary. Each was right on its own and the
     three together were unusable, because the unit of work in this job is a
     PERSON, not a document. An officer deciding a document could not see the
     identity it was meant to be matched against, and an applicant needing both
     was touched twice from two screens with nothing tying the two decisions
     together.

     The layout below is the one every review console converges on for the same
     reason: the evidence has to be beside the declaration it is evidence for,
     because comparing two things that are never on screen together is the
     slowest possible way to do this. */

  var V = {
    filter: 'NEEDS_DECISION',
    q: '',
    rows: [],
    counts: {},
    appId: null,
    kase: null,
    reasons: [],
    gate: null,
    seq: 0,
    reason: '',
    docTypes: null
  };

  function loadVerification() {
    if (!el('vQueue')) return;
    setHtml('vQueue', '<div style="padding:18px">' + loadingState('Reading the queue') + '</div>');
    srv('vStats').withSuccessHandler(function (d) {
      V.reasons = d.reasons || [];
      V.gate = d.gate || {};
      paintVStats(d.stats || {});
    }).apiAdminVerificationStats();
    loadVQueue();
  }

  function loadVQueue(keepCase) {
    var mine = ++V.seq;
    srv('vQueue').withSuccessHandler(function (d) {
      if (mine !== V.seq) return;
      V.rows = d.rows || [];
      V.counts = d.counts || {};
      paintVQueue();
      // Land on the first case rather than an empty panel. An officer opening
      // this tab wants to start work, not to choose where to start.
      if (!keepCase || !V.rows.some(function (r) { return r.appId === V.appId; })) {
        if (V.rows.length) openCase(V.rows[0].appId);
        else { V.kase = null; paintVCase(); }
      }
    }).apiAdminVerificationQueue({ filter: V.filter, q: V.q, limit: 200 });
  }

  function setVFilter(f) { V.filter = f; V.appId = null; loadVQueue(); }
  function vSearch() {
    V.q = (el('vQ') || {}).value || '';
    V.appId = null;
    loadVQueue();
  }

  /**
   * What is happening, in a sentence, and three numbers that can be pressed.
   *
   * It was five numbers in a row - waiting on you, waiting on the student,
   * decided, oldest still waiting, read and settled automatically - with
   * nothing saying what any of them counted or which of them was anybody's
   * problem. "0d" is meaningless when nothing is waiting; a percentage with no
   * denominator on screen is a number to be taken on trust.
   *
   * So: one plain sentence first, because there is only ever one thing an
   * officer opening this tab needs to know. Then three counts, each of which is
   * the button that shows you the applicants it counted - a number you can
   * press stops being a statistic and becomes a way in. The age of the oldest
   * case moved into the sentence, where it means something; the automation
   * figure moved next to the buttons that produce it.
   */
  function paintVStats(st) {
    var byState = st.byState || {};
    var todo = byState.NEEDS_DECISION || 0;
    var withStudent = byState.WAITING_ON_STUDENT || 0;
    var done = byState.DONE || 0;
    var flagged = V.counts && V.counts.FLAGGED ? V.counts.FLAGGED : 0;
    var gateOn = V.gate && V.gate.documents;

    // The one sentence. Written for somebody who has just opened the tab and
    // wants to know whether they can close it again.
    var lede;
    if (!todo) {
      lede = '<strong>Nothing is waiting on you right now.</strong> ' +
        (withStudent
          ? withStudent + ' applicant' + (withStudent === 1 ? ' has' : 's have') +
            ' still to send us something.'
          : 'Every application has been dealt with.');
    } else {
      lede = '<strong>' + todo + ' applicant' + (todo === 1 ? '' : 's') +
        ' need' + (todo === 1 ? 's' : '') + ' a decision from you.</strong>' +
        (st.oldestWaitingDays
          ? ' The one who has waited longest has been waiting ' +
            st.oldestWaitingDays + ' day' + (st.oldestWaitingDays === 1 ? '' : 's') + '.'
          : '') +
        (flagged ? ' ' + flagged + ' of them ' + (flagged === 1 ? 'is' : 'are') +
                   ' flagged for a closer look.' : '');
    }

    setHtml('vStats', card('',
      '<p style="margin:0 0 14px;font-size:14.5px;line-height:1.55">' + lede + '</p>' +

      '<div class="tiles wide" style="margin:0 0 14px">' +
        countTile(todo, 'Waiting on you',
          'Everything we asked for has arrived. You decide.',
          'NEEDS_DECISION', todo ? 'hi' : 'good') +
        countTile(withStudent, 'Waiting on students',
          'We are still waiting for a document from them.',
          'WAITING_ON_STUDENT', '') +
        countTile(done, 'Finished',
          'Checked and closed. Nothing more to do.',
          'DONE', 'good') +
      '</div>' +

      // The single setting that decides whether any of this work gates
      // anything. On the screen where the work happens, not three tabs away.
      '<div class="status ' + (gateOn ? 'good' : 'warn') + '">' +
        '<div class="sic">' + (gateOn ? '&#10003;' : '!') + '</div><div>' +
        '<div class="t">' + (gateOn
          ? 'A student cannot be given a room until you have checked them'
          : 'Students can be given rooms before you have checked them') + '</div>' +
        '<div class="s">' + (gateOn
          ? 'Anyone you have not verified is left out when the allocation runs.'
          : 'The allocation will give rooms to unchecked applicants and mark those ' +
            'seats provisional. That is usually right early on, when hardly anybody ' +
            'has been checked yet, and wrong once you have caught up.') + '</div></div>' +
        '<span class="grow" style="flex:1"></span>' +
        '<button class="btn ghost sm" onclick="setVGate(' + (gateOn ? 'false' : 'true') +
        ')">' + (gateOn ? 'Allow it again' : 'Require checking first') + '</button>' +
      '</div>' +
      '<div id="vGateMsg"></div>' +

      // The two actions that keep a person off most of the pile, with the
      // figure that says how much of it they took - beside them, where it is
      // about something, rather than alone in a tile as a bare percentage.
      ((st.unread || st.clearable)
        ? '<div class="btn-row" style="margin-top:13px">' +
            (st.unread
              ? '<button class="btn" onclick="runScans()">Read ' + st.unread +
                ' new document' + (st.unread === 1 ? '' : 's') + '</button>' : '') +
            (st.clearable
              ? '<button class="btn ghost" onclick="autoClear()">Accept the ' +
                st.clearable + ' that already match</button>' : '') +
          '</div>'
        : '') +
      (st.documents
        ? '<p class="small muted" style="margin:11px 0 0">The system has read ' +
          esc(st.read) + ' of the ' + esc(st.documents) + ' documents students have ' +
          'uploaded, and ' + esc(st.settledByMachinePct) + '% of them matched what the ' +
          'student declared &mdash; so nobody had to open those by hand.</p>'
        : '') +
      '<div id="vBulkMsg"></div>'));
  }

  /** A number, what it counts, and the button that shows you them. */
  function countTile(n, label, desc, filter, kind) {
    return '<button type="button" class="tile ' + (kind || '') +
      '" aria-current="' + (V.filter === filter) + '" ' +
      'onclick="setVFilter(&quot;' + filter + '&quot;)">' +
      '<span class="n">' + esc(n) + '</span>' +
      '<span class="l">' + esc(label) + '</span>' +
      '<span class="d">' + esc(desc) + '</span></button>';
  }

  function setVGate(on) {
    setHtml('vGateMsg', banner('info', 'Changing the rule\u2026'));
    srv('vGateMsg').withSuccessHandler(function () {
      load({ kind: 'good', text: on
        ? 'Allocation now requires verification. Unverified applicants are held out ' +
          'of the next run.'
        : 'Allocation no longer requires verification. Unverified applicants will be ' +
          'given provisional seats.' });
    }).apiAdminSetVerificationGate(on);
  }

  var VFILTERS = [
    ['NEEDS_DECISION', 'To do'],
    ['FLAGGED', 'Flagged'],
    ['WAITING_ON_STUDENT', 'With student'],
    ['DONE', 'Done'],
    ['ALL', 'All']
  ];

  function paintVQueue() {
    var tabs = VFILTERS.map(function (f) {
      var n = V.counts[f[0]] || 0;
      return '<button type="button" aria-pressed="' + (V.filter === f[0]) +
        '" onclick="setVFilter(&quot;' + f[0] + '&quot;)">' + esc(f[1]) +
        (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
    }).join('');

    var rows = V.rows.map(function (r) {
      var tags = [];
      if (r.riskLevel === 'HIGH') tags.push('<span class="tag bad">flagged</span>');
      else if (r.riskLevel === 'MEDIUM') tags.push('<span class="tag warn">check</span>');
      if (r.worstVerdict === 'CONFLICT') tags.push('<span class="tag bad">contradicts</span>');
      else if (r.worstVerdict === 'UNREADABLE') tags.push('<span class="tag warn">unreadable</span>');
      else if (r.worstVerdict === 'UNSCANNED') tags.push('<span class="tag">not read</span>');
      if (r.verifyStatus === 'VERIFIED') tags.push('<span class="tag ok">verified</span>');
      if (r.verifyStatus === 'REJECTED') tags.push('<span class="tag bad">rejected</span>');
      if (r.state === 'WAITING_ON_STUDENT') tags.push('<span class="tag warn">with student</span>');
      if (r.waitingDays >= 7) tags.push('<span class="tag warn">' + r.waitingDays + 'd</span>');

      return '<button type="button" aria-current="' + (V.appId === r.appId) +
        '" onclick="openCase(&quot;' + esc(r.appId) + '&quot;)">' +
        '<span class="who">' + esc(r.name) + '</span>' +
        '<span class="meta">' + esc(r.enrollmentNo) + ' &middot; ' + esc(r.programme) +
        ' year ' + esc(r.year) + '</span>' +
        (tags.length ? '<span class="tags">' + tags.join('') + '</span>' : '') +
        '</button>';
    }).join('');

    setHtml('vQueue',
      '<div class="vfilters">' + tabs + '</div>' +
      '<div class="vsearch"><input type="text" id="vQ" value="' + esc(V.q) + '" ' +
        'placeholder="Find a name or enrolment number" ' +
        'onkeydown="if(event.key===&quot;Enter&quot;)vSearch()"></div>' +
      '<div class="vlist" id="vList">' + (rows ||
        '<p class="small muted" style="padding:18px">Nothing in this list.</p>') + '</div>');
  }

  /* ------------------------------------------------------------- one case */

  function openCase(appId) {
    V.appId = appId;
    V.reason = '';
    V.docTypes = null;
    paintVQueue();
    setHtml('vCase', card('', loadingState('Opening the case')));
    srv('vCase').withSuccessHandler(function (k) {
      if (V.appId !== appId) return;      // they moved on while it loaded
      V.kase = k;
      paintVCase();
    }).apiAdminVerificationCase(appId);
  }

  function paintVCase() {
    var k = V.kase;
    if (!k) {
      setHtml('vCase', card('', emptyState('&#9989;', 'Nothing to decide',
        'No applicant in this list is waiting on you.')));
      return;
    }

    setHtml('vCase',
      '<div class="vcase">' +
        '<div class="full">' + caseHead(k) + '</div>' +
        '<div>' + declaredCard(k) + riskCard(k) + '</div>' +
        '<div>' + compareCard(k) + '</div>' +
        '<div class="full">' + evidenceCard(k) + '</div>' +
        '<div class="full">' + decideCard(k) + '</div>' +
      '</div>');
  }

  function caseHead(k) {
    var d = k.declared;
    var state = { VERIFIED: ['ok', 'Verified'], REJECTED: ['bad', 'Rejected'],
                  ACTION_REQUIRED: ['warn', 'Waiting on the student'],
                  PENDING: ['info', 'Not yet decided'] }[k.verifyStatus] ||
                  ['info', k.verifyStatus];

    return card('', '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:220px">' +
        '<h2 style="margin:0 0 3px;font-size:20px;letter-spacing:-.02em">' +
          esc(d.name) + '</h2>' +
        '<div class="small muted">' + esc(d.enrollmentNo) + ' &middot; ' + esc(d.programme) +
        (d.branch ? ' (' + esc(d.branch) + ')' : '') + ' &middot; year ' + esc(d.year) +
        ' &middot; ' + esc(label('campus', d.campus)) + '</div>' +
      '</div>' +
      pill(state[0], state[1]) +
      '</div>' +
      '<div class="vmeta" style="margin-top:10px">' +
        '<span>Applied ' + esc(k.submittedAt) + '</span>' +
        '<span>' + esc(k.waitingDays) + ' day' + (k.waitingDays === 1 ? '' : 's') +
          ' in the queue</span>' +
        '<span>' + esc(k.appId) + '</span>' +
        '<button class="btn ghost sm" onclick="goTab(&quot;students&quot;);viewStudent(&quot;' +
          esc(k.appId) + '&quot;)">Open their portal</button>' +
      '</div>' +
      (k.verifyNote ? '<p class="small" style="margin:9px 0 0">Last decision: ' +
        esc(k.verifyNote) + '</p>' : ''));
  }

  function declaredCard(k) {
    var d = k.declared;
    function row(label, value) {
      return value === '' || value === null || value === undefined ? '' :
        '<tr><th>' + esc(label) + '</th><td>' + esc(value) + '</td></tr>';
    }
    return card('What the applicant declared',
      '<table class="vfacts">' +
        row('Name', d.name) +
        row('Enrolment number', d.enrollmentNo) +
        row('Date of birth', d.dob) +
        row('Email', d.email) +
        row('Mobile', d.phone) +
        row('Category', label('category', d.category) + (d.isPwD ? ' \u00b7 PwD' : '')) +
        row('Admission category', label('residence', d.residenceCategory)) +
        row('Marks it is ranked on', d.meritPercent ? d.meritPercent + '%' : '') +
        row('Home address', [d.homeAddress, d.homeCity, d.homePincode]
              .filter(Boolean).join(', ')) +
        row('Distance from campus', d.distanceKm === null
              ? 'PIN code not in the reference table' : d.distanceKm + ' km') +
        row('Guardian', [d.guardianName, d.guardianPhone].filter(Boolean).join(' \u00b7 ')) +
        row('Aadhaar', k.identity.masked) +
      '</table>' +
      (d.selfDeclared
        ? '<p class="small muted" style="margin:11px 0 0">Every field here was typed by ' +
          'the applicant. None of it came from a university record.</p>'
        : ''));
  }

  function riskCard(k) {
    var f = k.risk.findings || [];
    var kind = { HIGH: 'bad', MEDIUM: 'warn', LOW: 'ok' }[k.risk.level] || '';
    return card('Automatic checks',
      '<div style="display:flex;gap:9px;align-items:center;margin:0 0 11px">' +
        pill(kind, k.risk.level === 'LOW' ? 'Nothing blocking'
          : (k.risk.level === 'HIGH' ? 'Needs attention' : 'Check carefully')) +
        '<span class="small muted">' + f.length + ' check' + (f.length === 1 ? '' : 's') +
        ' produced something to say</span>' +
      '</div>' +
      (f.length
        ? '<ul class="findings">' + f.map(function (x) {
            return '<li class="' + esc(String(x.severity).toLowerCase()) + '">' +
                   esc(x.text) + '</li>';
          }).join('') + '</ul>'
        : '<p class="small muted" style="margin:0">Nothing inconsistent was found ' +
          'between the declaration, the documents and every other application.</p>'));
  }

  function compareCard(k) {
    var c = k.comparisons || [];
    if (!c.length) {
      return card('Declared against the document',
        '<p class="small muted" style="margin:0">Nothing has been read from a document ' +
        'yet, so there is nothing to compare. ' +
        (k.ready.awaitingScan ? 'Press "Read the documents" above.' : '') + '</p>');
    }
    return card('Declared against the document',
      '<div class="vcompare">' + c.map(function (x) {
        var cls = x.ok ? 'yes' : (x.minor ? 'minor' : 'no');
        return '<div class="vcmp ' + cls + '">' +
          '<span class="f">' + esc(x.field) + '</span>' +
          '<span>' + esc(x.declared) + '</span>' +
          '<span class="mk">' + (x.ok ? '&#10003;' : (x.minor ? '&#8776;' : '&#10007;')) + '</span>' +
          '<span>' + esc(x.found) + '</span>' +
          (x.note ? '<span class="note">' + esc(x.note) + '</span>' : '') +
          '</div>';
      }).join('') + '</div>' +
      '<p class="small muted" style="margin:11px 0 0">Read from the document on the left, ' +
      'typed by the applicant on the right. A tick is the machine agreeing with them; it ' +
      'is not a decision, which is why you are here.</p>');
  }

  function evidenceCard(k) {
    var docs = (k.documents || []).filter(function (d) { return !!d.driveFileId; });
    var missing = k.missing || [];

    var body = docs.map(function (d) {
      var v = { CONFLICT: ['bad', 'Contradicts the declaration'],
                UNREADABLE: ['warn', 'Could not be read'],
                UNSCANNED: ['', 'Not read yet'],
                MINOR: ['ok', 'Differs immaterially'],
                MATCH: ['ok', 'Agrees'] }[d.scanVerdict] || ['', d.scanVerdict];
      var isPdf = /pdf/i.test(d.mimeType || '');

      return '<div class="vdoc">' +
        '<div class="vdhead"><span class="nm">' + esc(d.label) + '</span>' +
          pill(v[0], v[1]) +
          (d.status !== 'UPLOADED' ? pill(d.status === 'VERIFIED' ? 'ok' : 'bad',
            label('doc', d.status)) : '') +
          '<span class="grow"></span>' +
          '<span class="small muted">' + esc(d.uploadedAt) +
            (d.sizeKb ? ' &middot; ' + esc(d.sizeKb) + ' KB' : '') + '</span>' +
          '<a href="' + esc(d.openUrl) + '" target="_blank" rel="noopener noreferrer" ' +
          'class="small">Open in Drive</a>' +
        '</div>' +
        // The document, at a size a person can actually read, on the same
        // screen as the declaration it is being compared with. A link to
        // another tab is what made this job slow.
        (isPdf
          ? '<iframe class="frame" src="' + esc(d.previewUrl) + '" loading="lazy" ' +
            'title="' + esc(d.label) + '"></iframe>'
          : '<img class="shot" loading="lazy" src="' + esc(d.thumbUrl) + '" ' +
            'alt="' + esc(d.label) + '" ' +
            'onerror="this.outerHTML=&quot;<div class=\'none\'>The preview could not be ' +
            'loaded. Use &amp;quot;Open in Drive&amp;quot; above.</div>&quot;">') +
        (d.note ? '<p class="small muted" style="padding:9px 12px;margin:0">' +
          esc(d.note) + '</p>' : '') +
        '</div>';
    }).join('');

    return card('The evidence',
      (missing.length
        ? banner('warn', 'Still to be uploaded: ' +
            missing.map(function (m) { return m.label; }).join(', ') +
            '. The case cannot be verified until it arrives.')
        : '') +
      (body || '<p class="small muted" style="margin:0">Nothing has been uploaded yet.</p>'));
  }

  function decideCard(k) {
    var canVerify = k.ready.canDecide;
    var reasonOpts = V.reasons.map(function (r) {
      return '<option value="' + esc(r.code) + '"' +
        (V.reason === r.code ? ' selected' : '') + '>' + esc(r.label) + '</option>';
    }).join('');

    var docPicks = (k.documents || []).filter(function (d) { return !!d.driveFileId; })
      .map(function (d) {
        return '<label style="display:inline-flex;gap:6px;align-items:center;margin-right:14px">' +
          '<input type="checkbox" class="vdocpick" value="' + esc(d.docType) + '" ' +
          'style="width:auto" checked> <span class="small">' + esc(d.label) + '</span></label>';
      }).join('');

    return '<div class="vdecide" id="vDecide">' +
      '<div id="vMsg"></div>' +
      (canVerify ? '' : banner('warn',
        'Not everything asked for has been uploaded, so this case cannot be verified yet. ' +
        'You can still send it back or refuse it.')) +
      '<div class="btn-row" style="margin-bottom:11px">' +
        '<button class="btn" ' + (canVerify ? '' : 'disabled ') +
          'onclick="decideCase(&quot;VERIFY&quot;)">Verify</button>' +
        '<button class="btn ghost" onclick="decideCase(&quot;RESUBMIT&quot;)">' +
          'Ask for a better copy</button>' +
        '<button class="btn ghost" onclick="decideCase(&quot;REJECT&quot;)">Reject</button>' +
        '<button class="btn ghost" onclick="nextCase()">Skip</button>' +
        '<span class="vkeys"><kbd>A</kbd> verify &middot; <kbd>S</kbd> send back &middot; ' +
          '<kbd>R</kbd> reject &middot; <kbd>J</kbd>/<kbd>K</kbd> move</span>' +
      '</div>' +
      '<div class="fieldrow">' +
        '<label class="field" style="margin:0">' +
          '<span class="lab">Reason (for anything but Verify)</span>' +
          '<select id="vReason" onchange="V.reason=this.value">' +
            '<option value="">Choose\u2026</option>' + reasonOpts + '</select>' +
          '<span class="help">The student is shown a sentence written from this, so ' +
          'they know what to do next.</span></label>' +
        '<label class="field" style="margin:0"><span class="lab">Note (optional)</span>' +
          '<input type="text" id="vNote" placeholder="Anything the sentence above does not cover">' +
        '</label>' +
      '</div>' +
      (docPicks
        ? '<div style="margin-top:9px"><span class="small muted">Applies to: </span>' +
          docPicks + '</div>'
        : '') +
      '</div>';
  }

  function decideCase(verdict) {
    if (!V.kase) return;
    var reason = (el('vReason') || {}).value || '';
    var note = (el('vNote') || {}).value || '';

    if (verdict !== 'VERIFY' && !reason) {
      setHtml('vMsg', banner('err', 'Choose a reason first. The student is told what it ' +
        'says, so "rejected" on its own is not something they can act on.'));
      return;
    }
    if (verdict === 'REJECT' &&
        !confirm('Reject this application outright?\n\nThe applicant is refused a room. ' +
                 'Use "Ask for a better copy" if the problem is the photograph rather ' +
                 'than the person.')) return;

    var picks = [];
    var boxes = document.querySelectorAll('.vdocpick');
    for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) picks.push(boxes[i].value);

    var appId = V.kase.appId;
    setHtml('vMsg', banner('info', '<span class="spin"></span> Recording the decision'));

    srv('vMsg').withSuccessHandler(function (r) {
      // Straight on to the next one. Stopping to admire a confirmation after
      // every case is what turns a queue of two hundred into an afternoon.
      var note = r.verdict === 'VERIFY' ? 'Verified.' :
        (r.verdict === 'RESUBMIT' ? 'Sent back to the student.' : 'Rejected.');
      PENDING_VNOTE = note + (r.notified ? ' They have been emailed.' : '');
      nextCase(appId);
    }).apiAdminVerificationDecide(appId, verdict,
      { reason: reason, note: note, docTypes: picks });
  }

  var PENDING_VNOTE = '';

  /** Move to the next case in the list, dropping the one just decided. */
  function nextCase(decidedAppId) {
    var i = -1;
    for (var n = 0; n < V.rows.length; n++) if (V.rows[n].appId === V.appId) { i = n; break; }
    if (decidedAppId) {
      V.rows = V.rows.filter(function (r) { return r.appId !== decidedAppId; });
      if (i >= V.rows.length) i = V.rows.length - 1;
    } else {
      i = i + 1;
    }

    paintVQueue();
    if (i >= 0 && i < V.rows.length) openCase(V.rows[i].appId);
    else { V.kase = null; V.appId = null; paintVCase(); }

    if (PENDING_VNOTE) {
      setHtml('vMsg', banner('good', PENDING_VNOTE));
      PENDING_VNOTE = '';
    }
    // The counts moved, so the tabs above are now wrong.
    srv('vStats').withSuccessHandler(function (d) { paintVStats(d.stats || {}); })
      .apiAdminVerificationStats();
  }

  function prevCase() {
    for (var n = 0; n < V.rows.length; n++) {
      if (V.rows[n].appId === V.appId && n > 0) { openCase(V.rows[n - 1].appId); return; }
    }
  }

  /**
   * Keyboard, because a queue is measured in throughput and a hand that has to
   * find the mouse between every case halves it. Deliberately inert while
   * something is being typed into - an officer writing a note should not
   * approve the case by pressing A.
   */
  document.addEventListener('keydown', function (e) {
    if (TAB !== 'verification' || !V.kase) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;

    var k = String(e.key || '').toLowerCase();
    if (k === 'a') { e.preventDefault(); decideCase('VERIFY'); }
    else if (k === 's') { e.preventDefault(); decideCase('RESUBMIT'); }
    else if (k === 'r') { e.preventDefault(); decideCase('REJECT'); }
    else if (k === 'j') { e.preventDefault(); nextCase(); }
    else if (k === 'k') { e.preventDefault(); prevCase(); }
  });

  /* ========================================================== waiting list */

  // Which page is open and what is being searched for, kept out here so a
  // redraw does not throw an officer back to page one of a list they were
  // eighteen pages into.
  // `seq` rises with every request. Pressing Next twice in a row starts two
  // calls, and there is nothing to say they come back in the order they went
  // out - so an older answer arriving second would leave the table showing a
  // page the pager underneath it says you are not on.
  var WL = { page: 1, q: '', seq: 0 };

  function loadWaitlist() {
    if (!el('wlCard')) return;
    var mine = ++WL.seq;
    setHtml('wlCard', card('Waiting list', loadingState('Reading the queue')));
    srv('wlCard').withSuccessHandler(function (d) { paintWaitlistIfCurrent(mine, d); })
      .apiAdminWaitlist({ page: WL.page, pageSize: 25, q: WL.q });
  }

  /** Paint, unless a later request has gone out since this one was sent. */
  function paintWaitlistIfCurrent(seq, d) {
    if (seq !== WL.seq) return;
    paintWaitlist(d);
  }

  function wlGo(page) {
    WL.page = Math.max(1, page);
    loadWaitlist();
  }

  function wlSearch() {
    WL.q = (el('wlQ') || {}).value || '';
    WL.page = 1;
    loadWaitlist();
  }

  function wlClear() {
    WL.q = '';
    WL.page = 1;
    loadWaitlist();
  }

  function paintWaitlist(d) {
    if (!d || !d.rows) {
      setHtml('wlCard', card('Waiting list',
        banner('warn', 'The waiting list could not be read. Nothing else on this page ' +
                       'is affected.')));
      return;
    }
    WL.page = d.page;

    var search =
      '<div class="btn-row" style="margin:0 0 14px">' +
      '<input type="text" id="wlQ" value="' + esc(d.q || '') + '" ' +
      'placeholder="Find a name, enrolment number or application id" ' +
      'style="flex:1;min-width:230px" onkeydown="if(event.key===&quot;Enter&quot;)wlSearch()">' +
      '<button class="btn" onclick="wlSearch()">Find</button>' +
      (d.q ? '<button class="btn ghost" onclick="wlClear()">Show everyone</button>' : '') +
      '</div>';

    if (!d.total) {
      setHtml('wlCard', card('Waiting list',
        '<p class="muted small" style="margin:0">Nobody is on the waiting list. It is ' +
        'built when an allocation is committed.</p>'));
      return;
    }
    if (!d.matched) {
      setHtml('wlCard', card('Waiting list', search +
        '<p class="muted small" style="margin:0">Nothing on the waiting list matches ' +
        '&ldquo;' + esc(d.q) + '&rdquo;. ' + esc(d.total) + ' students are waiting.</p>'));
      return;
    }

    var rows = d.rows.map(function (w) {
      return '<tr>' +
        '<td class="num"><strong>' + esc(w.position) + '</strong></td>' +
        '<td><div>' + esc(w.name) + '</div>' +
          '<div class="small muted">' + esc(w.enrollmentNo) + '</div></td>' +
        '<td>' + esc(w.programme) + (w.year ? ' &middot; year ' + esc(w.year) : '') + '</td>' +
        // Not label('gender') - that map is written for HOSTELS, and calling a
        // student "Boys" in a table of people reads as a mistake.
        '<td>' + esc(label('campus', w.campus)) + ' &middot; ' +
          esc({ M: 'Male', F: 'Female', O: 'Other' }[w.gender] || w.gender) + '</td>' +
        '<td>' + esc(label('tier', w.tier, '—')) +
          '<div class="small muted">' + esc(label('category', w.category)) + '</div></td>' +
        '<td class="num">' + esc(Number(w.rankedOn).toFixed(2)) +
          '<span class="small muted"> ' + esc(w.rankedOnUnit) + '</span></td>' +
        '<td class="num">' + esc(w.etaPercent) + '%</td>' +
        '<td>' + esc(w.topChoice) + '</td>' +
        '<td><button class="btn ghost sm" onclick="goTab(&quot;students&quot;);' +
          'viewStudent(&quot;' + esc(w.appId) + '&quot;)">Open</button></td>' +
      '</tr>';
    }).join('');

    var from = (d.page - 1) * d.pageSize + 1;
    var to = from + d.rows.length - 1;

    var pager =
      '<div class="btn-row" style="margin:15px 0 0;align-items:center">' +
      '<button class="btn ghost sm" ' + (d.page <= 1 ? 'disabled' : '') +
        ' onclick="wlGo(' + (d.page - 1) + ')">&larr; Previous</button>' +
      '<button class="btn ghost sm" ' + (d.page >= d.pages ? 'disabled' : '') +
        ' onclick="wlGo(' + (d.page + 1) + ')">Next &rarr;</button>' +
      '<span class="small muted">Showing ' + esc(from) + '&ndash;' + esc(to) + ' of ' +
        esc(d.matched) + (d.q ? ' matching' : '') +
        ' &middot; page ' + esc(d.page) + ' of ' + esc(d.pages) + '</span>' +
      '</div>';

    setHtml('wlCard', card('Waiting list',
      '<p class="small muted" style="margin:0 0 14px">' + esc(d.total) + ' students are ' +
      'waiting, in the order they would be offered a seat if one is given up. The order is ' +
      'the priority group first and the measure inside it second &mdash; marks for the groups ' +
      'ranked on marks, distance for the Delhi category &mdash; which is why a lower figure ' +
      'can sit above a higher one.</p>' +
      search +
      '<div class="scroll-x"><table class="grid"><thead><tr>' +
        '<th class="num">#</th><th>Student</th><th>Programme</th><th>Campus</th>' +
        '<th>Priority group</th><th class="num">Ranked on</th><th class="num">Chance</th>' +
        '<th>First choice</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      pager));
  }

  /* ======================================================== grievances */
  function loadGrievances() {
    srv().withSuccessHandler(paintGrievances)
      .withFailureHandler(function () { setHtml('grievCard', ''); })
      .apiAdminGrievanceInbox(null, 40);
  }

  function paintGrievances(d) {
    if (!d || !d.stats) {
      setHtml('grievCard', card('Resident reports',
        banner('warn', 'The reports inbox could not be loaded. Everything else on ' +
                       'this page is unaffected.')));
      return;
    }
    var st = d.stats;
    if (!st.total) {
      setHtml('grievCard', card('Resident reports',
        '<p class="muted small" style="margin:0">Nothing has been reported.</p>'));
      return;
    }
    // Open and escalated first: those are the ones a person still owes an
    // answer to. Everything the triage already settled is listed after, so the
    // queue reads as work outstanding rather than a log.
    var OPEN_STATES = { OPEN: 1, ESCALATED: 1 };
    var live = d.tickets.filter(function (t) { return OPEN_STATES[t.status]; });
    var settled = d.tickets.filter(function (t) { return !OPEN_STATES[t.status]; });

    function ticketBlock(t, actionable) {
      var kind = { AUTO_ANSWERED: 'ok', RESOLVED: 'ok', ESCALATED: 'warn',
                   OPEN: 'info', CLOSED: '' }[t.status] || 'info';
      return '<div class="vrow">' +
        '<div class="vhead"><div>' +
          '<div class="vname">' + esc(t.name || 'Unknown student') + '</div>' +
          '<div class="small muted">' + esc(t.enrollmentNo || '') +
          (t.enrollmentNo ? ' &middot; ' : '') +
          esc(String(t.category).toLowerCase().replace(/_/g, ' ')) +
          ' &middot; ' + esc(t.ticketId) + '</div>' +
          // Where they live, on the line a warden reads first. A report about a
          // tap is not actionable without the room it is in.
          (t.roomNo ? '<div class="small" style="margin-top:3px"><strong>' +
            esc(t.hostelName) + '</strong> &middot; block ' + esc(t.block) +
            ' &middot; room ' + esc(t.roomNo) + '</div>' : '') +
        '</div>' + pill(kind, label('grievance', t.status)) + '</div>' +
        '<p class="small" style="margin:10px 0 0">' + esc(t.text) + '</p>' +
        (t.headline ? '<p class="small muted" style="margin:8px 0 0"><strong>Automatic ' +
          'check:</strong> ' + esc(t.headline) + '</p>' : '') +
        (t.anomalies && t.anomalies.length
          ? '<ul class="findings">' + t.anomalies.map(function (a) {
              return '<li class="block">' + esc(a) + '</li>'; }).join('') + '</ul>'
          : '') +
        '<div class="vmeta">' +
          (t.createdAt ? '<span>Raised ' + esc(t.createdAt) + '</span>' : '') +
          (t.slaDueAt ? '<span>Due ' + esc(t.slaDueAt) + '</span>' : '') +
          (t.appId ? '<span>' + esc(t.appId) + '</span>' : '') +
        '</div>' +
        (actionable
          ? '<div class="btn-row" style="margin-top:11px">' +
              '<button class="btn sm" onclick="resolveGrievance(&quot;' + esc(t.ticketId) +
                '&quot;)">Mark resolved</button>' +
              (t.status === 'ESCALATED' ? '' :
                '<button class="btn ghost sm" onclick="escalateGrievance(&quot;' +
                esc(t.ticketId) + '&quot;)">Escalate</button>') +
              (t.appId ? '<button class="btn ghost sm" onclick="goTab(&quot;students&quot;);' +
                'viewStudent(&quot;' + esc(t.appId) + '&quot;)">Open their portal</button>' : '') +
            '</div>'
          : (t.resolution ? '<p class="small muted" style="margin:9px 0 0"><strong>Closed:</strong> ' +
             esc(t.resolution) + '</p>' : ''));
    }

    setHtml('grievCard', card('Resident reports',
      '<div class="tiles" style="margin-bottom:15px">' +
        tile(st.total, 'reported', '') +
        tile(st.autoResolvedPct + '%', 'answered automatically', 'good') +
        tile(live.length, 'waiting on you', live.length ? 'hi' : '') +
      '</div>' +
      '<div id="grievMsg"></div>' +
      (live.length
        ? '<div class="grp-title" style="margin:4px 0 10px">Waiting on you</div>' +
          live.map(function (t) { return ticketBlock(t, true); }).join('')
        : banner('good', 'Nothing is waiting on you. Every complaint raised has either been ' +
                         'answered automatically or already closed.')) +
      (settled.length
        ? '<details class="tech" style="margin-top:14px"><summary>' + settled.length +
          ' already settled</summary><div style="margin-top:12px">' +
          settled.map(function (t) { return ticketBlock(t, false); }).join('') +
          '</div></details>'
        : '') +
      '<p class="small muted" style="margin:14px 0 0">A complaint about an allocation is ' +
      're-checked against the recorded run before any reply goes out, so one only reaches ' +
      '<em>waiting on you</em> when that check found something the machine could not settle.</p>'));
  }

  function resolveGrievance(ticketId) {
    var note = window.prompt('What was done? The student is shown this text.');
    if (note === null) return;
    if (!String(note).trim()) {
      setHtml('grievMsg', banner('err', 'A resolution needs a line saying what was done.'));
      return;
    }
    setHtml('grievCard', loadingState('Recording the resolution'));
    srv('grievCard').withSuccessHandler(function () { loadGrievances(); })
      .apiAdminResolveGrievance(ticketId, note);
  }

  function escalateGrievance(ticketId) {
    var note = window.prompt('Why is this being escalated? (optional)') || '';
    setHtml('grievCard', loadingState('Escalating'));
    srv('grievCard').withSuccessHandler(function () { loadGrievances(); })
      .apiAdminEscalateGrievance(ticketId, note);
  }

  /* ============================================================= swaps */
  function loadSwaps() {
    srv().withSuccessHandler(paintSwaps)
      .withFailureHandler(function () { setHtml('swapCard', ''); }).apiAdminSwapBoard();
  }

  function paintSwaps(d) {
    if (!d) { setHtml('swapCard', ''); return; }
    if (!d.total) {
      setHtml('swapCard', card('Room swaps',
        '<p class="muted small" style="margin:0">No swap requests yet.</p>'));
      return;
    }
    var rows = d.open.map(function (t) {
      return '<tr><td><strong>' + esc(t.name) + '</strong></td>' +
        '<td>' + esc(t.hostelName) + ' ' + esc(t.roomNo) + '</td>' +
        '<td class="muted small">' + esc(t.reason || '—') + '</td></tr>';
    }).join('');

    setHtml('swapCard', card('Room swaps',
      '<div class="tiles" style="margin-bottom:15px">' +
        tile(d.counts.APPROVED || 0, 'approved automatically', 'good') +
        tile(d.counts.OPEN || 0, 'listed on the board', '') +
        tile(d.counts.REJECTED || 0, 'refused by policy', '') +
      '</div>' +
      (rows ? '<div class="scroll-x"><table class="grid"><thead><tr><th>Student</th>' +
        '<th>Current room</th><th>Reason given</th></tr></thead><tbody>' + rows +
        '</tbody></table></div>' : '') +
      '<p class="small muted" style="margin:12px 0 0">Swaps both students agree to are checked ' +
      'against gender, accessibility and reservation rules and applied without an administrator. ' +
      'Nothing in this list is waiting on you.</p>'));
  }

  /* ======================================================== operations */
  function operationsCard(d) {
    // Running the allocation lives on its own tab now. Leaving a second copy of
    // the button here would mean two places to look for the same thing, and one
    // of them without the context that explains what it replaces.
    return card('Operations',
      '<div class="btn-row">' +
        '<button class="btn" onclick="letters()">Generate allotment letters</button>' +
        '<button class="btn ghost" onclick="notifyAll()">Send notifications</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="cols">' +
        '<div><div class="grp-title">Email</div>' +
          '<p class="small" style="margin:0">' + (d.email.enabled
            ? pill('ok', 'Sending is on') + ' &nbsp;' + esc(d.email.remainingQuota) +
              ' messages left today'
            : pill('warn', 'Sending is off') +
              ' &nbsp;safe for rehearsal &mdash; no student will be emailed') + '</p>' +
          '<p class="small muted" style="margin:7px 0 0">' + esc(d.email.sent) +
          ' sent so far, ' + esc(d.email.queued) + ' waiting.</p></div>' +
        '<div><div class="grp-title">Long tasks</div>' +
          '<p class="small muted" style="margin:0">Letters and emails are produced in batches so ' +
          'each run finishes well inside Google&rsquo;s time limit. Press the button again to ' +
          'continue where it stopped &mdash; nothing is ever sent or generated twice.</p></div>' +
      '</div>');
  }

  function busy(t) {
    setHtml('msg', '<div class="banner info"><span class="bic"><span class="spin"></span>' +
      '</span><span>' + esc(t) + '</span></div>');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function done(kind, t) { setHtml('msg', banner(kind, t)); }

  function runAllocation() {
    if (!confirm('Run the allocation and save the result? This replaces the previous one.')) return;
    busy('Allocating rooms for all applicants…');
    srv().withSuccessHandler(function (r) {
      load({ kind: 'good',
             text: 'Allocation complete: ' + r.metrics.summary.allocated +
                   ' rooms allotted, ' + r.metrics.summary.waitlisted +
                   ' on the waiting list, ' + r.converted + ' reserved places reissued.' });
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminRunAllocation({});
  }

  function clearAllocation() {
    if (!confirm('Clear the current allocation?\n\n' +
        'Every bed is emptied and every applicant goes back into the queue, ready for a ' +
        'fresh run. Letters already produced stop being valid and will be produced again. ' +
        'The record of what was decided stays in the ledger.')) return;
    busy('Clearing the allocation\u2026');
    srv().withSuccessHandler(function (r) {
      load({ kind: 'good',
             text: 'Cleared: ' + r.bedsFreed + ' beds freed, ' + r.allocationsRemoved +
                   ' allotments and ' + r.waitlistRemoved + ' waiting-list places removed, ' +
                   r.applicationsReset + ' applications back in the queue.' });
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminClearAllocation();
  }

  function preview() {
    busy('Running a preview — nothing will be saved…');
    srv().withSuccessHandler(function (r) {
      var m = r.metrics.summary;
      done('info', 'Preview only, nothing saved: ' + m.allocated + ' would be allotted, ' +
        m.waitlisted + ' on the waiting list, ' + m.pref1Pct + '% would get their first choice.');
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminPreviewAllocation({});
  }

  function letters() {
    busy('Producing allotment letters…');
    srv().withSuccessHandler(function (r) {
      load({ kind: r.remaining ? 'info' : 'good',
             text: 'Produced ' + r.generated + ' letter' + (r.generated === 1 ? '' : 's') +
                   (r.already ? ' (' + r.already + ' already existed and were skipped)' : '') +
                   '. ' + (r.remaining ? r.remaining + ' to go — press again to continue.'
                                       : 'All ' + r.total + ' are done.') });
    }).withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminGenerateLetters(null, 25);
  }

  function notifyAll() {
    busy('Sending notifications…');
    srv().withSuccessHandler(function (r) {
      done(r.failed ? 'err' : 'good',
        r.sent + ' sent, ' + r.queued + ' queued, ' + r.skipped + ' skipped' +
        (r.failed ? ', ' + r.failed + ' failed' : '') +
        (r.remaining ? ', ' + r.remaining + ' still to go' : '') + '.');
      load();
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminNotify(null, 50);
  }

  // ------------------------------------------------------- Wander rule book

  /**
   * What the assistant is allowed to answer from, and how to change it.
   *
   * Loading a brochure is two steps on purpose. Ingesting reads and chunks it;
   * embedding turns those chunks into something searchable, one batch at a
   * time, because several hundred embeddings do not reliably fit inside a
   * single six-minute execution. A job that dies halfway leaves work that can
   * be continued rather than a corpus half-replaced.
   */
  // A message that must outlive the repaint that follows it. Set it, call
  // loadRuleBook, and paintRuleBook shows it once on the other side.
  var RB_FLASH = '';

  function loadRuleBook() {
    setHtml('ruleBookCard', card('Hostel rule book', loadingState('Checking')));
    srv('ruleBookCard').withSuccessHandler(paintRuleBook)
      .apiAdminRuleBookStatus();
  }

  function paintRuleBook(s) {
    var rows = Object.keys(s.bySource || {}).sort().map(function (k) {
      return '<tr><td>' + esc(k) + '</td><td class="num">' + s.bySource[k] + '</td></tr>';
    }).join('');

    var state = !s.hasKey
      ? banner('warn', 'No Gemini API key yet. Add GEMINI_API_KEY in Project Settings \u203a ' +
                       'Script Properties before loading anything.')
      : (!s.enabled
        ? banner('info', 'The assistant is switched off. Set CHATBOT_ENABLED to TRUE in the ' +
                         'Config sheet when you are ready for students to use it.')
        : (s.pending
          ? banner('warn', s.pending + ' passages still need embedding before they can be found.')
          : banner('good', s.embedded + ' passages loaded and searchable.')));

    var trouble = s.lastError
      ? banner('warn', 'Last unanswered question (' + s.lastError.status + '): ' +
                       s.lastError.detail) +
        '<p class="small muted">Asked: &ldquo;' + esc(s.lastError.question) + '&rdquo;' +
        ' &middot; ' + s.errorCount + ' of ' + s.turnsLogged + ' logged turns did not answer' +
        '</p>'
      : (s.turnsLogged
          ? '<p class="small muted">' + s.turnsLogged + ' questions answered, none failed.</p>'
          : '');

    var body = state + trouble +
      '<div class="tiles" style="margin-top:12px">' +
        tile('Passages', s.total) +
        tile('Searchable', s.embedded) +
        tile('Awaiting embedding', s.pending) +
        tile('Questions left today', s.remainingToday) +
      '</div>' +
      (rows ? '<table class="rows" style="margin-top:12px"><tbody>' + rows + '</tbody></table>' : '') +

      '<div class="divider"></div>' +
      '<p class="small muted">Both brochures ship with the system. There is nothing to ' +
      'upload and no link to paste \u2014 one press loads them and makes them searchable, and ' +
      'each student is only ever answered from their own.</p>' +

      '<div id="rbMsg"></div>' +
      '<div class="btn-row">' +
        '<button class="btn primary" id="rbSetup">' +
          (s.total === 248 && !s.pending ? 'Rebuild the rule book' : 'Set up the rule book') +
        '</button>' +
      '</div>';

    setHtml('ruleBookCard', card('Hostel rule book', body,
      { sub: s.agent + ' answers only from this' }));

    if (RB_FLASH) { setHtml('rbMsg', RB_FLASH); RB_FLASH = ''; }

    el('rbSetup').onclick = function () { setUpRuleBook(); };
  }

  function setUpRuleBook() {
    var btn = el('rbSetup');
    if (btn) btn.disabled = true;

    var box = el('rbMsg');
    if (box) setHtml('rbMsg', loadingState('Loading the brochures'));

    srv('rbMsg').withSuccessHandler(function (r) {
      var m = el('rbMsg');
      if (m) setHtml('rbMsg', loadingState(r.chunks + ' passages loaded' +
        (r.reused ? ', ' + r.reused + ' already searchable' : '')));
      embedLoop();
    }).withFailureHandler(function (e) {
      if (btn) btn.disabled = false;
      var m = el('rbMsg');
      if (m) setHtml('rbMsg', banner('err', (e && e.message) || 'Could not load the rules.'));
    }).apiAdminReloadRuleBook();
  }

  function embedLoop() {
    var done = 0;
    var BATCH = 25;
    var gap = 7000;
    var GAP_MAX = 20000;

    function say(html) {
      var box = el('rbMsg');
      if (box) setHtml('rbMsg', html);
      return !!box;
    }

    function wait(ms, label, then) {
      var left = Math.ceil(ms / 1000);
      (function tick() {
        if (left <= 0) { then(); return; }
        say(loadingState(label + ' \u2014 resuming in ' + left + 's'));
        left--;
        setTimeout(tick, 1000);
      })();
    }

    say(loadingState('Embedding'));

    (function step() {
      srv('rbMsg').withSuccessHandler(function (r) {
        done += r.embedded;

        if (r.throttled) {
          gap = Math.min(gap + 3000, GAP_MAX);
          wait(r.retryAfterMs || 15000,
               'Google is pacing us \u2014 ' + done + ' passages done', step);
          return;
        }

        if (r.remaining) {
          wait(gap, 'Embedded ' + done + ', ' + r.remaining + ' to go', step);
          return;
        }

        RB_FLASH = banner('good', 'Embedded ' + done + ' passages. ' +
                                  'Wander can now answer from them.');
        loadRuleBook();
      }).withFailureHandler(function (e) {
        RB_FLASH = banner('err', (e && e.message) || 'Embedding failed.') +
          (done ? '<p class="small muted">' + done + ' passages were embedded before it ' +
                  'stopped, and they are saved. Pressing the button again continues from ' +
                  'there rather than starting over.</p>' : '');
        loadRuleBook();
      }).apiAdminEmbedChunks(BATCH);
    })();
  }
</script>
