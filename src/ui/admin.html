<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL = '<?= webAppUrl() ?>';
  var LOGO_URL   = '<?= logoUrl() ?>';
</script>

<div id="chrome"></div>
<div id="root"></div>

<script>
  document.body.classList.add('admin');

  var D = null, KNOBS = [], PENDING = {}, PENDING_NOTE = null;

  /* ================================================================ tabs
     One section open at a time. Everything below used to be stacked on a
     single page, which meant scrolling past six things to reach the seventh
     with no way to tell where you were or what still needed attention. */
  var TAB = 'overview';

  var ICON = {
    overview:    'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
    allocation:  'M4 20V10M10 20V4M16 20v-7M22 20H2',
    occupancy:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
    verification:'M9 12l2 2 4-4M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z',
    students:    'M12 3l9 5-9 5-9-5zM5 11v5c0 1 3 3 7 3s7-2 7-3v-5',
    requests:    'M4 5h16v12H8l-4 3z',
    policy:      'M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1M12 8a4 4 0 100 8 4 4 0 000-8z',
    operations:  'M13 2L4 14h6l-1 8 9-12h-6z'
  };

  var TABS = [
    { id: 'overview',     label: 'Overview',
      title: 'Overview', blurb: 'The state of this year\u2019s allocation at a glance.' },
    { id: 'allocation',   label: 'Allocation',
      title: 'Allocation', blurb: 'Run the allocation, and how fair the last one was.' },
    { id: 'occupancy',    label: 'Occupancy',
      title: 'Occupancy and vacancies', blurb: 'Where the beds are, and which are free.' },
    { id: 'verification', label: 'Verification',
      title: 'Verification', blurb: 'Documents that disagree with what was declared. ' +
                                    'Ordered by risk, not by arrival.' },
    { id: 'students',     label: 'Students',
      title: 'Students', blurb: 'Open any applicant\u2019s portal exactly as they see it.' },
    { id: 'requests',     label: 'Requests',
      title: 'Grievances and swaps', blurb: 'What students have asked for.' },
    { id: 'policy',       label: 'Policy',
      title: 'Policy', blurb: 'Change a rule and see who moves, before committing it.' },
    { id: 'operations',   label: 'Operations',
      title: 'Operations', blurb: 'Letters, notifications and the audit trail.' }
  ];

  /** Counts that belong on the rail, so an officer sees the work without hunting. */
  function tabCount(id, d) {
    if (id === 'verification') return Number(d && d.docQueue) || 0;
    return 0;
  }

  function sidebar(d) {
    return '<div class="arail-title">Sections</div><ul class="anav">' +
      TABS.map(function (t) {
        var n = tabCount(t.id, d);
        return '<li><button type="button" aria-current="' + (TAB === t.id) +
          '" onclick="goTab(&quot;' + t.id + '&quot;)">' +
          '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="' + ICON[t.id] + '"/></svg></span>' +
          '<span>' + esc(t.label) + '</span>' +
          (n ? '<span class="cnt">' + esc(n) + '</span>' : '') +
          '</button></li>';
      }).join('') + '</ul>';
  }

  function goTab(id) {
    TAB = id;
    el('sidebar').innerHTML = sidebar(D);
    paintTab();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  loadToken();
  el('root').innerHTML = loadingState('Loading dashboard');

  /** Called by the shared sign-in panel once a session exists. */
  function onSignedIn() {
    el('root').innerHTML = loadingState('Loading dashboard');
    load();
  }

  /**
   * Re-fetch and redraw.
   *
   * `note` survives the redraw. Writing a confirmation and then calling load()
   * put the message into a #msg that the redraw immediately replaced, so the
   * admin pressed a button, waited, and saw nothing happen.
   */
  function load(note) {
    PENDING_NOTE = note || null;
    srv().withSuccessHandler(render).withFailureHandler(function (e) {
      // An unsigned visitor and a signed-in non-administrator both land here and
      // need different things: one needs a way in, the other needs telling.
      if (!SESSION.token && /sign in/i.test(e.message)) {
        paintChrome({ unit: 'Hostel Administration' });
        el('root').innerHTML = '<div class="wrap narrow">' +
          signInPanel('This page is for hostel administrators.') + '</div>';
        return;
      }
      el('root').innerHTML = '<div class="wrap">' + banner('err', e.message) + '</div>';
    }).apiAdminOverview();
  }
  load();

  function render(d) {
    D = d;
    paintChrome({
      unit: 'Hostel Administration',
      user: { name: d.admin.name || d.admin.email, role: d.admin.role.replace(/_/g, ' '),
              signOut: !!SESSION.token },
      tabs: [{ label: 'Student View', href: '?' }]
    });

    el('root').innerHTML =
      '<div class="ashell">' +
        '<aside class="asidebar" id="sidebar">' + sidebar(d) + '</aside>' +
        '<main class="amain"><div id="msg"></div><div id="tabBody"></div></main>' +
      '</div>';

    paintTab();

    if (PENDING_NOTE) {
      el('msg').innerHTML = banner(PENDING_NOTE.kind, PENDING_NOTE.text);
      PENDING_NOTE = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  /**
   * Draw the open section, and fetch only what that section needs.
   *
   * Loading all six panels on every visit meant six round trips before the
   * page settled, five of them for things nobody was looking at.
   */
  function paintTab() {
    var d = D;
    var meta = TABS.filter(function (t) { return t.id === TAB; })[0] || TABS[0];
    var m = d.latestRun && d.latestRun.metrics ? d.latestRun.metrics.summary : null;

    var body = '';
    if (TAB === 'overview') {
      body = summaryBand(d) + pipelineCard(d) + ledgerCard(d);
    } else if (TAB === 'allocation') {
      body = runCard(d) + (m ? metricsCard(d, m) : noRunCard()) +
             (m ? quotaCard(d.latestRun.metrics) : '');
    } else if (TAB === 'occupancy') {
      body = occupancyCard(d);
    } else if (TAB === 'verification') {
      body = '<div id="scanCard"></div><div id="queueCard"></div><div id="idCard"></div>';
    } else if (TAB === 'students') {
      body = lookupCard();
    } else if (TAB === 'requests') {
      body = '<div id="grievCard"></div><div id="swapCard"></div>';
    } else if (TAB === 'policy') {
      body = '<div id="simCard"></div>';
    } else if (TAB === 'operations') {
      body = operationsCard(d);
    }

    el('tabBody').innerHTML =
      '<div class="apagehead"><h1>' + esc(meta.title) + '</h1>' +
      '<p>' + esc(meta.blurb) +
      (TAB === 'allocation' && d.latestRun && d.latestRun.finishedAt
        ? ' Last run ' + esc(d.latestRun.finishedAt) + '.' : '') +
      '</p></div>' + body;

    if (TAB === 'overview')     { loadLedgerBadge(); }
    if (TAB === 'verification') { loadScans(); loadDocQueue(); loadIdentity(); }
    if (TAB === 'requests')     { loadGrievances(); loadSwaps(); }
    if (TAB === 'policy')       { loadSimulator(); }
  }

  /** The buttons that actually start a run, lifted out of Operations. */
  function runCard(d) {
    return card('Run the allocation',
      '<p class="small muted" style="margin:0 0 13px">A preview changes nothing and is ' +
      'the safe way to see what a run would do. Committing replaces the previous ' +
      'result and is recorded in the ledger.</p>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="runAllocation()">Run and save</button>' +
        '<button class="btn ghost" onclick="preview()">Preview only</button>' +
        (Number((d.counts || {}).allotted) > 0
          ? '<button class="btn ghost" onclick="clearAllocation()">Clear the current one</button>'
          : '') +
      '</div>' +
      (Number((d.counts || {}).allotted) > 0
        ? '<p class="small muted" style="margin:12px 0 0">Clearing empties every bed and puts ' +
          'each applicant back in the queue. The record of what was decided stays in the ' +
          'ledger &mdash; only the outcome is undone.</p>'
        : ''));
  }

  /* -------------------------------------------------- document reading */
  function loadScans() {
    srv().withSuccessHandler(paintScans)
      .withFailureHandler(function () { el('scanCard').innerHTML = ''; })
      .apiAdminVerificationSummary();
  }

  function paintScans(s) {
    if (!s || !s.total) {
      // Say what this will do before there is anything to do it to. An officer
      // meeting the panel for the first time should learn what the machine
      // checks and what it leaves to them.
      el('scanCard').innerHTML = card('Document reading',
        '<p class="small muted" style="margin:0">No documents have been uploaded yet. ' +
        'When they are, each Aadhaar card is read and its PIN code compared with the ' +
        'one declared &mdash; that is the field distance and eligibility are computed ' +
        'from. A difference is only raised when it would change the outcome; everything ' +
        'else is recorded and left alone.</p>');
      return;
    }
    var v = s.byVerdict || {};
    var settled = (v.MATCH || 0) + (v.MINOR || 0);

    el('scanCard').innerHTML = card('Document reading',
      '<p class="small muted" style="margin:0 0 14px">Each Aadhaar card is read and its ' +
      'PIN code compared with the one declared &mdash; that is the field distance and ' +
      'eligibility are computed from. A difference is only raised when it would change ' +
      'the outcome.</p>' +
      '<div class="tiles" style="margin-bottom:14px">' +
        tile(s.total, 'Documents held', '') +
        tile(settled, 'Agree with the declaration', settled ? 'good' : '') +
        tile(v.CONFLICT || 0, 'Contradict it', (v.CONFLICT ? 'hi' : '')) +
        tile(v.UNREADABLE || 0, 'Could not be read', (v.UNREADABLE ? 'hi' : '')) +
        tile(s.unscanned, 'Not read yet', s.unscanned ? 'hi' : '') +
      '</div>' +
      '<div class="status ' + (s.needsPerson ? 'warn' : 'good') + '">' +
        '<div class="sic">' + (s.needsPerson ? '!' : '&#10003;') + '</div>' +
        '<div><div class="t">' + (s.needsPerson
          ? s.needsPerson + ' document' + (s.needsPerson === 1 ? '' : 's') + ' need you'
          : 'Nothing is waiting on a person') + '</div>' +
        '<div class="s">' + (s.needsPerson
          ? 'Out of ' + s.total + '. The rest either agree with what was declared or ' +
            'differ by too little to matter.'
          : 'Every document held has been read and agrees with its declaration.') +
        '</div></div></div>' +
      '<div class="btn-row" style="margin-top:13px">' +
        (s.unscanned
          ? '<button class="btn" onclick="runScans()">Read ' + s.unscanned + ' document' +
            (s.unscanned === 1 ? '' : 's') + '</button>' : '') +
        (s.clearable
          ? '<button class="btn ghost" onclick="autoClear()">Clear the ' + s.clearable +
            ' that agree</button>' : '') +
      '</div><div id="scanMsg"></div>');
  }

  function runScans() {
    el('scanMsg').innerHTML = '<div class="hint"><span class="spin"></span> ' +
      'Reading documents. This takes a few seconds each and continues in batches.</div>';
    srv().withSuccessHandler(function (r) {
        el('scanMsg').innerHTML = banner(r.remaining ? 'info' : 'good',
          'Read ' + r.scanned + '. ' + (r.remaining
            ? r.remaining + ' still to go — press the button again to continue.'
            : 'All documents have now been read.'));
        loadScans();
      })
      .withFailureHandler(function (e) { el('scanMsg').innerHTML = banner('err', e.message); })
      .apiAdminScanDocuments(25);
  }

  function autoClear() {
    if (!window.confirm('Mark every document that agrees with its declaration as verified?\n\n' +
        'Conflicts and unreadable scans are left alone. Each one is recorded as a machine ' +
        'decision, not a person\u2019s.')) return;
    el('scanMsg').innerHTML = loadingState('Clearing');
    srv('scanMsg').withSuccessHandler(function (r) {
        load({ kind: 'good',
               text: 'Verified ' + r.cleared + ' document' + (r.cleared === 1 ? '' : 's') +
                     ' across ' + r.applications + ' application' +
                     (r.applications === 1 ? '' : 's') + '. Conflicts were left alone.' });
      })
      .withFailureHandler(function (e) { el('scanMsg').innerHTML = banner('err', e.message); })
      .apiAdminAutoClear();
  }

  /* ------------------------------------------------ the document queue */

  /**
   * The documents themselves, worst first.
   *
   * apiAdminDocQueue has existed since Phase 4 and no page ever rendered it, so
   * the only way to act on a single document was to edit the sheet by hand.
   */
  function loadDocQueue() {
    srv().withSuccessHandler(paintDocQueue)
      .withFailureHandler(function () { el('queueCard').innerHTML = ''; })
      .apiAdminDocQueue(40, true);
  }

  function paintDocQueue(rows) {
    if (!rows || !rows.length) {
      el('queueCard').innerHTML = card('Documents needing a decision',
        emptyState('&#9989;', 'Nothing waiting',
          'Every document held either agrees with its declaration or has already ' +
          'been decided.'));
      return;
    }

    var body = rows.map(function (r) {
      var kind = { HIGH: 'bad', MEDIUM: 'warn', LOW: 'ok' }[r.riskLevel] || '';
      var verdict = {
        CONFLICT:   ['bad',  'Contradicts the declaration'],
        UNREADABLE: ['warn', 'Could not be read'],
        UNSCANNED:  ['',     'Not read yet'],
        MINOR:      ['ok',   'Differs immaterially'],
        MATCH:      ['ok',   'Agrees']
      }[r.scanVerdict] || ['', r.scanVerdict];

      var findings = (r.findings || []).length
        ? '<ul class="findings">' + r.findings.map(function (f) {
            return '<li class="' + esc(String(f.severity).toLowerCase()) + '">' +
                   esc(f.text) + '</li>';
          }).join('') + '</ul>'
        : '<p class="small muted" style="margin:6px 0 0">Nothing inconsistent was found.</p>';

      return '<div class="vrow">' +
        '<div class="vhead"><div>' +
          '<div class="vname">' + esc(r.studentName) + '</div>' +
          '<div class="small muted">' + esc(r.label) + ' &middot; ' + esc(r.enrollmentNo) +
          (r.campus ? ' &middot; ' + esc(label('campus', r.campus)) : '') + '</div>' +
        '</div>' + pill(verdict[0], verdict[1]) + '</div>' +
        '<div class="vmeta">' +
          '<span>Uploaded ' + esc(r.uploadedAt) + '</span>' +
          (r.sizeKb ? '<span>' + esc(r.sizeKb) + ' KB</span>' : '') +
          (r.aadhaarMasked ? '<span>Aadhaar <strong>' + esc(r.aadhaarMasked) +
                             '</strong></span>' : '') +
          (r.driveFileId
            ? '<a href="https://drive.google.com/file/d/' + esc(r.driveFileId) +
              '/view" target="_blank" rel="noopener noreferrer">Open the document</a>' : '') +
        '</div>' + findings +
        '<div class="btn-row" style="margin-top:11px">' +
          '<button class="btn sm" onclick="decideDoc(&quot;' + esc(r.docId) +
            '&quot;,true)">Accept</button>' +
          '<button class="btn ghost sm" onclick="decideDoc(&quot;' + esc(r.docId) +
            '&quot;,false)">Reject</button>' +
        '</div></div>';
    }).join('');

    el('queueCard').innerHTML = card('Documents needing a decision',
      '<p class="small muted" style="margin:0 0 14px">' + rows.length + ' waiting, worst ' +
      'first. Anything that agreed with its declaration has been left out of this list ' +
      'entirely.</p>' + body);
  }

  function decideDoc(docId, approve) {
    var note = '';
    if (!approve) {
      note = window.prompt('Why is this being rejected? The student is shown this text.');
      if (note === null) return;
      if (!String(note).trim()) {
        el('msg').innerHTML = banner('err', 'A rejection needs a reason.');
        return;
      }
    }
    el('queueCard').innerHTML = loadingState('Recording the decision');
    srv('queueCard').withSuccessHandler(function () { loadDocQueue(); loadScans(); })
      .apiAdminDecideDocument(docId, approve, note);
  }

  /* ---------------------------------------------------- verification */
  function loadIdentity() {
    srv().withSuccessHandler(paintIdentity)
      .withFailureHandler(function () { el('idCard').innerHTML = ''; })
      .apiAdminIdentityQueue(40);
  }

  function paintIdentity(rows) {
    if (!rows || !rows.length) {
      el('idCard').innerHTML = card('Identity verification',
        emptyState('&#9989;', 'Nothing waiting',
          'No applicant is currently waiting on an identity check.'));
      return;
    }

    var body = rows.map(function (r) {
      var kind = { HIGH:'bad', MEDIUM:'warn', LOW:'ok' }[r.riskLevel] || '';
      var findings = (r.findings || []).length
        ? '<ul class="findings">' + r.findings.map(function (f) {
            return '<li class="' + esc(String(f.severity).toLowerCase()) + '">' +
                   esc(f.text) + '</li>';
          }).join('') + '</ul>'
        : '<p class="small muted" style="margin:6px 0 0">' +
          'Nothing inconsistent was found automatically.</p>';

      return '<div class="vrow">' +
        '<div class="vhead">' +
          '<div><div class="vname">' + esc(r.studentName) + '</div>' +
          '<div class="small muted">' + esc(r.enrollmentNo) + ' &middot; ' +
          esc(r.programme) + ' year ' + esc(r.year) + ' &middot; ' +
          esc(label('campus', r.campus)) + ' &middot; ' +
          esc(label('category', r.category)) + '</div></div>' +
          pill(kind, r.riskLevel === 'LOW' ? 'Low risk' : (r.riskLevel === 'HIGH'
            ? 'Needs attention' : 'Check carefully')) +
        '</div>' +
        '<div class="vmeta"><span>Aadhaar <strong>' + esc(r.aadhaarMasked) + '</strong></span>' +
        '<span>Declared ' + esc(r.submittedAt) + '</span>' +
        (r.docFolderUrl ? '<a href="' + esc(r.docFolderUrl) +
          '" target="_blank" rel="noopener noreferrer">Open documents</a>' : '') +
        '</div>' +
        findings +
        '<div class="btn-row" style="margin-top:11px">' +
          '<button class="btn sm" onclick="decideIdentity(&quot;' + esc(r.studentId) +
            '&quot;,true)">Verify</button>' +
          '<button class="btn ghost sm" onclick="decideIdentity(&quot;' + esc(r.studentId) +
            '&quot;,false)">Reject</button>' +
        '</div>' +
      '</div>';
    }).join('');

    el('idCard').innerHTML = card('Identity verification',
      '<p class="small muted" style="margin:0 0 14px">' + rows.length + ' waiting. Each ' +
      'Aadhaar number was checked for a valid checksum and against every other record ' +
      'before it reached you; only the last four digits are ever stored. Match those ' +
      'four against the uploaded Aadhaar card, then decide.</p>' + body);
  }

  function decideIdentity(studentId, approve) {
    var note = '';
    if (!approve) {
      note = window.prompt('Why is this being rejected? The student is shown this text.');
      if (note === null) return;
      if (!String(note).trim()) {
        el('msg').innerHTML = banner('err', 'A rejection needs a reason.');
        return;
      }
    } else {
      note = 'Matched against the uploaded documents.';
    }

    el('idCard').innerHTML = loadingState('Recording the decision');
    srv('idCard')
      .withSuccessHandler(function () { loadIdentity(); })
      .apiAdminDecideIdentity(studentId, approve, note);
  }

  function sect(title, note) {
    return '<div class="sect"><h2>' + esc(title) + '</h2>' +
           (note ? '<span class="note">' + esc(note) + '</span>' : '') + '</div>';
  }

  /* ------------------------------------------------------ summary band */
  function summaryBand(d) {
    var c = d.counts || {}, cap = d.capacity || {};
    return '<div class="tiles" style="margin-bottom:14px">' +
      tile(c.applications, 'Applications', '') +
      tile(c.allotted, 'Rooms allotted', 'good') +
      tile(c.waitlisted, 'On waiting list', c.waitlisted ? 'hi' : '') +
      tile(c.rejected, 'Not eligible', '') +
      tile(cap.vacant, 'Beds vacant', '') +
      tile(d.docQueue, 'Documents to check', d.docQueue ? 'hi' : '') +
    '</div>';
  }
  function tile(n, l, kind) {
    return '<div class="tile ' + (kind || '') + '"><div class="n">' + esc(n) +
           '</div><div class="l">' + esc(l) + '</div></div>';
  }

  /**
   * The lifecycle, in order, with the current step marked.
   *
   * An officer arriving at this dashboard for the first time - or a judge being
   * shown it - has no way to know that documents are verified before the
   * allocation runs and letters after it. Everything needed was on the page and
   * the ORDER was not, which is the part that matters.
   */
  function pipelineCard(d) {
    var c = d.counts || {};
    var applied = Number(c.applications) || 0;
    var allotted = Number(c.allotted) || 0;
    var toCheck = Number(d.docQueue) || 0;
    var letters = Number(d.lettersDone) || 0;

    var steps = [
      { t: 'Students apply',
        s: applied + ' application' + (applied === 1 ? '' : 's') + ' received',
        done: applied > 0, tab: null },
      { t: 'Documents are checked',
        s: toCheck ? toCheck + ' still need a person' : 'nothing outstanding',
        done: applied > 0 && toCheck === 0, tab: 'verification' },
      { t: 'Allocation runs',
        s: allotted ? allotted + ' rooms allotted' : 'not run yet',
        done: allotted > 0, tab: 'allocation' },
      { t: 'Letters and notices go out',
        s: letters ? letters + ' letters produced' : 'not produced yet',
        done: letters > 0, tab: 'operations' },
      { t: 'Students query the result',
        s: 'answered from the recorded run',
        done: allotted > 0, tab: 'requests' }
    ];

    // The first thing not done is the thing to do next.
    var nextAt = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { nextAt = i; break; } }

    var list = steps.map(function (st, i) {
      var state = st.done ? 'done' : (i === nextAt ? 'now' : '');
      return '<li class="' + state + '">' +
        '<span class="num">' + (st.done ? '&#10003;' : (i + 1)) + '</span>' +
        '<span class="pl"><span class="pt">' + esc(st.t) + '</span>' +
        '<span class="ps">' + esc(st.s) + '</span></span>' +
        (i === nextAt && st.tab
          ? '<button class="btn sm" onclick="goTab(&quot;' + st.tab + '&quot;)">Go</button>'
          : '') + '</li>';
    }).join('');

    return card('How a place is allotted',
      '<p class="small muted" style="margin:0 0 14px">The whole lifecycle, in order. ' +
      'The highlighted step is the one waiting on you.</p>' +
      '<ul class="pipeline">' + list + '</ul>');
  }

  /* ----------------------------------------------------------- ledger */
  function ledgerCard(d) {
    return card('Audit ledger',
      '<div id="ledgerBadge">' + loadingState('Verifying the chain') + '</div>' +
      '<div class="btn-row" style="margin-top:13px">' +
        '<button class="btn ghost sm" onclick="showLedger()">View recent activity</button>' +
      '</div><div id="ledgerDetail"></div>');
  }

  /**
   * Verifying re-hashes every row, so the badge arrives after the page rather
   * than holding it up. The page is useful without it; it is not useful blank.
   */
  function loadLedgerBadge() {
    srv('ledgerBadge').withSuccessHandler(function (v) {
      var ok = v && v.intact;
      el('ledgerBadge').innerHTML =
        '<div class="status ' + (ok ? 'good' : 'bad') + '">' +
        '<div class="sic">' + (ok ? '&#10003;' : '&#10007;') + '</div>' +
        '<div><div class="t">' + (ok ? 'Records intact' : 'Tampering detected') + '</div>' +
        '<div class="s">' + esc((v && v.reason) || '') + '</div></div></div>';
    }).apiAdminLedgerBadge();
  }

  function showLedger() {

  /* ----------------------------------------------------- student lookup */
  /**
   * A read-only link to one student's portal, for showing it on a device that

  function lookupCard() {
    return card('Look up a student',
      '<p class="small muted" style="margin:0 0 13px">Open any applicant&rsquo;s portal exactly as ' +
      'they see it, including the explanation of their own outcome. The fastest way to answer ' +
      '&ldquo;why did I not get a room&rdquo;.</p>' +
      '<label class="field" style="margin-bottom:10px">' +
      '<input type="text" id="lookupQ" placeholder="Search by name, enrolment number or reference" ' +
      'oninput="doLookup(this.value)" autocomplete="off"></label>' +
      '<div id="lookupResults"></div><div id="studentView"></div>');

    clearTimeout(lookupTimer);

      srv().withSuccessHandler(function (rows) {
        if (!rows.length) {
          el('lookupResults').innerHTML = '<p class="muted small">No match.</p>'; return;
        }
        el('lookupResults').innerHTML = '<div class="scroll-x"><table class="grid"><tbody>' +
          rows.map(function (r) {
            return '<tr><td><strong>' + esc(r.name) + '</strong>' +
              '<div class="muted small">' + esc(r.enrollmentNo) + ' &middot; ' +
              esc(r.programme) + ' &middot; ' + esc(label('category', r.category, r.category)) +
              '</div></td>' +
              '<td>' + pill('info', label('status', r.status)) + '</td>' +
              '<td class="num"><button class="btn ghost sm" onclick="viewStudent(&quot;' +
              esc(r.appId) + '&quot;)">Open portal</button> ' +
              '<button class="btn ghost sm" onclick="demoLink(&quot;' +
              esc(r.appId) + '&quot;)">Preview link</button></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).withFailureHandler(function () {}).apiAdminFindStudent(q);
    }, 250);
  }

  function viewStudent(appId) {
    el('studentView').innerHTML = loadingState('Opening');

    // spinner, not appear in the strip at the top of a page the reader has
    // already scrolled past.

      .apiGetStudentView(appId);
  }

      outcome = '<div class="status good"><div class="sic">&#10003;</div><div>' +
        '<div class="t">Room ' + esc(v.allocation.roomNo) + ' &middot; ' +
        esc(v.allocation.hostelName) + '</div><div class="s">' +
        (v.allocation.prefRankMet >= 1 ? 'Preference ' + esc(v.allocation.prefRankMet) + ' granted'
                                       : 'Assigned beyond stated preferences') +
        (v.allocation.isAccessible ? ' &middot; accessible room' : '') + '</div></div></div>';

      outcome = '<div class="status" style="background:var(--warn-soft);' +

        '<div class="sic" style="background:var(--warn);color:#fff">!</div><div>' +
        '<div class="t">Waiting list position ' + esc(v.waitlist.position) + '</div>' +
        '<div class="s">' + esc(v.waitlist.etaPercent) + '% estimated chance of allotment</div>' +
        '</div></div>';

      outcome = '<div class="status bad"><div class="sic">&#10007;</div><div><div class="t">' +

            '<ul class="reasons">' + g.items.map(function (i) {
              return '<li class="' + (i.ok ? 'yes' : 'no') + '"><span class="mk">' +
                (i.ok ? '&#10003;' : '&#10007;') + '</span><span>' + esc(i.text) + '</span></li>';
            }).join('') + '</ul></div>';
        }).join('');

      ' &middot; ' + esc(v.student.programme) + ' ' + esc(v.student.branch) +
      ', year ' + esc(v.student.year) + ' &middot; ' +
      esc(label('category', v.student.category, v.student.category)) +
      (v.student.isPwD ? ' (PwD)' : '') + ' &middot; ' + esc(v.student.homeState) + '</p>' +

  function closeStudentView() { el('studentView').innerHTML = ''; }

  /* ==================================================== what-if simulator */
  function loadSimulator() {
    el('simCard').innerHTML = card('What-if simulator', loadingState('Loading policy settings'));
    srv().withSuccessHandler(function (k) { KNOBS = k; paintSimulator(); })
      .withFailureHandler(function () { el('simCard').innerHTML = ''; }).apiAdminSimulatorKnobs();
  }

  function paintSimulator() {
    var groups = { reservation: [], weight: [], eligibility: [], capacity: [] };
    KNOBS.forEach(function (k, i) { if (groups[k.category]) groups[k.category].push({ k: k, i: i }); });

    var titles = {
      reservation: 'Reserved places', weight: 'What the merit score rewards',
      eligibility: 'Who may apply', capacity: 'Capacity'
    };

    var sections = Object.keys(groups).filter(function (g) { return groups[g].length; })
      .map(function (g) {
        var rows = groups[g].map(function (x) {
          var key = x.k.category + '|' + x.k.key;
          var pending = PENDING[key];
          var val = pending !== undefined ? pending : x.k.value;
          var changed = pending !== undefined && Number(pending) !== Number(x.k.value);
          return '<tr><td><strong>' + esc(x.k.label) + '</strong>' +
            '<div class="muted small">' + esc(x.k.help) + '</div></td>' +
            '<td style="width:120px"><input type="number" step="' + esc(x.k.step) +
              '" min="' + esc(x.k.min) + '" max="' + esc(x.k.max) + '" value="' + esc(val) +
              '" oninput="setKnob(' + x.i + ',this.value)"' +
              (changed ? ' style="border-color:var(--amber);font-weight:700"' : '') + '></td>' +
            '<td class="num small muted" style="width:80px">' +
              (changed ? 'was ' + esc(x.k.value) : '') + '</td></tr>';
        }).join('');
        return '<div class="grp-title" style="margin:16px 0 6px">' + esc(titles[g] || g) + '</div>' +
               '<div class="scroll-x"><table class="grid"><tbody>' + rows + '</tbody></table></div>';
      }).join('');

    var n = pendingChanges().length;
    el('simCard').innerHTML = card('What-if simulator',
      '<p class="small muted" style="margin:0 0 4px">Change a rule and see the effect ' +
      '<strong>before</strong> committing to it. Nothing is saved until you press Commit &mdash; ' +
      'while the simulation runs, the changed rule exists only in memory.</p>' +
      '<div id="simMsg"></div>' + sections +
      '<div class="btn-row" style="margin-top:16px">' +
        '<button class="btn" id="simBtn" ' + (n ? '' : 'disabled') + ' onclick="runSim()">Simulate' +
          (n ? ' ' + n + ' change' + (n === 1 ? '' : 's') : '') + '</button>' +
        '<button class="btn ghost" onclick="resetKnobs()">Reset</button>' +
      '</div><div id="simResult"></div>');
  }

  function setKnob(i, value) {
    PENDING[KNOBS[i].category + '|' + KNOBS[i].key] = value;
    var btn = el('simBtn');
    if (btn) {
      var n = pendingChanges().length;
      btn.disabled = !n;
      btn.textContent = 'Simulate' + (n ? ' ' + n + ' change' + (n === 1 ? '' : 's') : '');
    }
  }
  function resetKnobs() { PENDING = {}; paintSimulator(); }
  function pendingChanges() {
    return KNOBS.filter(function (k) {
      var v = PENDING[k.category + '|' + k.key];
      return v !== undefined && Number(v) !== Number(k.value);
    }).map(function (k) {
      return { category: k.category, key: k.key,
               value: Number(PENDING[k.category + '|' + k.key]) };
    });
  }

  function runSim() {
    var changes = pendingChanges();
    if (!changes.length) return;
    el('simResult').innerHTML = '<div class="divider"></div>' +
      banner('info', 'Running two complete allocations so the difference is caused by your ' +
                     'change and nothing else…');
    srv().withSuccessHandler(paintSimResult)
      .withFailureHandler(function (e) {
        el('simResult').innerHTML = '<div class="divider"></div>' + banner('err', e.message);
      }).apiAdminSimulate(changes, null);
  }

  function delta(n, lowerIsBetter) {
    if (!n) return '<span class="muted">no change</span>';
    var good = lowerIsBetter ? n < 0 : n > 0;
    return '<span style="color:' + (good ? 'var(--ok)' : 'var(--bad)') + ';font-weight:700">' +
      (n > 0 ? '+' : '') + n + '</span>';
  }

  function paintSimResult(r) {
    var changeList = r.changes.map(function (c) {
      var k = KNOBS.filter(function (x) {
        return x.category === c.category && x.key === c.key; })[0];
      return '<li>' + esc(k ? k.label : c.key) + ': <strong>' + esc(c.from) +
             ' &rarr; ' + esc(c.to) + '</strong></li>';
    }).join('');

    var moves = r.sample.map(function (m) {
      var kind = { LOST: 'bad', GAINED: 'ok', MOVED: 'info' }[m.change];
      var word = { LOST: 'loses their room', GAINED: 'gains a room',
                   MOVED: 'changes room' }[m.change];
      return '<tr><td><strong>' + esc(m.name) + '</strong>' +
        '<div class="muted small">' + esc(label('category', m.category, m.category)) + '</div></td>' +
        '<td>' + pill(kind, word) + '</td>' +
        '<td class="muted small">' +
          (m.from ? esc(m.from.hostelName) + ' ' + esc(m.from.roomNo) : '&mdash;') +
          ' &rarr; ' + (m.to ? esc(m.to.hostelName) + ' ' + esc(m.to.roomNo) : '&mdash;') +
        '</td></tr>';
    }).join('');

    el('simResult').innerHTML = '<div class="divider"></div>' +
      '<div class="grp-title">You are proposing</div>' +
      '<ul class="small" style="margin:0 0 14px;padding-left:20px">' + changeList + '</ul>' +
      '<div class="scroll-x"><table class="grid"><thead><tr><th>Measure</th>' +
      '<th class="num">Now</th><th class="num">After</th><th class="num">Change</th></tr></thead><tbody>' +
        simRow('Rooms allotted', r.before.allocated, r.after.allocated, r.deltas.allocated, false) +
        simRow('On waiting list', r.before.waitlisted, r.after.waitlisted, r.deltas.waitlisted, true) +
        simRow('Got their first choice (%)', r.before.pref1Pct, r.after.pref1Pct, r.deltas.pref1Pct, false) +
        simRow('Beds in use (%)', r.before.utilisationPct, r.after.utilisationPct, r.deltas.utilisationPct, false) +
        simRow('Roommate compatibility (%)', r.before.meanCompatPct, r.after.meanCompatPct, r.deltas.meanCompatPct, false) +
      '</tbody></table></div>' +

      '<div class="tiles" style="margin-top:15px">' +
        tile(r.movement.lost, 'lose their room', r.movement.lost ? 'bad' : '') +
        tile(r.movement.gained, 'gain a room', r.movement.gained ? 'good' : '') +
        tile(r.movement.moved, 'change room', '') +
        tile(r.movement.unchanged, 'unaffected', '') +
      '</div>' +

      (moves ? '<div class="grp-title" style="margin:18px 0 8px">Who this affects</div>' +
        '<div class="scroll-x"><table class="grid"><tbody>' + moves + '</tbody></table></div>' +
        '<p class="small muted" style="margin:9px 0 0">A sample. ' + esc(r.movement.totalAffected) +
        ' students are affected in total.</p>' : '') +

      '<div class="divider"></div>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="commitSim()">Commit this policy and reallocate</button>' +
        '<button class="btn ghost" onclick="resetKnobs()">Discard</button>' +
      '</div>' +
      '<p class="small muted" style="margin:10px 0 0">Nothing has been saved. Discarding leaves ' +
      'the current allocation exactly as it is.</p>';
  }

  function simRow(lbl, before, after, d, lowerIsBetter) {
    return '<tr><td>' + esc(lbl) + '</td><td class="num muted">' + esc(before) +
      '</td><td class="num"><strong>' + esc(after) + '</strong></td><td class="num">' +
      delta(d, lowerIsBetter) + '</td></tr>';
  }

  function commitSim() {
    var changes = pendingChanges();
    if (!confirm('Save these policy changes and run a real allocation? ' +
                 'This replaces the current result.')) return;
    busy('Saving policy and reallocating…');
    srv().withSuccessHandler(function (r) {
      done('good', 'Policy saved and rooms reallocated: ' + r.metrics.allocated +
        ' allotted, ' + r.metrics.waitlisted + ' on the waiting list.');
      PENDING = {};
      load({ kind: 'good', text: 'Policy committed and the allocation re-run against it.' });
    }).withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminCommitSimulation(changes, null);
  }

  /* ======================================================== grievances */
  function loadGrievances() {
    srv().withSuccessHandler(paintGrievances)
      .withFailureHandler(function () { el('grievCard').innerHTML = ''; })
      .apiAdminGrievanceInbox(null, 40);
  }

  function paintGrievances(d) {
    if (!d || !d.stats) {
      el('grievCard').innerHTML = card('Grievances',
        banner('warn', 'The grievance inbox could not be loaded. Everything else on ' +
                       'this page is unaffected.'));
      return;
    }
    var st = d.stats;
    if (!st.total) {
      el('grievCard').innerHTML = card('Grievances',
        '<p class="muted small" style="margin:0">No grievances have been raised.</p>');
      return;
    }
    // Open and escalated first: those are the ones a person still owes an
    // answer to. Everything the triage already settled is listed after, so the
    // queue reads as work outstanding rather than a log.
    var OPEN_STATES = { OPEN: 1, ESCALATED: 1 };
    var live = d.tickets.filter(function (t) { return OPEN_STATES[t.status]; });
    var settled = d.tickets.filter(function (t) { return !OPEN_STATES[t.status]; });

    function ticketBlock(t, actionable) {
      var kind = { AUTO_ANSWERED: 'ok', RESOLVED: 'ok', ESCALATED: 'warn',
                   OPEN: 'info', CLOSED: '' }[t.status] || 'info';
      return '<div class="vrow">' +
        '<div class="vhead"><div>' +
          '<div class="vname">' + esc(t.name || 'Unknown student') + '</div>' +
          '<div class="small muted">' + esc(t.enrollmentNo || '') +
          (t.enrollmentNo ? ' &middot; ' : '') +
          esc(String(t.category).toLowerCase().replace(/_/g, ' ')) +
          ' &middot; ' + esc(t.ticketId) + '</div>' +
        '</div>' + pill(kind, label('grievance', t.status)) + '</div>' +
        '<p class="small" style="margin:10px 0 0">' + esc(t.text) + '</p>' +
        (t.headline ? '<p class="small muted" style="margin:8px 0 0"><strong>Automatic ' +
          'check:</strong> ' + esc(t.headline) + '</p>' : '') +
        (t.anomalies && t.anomalies.length
          ? '<ul class="findings">' + t.anomalies.map(function (a) {
              return '<li class="block">' + esc(a) + '</li>'; }).join('') + '</ul>'
          : '') +
        '<div class="vmeta">' +
          (t.createdAt ? '<span>Raised ' + esc(t.createdAt) + '</span>' : '') +
          (t.slaDueAt ? '<span>Due ' + esc(t.slaDueAt) + '</span>' : '') +
          (t.appId ? '<span>' + esc(t.appId) + '</span>' : '') +
        '</div>' +
        (actionable
          ? '<div class="btn-row" style="margin-top:11px">' +
              '<button class="btn sm" onclick="resolveGrievance(&quot;' + esc(t.ticketId) +
                '&quot;)">Mark resolved</button>' +
              (t.status === 'ESCALATED' ? '' :
                '<button class="btn ghost sm" onclick="escalateGrievance(&quot;' +
                esc(t.ticketId) + '&quot;)">Escalate</button>') +
              (t.appId ? '<button class="btn ghost sm" onclick="goTab(&quot;students&quot;);' +
                'viewStudent(&quot;' + esc(t.appId) + '&quot;)">Open their portal</button>' : '') +
            '</div>'
          : (t.resolution ? '<p class="small muted" style="margin:9px 0 0"><strong>Closed:</strong> ' +
             esc(t.resolution) + '</p>' : ''));
    }

    el('grievCard').innerHTML = card('Grievances',
      '<div class="tiles" style="margin-bottom:15px">' +
        tile(st.total, 'raised', '') +
        tile(st.autoResolvedPct + '%', 'answered automatically', 'good') +
        tile(live.length, 'waiting on you', live.length ? 'hi' : '') +
      '</div>' +
      '<div id="grievMsg"></div>' +
      (live.length
        ? '<div class="grp-title" style="margin:4px 0 10px">Waiting on you</div>' +
          live.map(function (t) { return ticketBlock(t, true); }).join('')
        : banner('good', 'Nothing is waiting on you. Every complaint raised has either been ' +
                         'answered automatically or already closed.')) +
      (settled.length
        ? '<details class="tech" style="margin-top:14px"><summary>' + settled.length +
          ' already settled</summary><div style="margin-top:12px">' +
          settled.map(function (t) { return ticketBlock(t, false); }).join('') +
          '</div></details>'
        : '') +
      '<p class="small muted" style="margin:14px 0 0">A complaint about an allocation is ' +
      're-checked against the recorded run before any reply goes out, so one only reaches ' +
      '<em>waiting on you</em> when that check found something the machine could not settle.</p>');
  }

  function resolveGrievance(ticketId) {
    var note = window.prompt('What was done? The student is shown this text.');
    if (note === null) return;
    if (!String(note).trim()) {
      el('grievMsg').innerHTML = banner('err', 'A resolution needs a line saying what was done.');
      return;
    }
    el('grievCard').innerHTML = loadingState('Recording the resolution');
    srv('grievCard').withSuccessHandler(function () { loadGrievances(); })
      .apiAdminResolveGrievance(ticketId, note);
  }

  function escalateGrievance(ticketId) {
    var note = window.prompt('Why is this being escalated? (optional)') || '';
    el('grievCard').innerHTML = loadingState('Escalating');
    srv('grievCard').withSuccessHandler(function () { loadGrievances(); })
      .apiAdminEscalateGrievance(ticketId, note);
  }

  /* ============================================================= swaps */
  function loadSwaps() {
    srv().withSuccessHandler(paintSwaps)
      .withFailureHandler(function () { el('swapCard').innerHTML = ''; }).apiAdminSwapBoard();
  }

  function paintSwaps(d) {
    if (!d) { el('swapCard').innerHTML = ''; return; }
    if (!d.total) {
      el('swapCard').innerHTML = card('Room swaps',
        '<p class="muted small" style="margin:0">No swap requests yet.</p>');
      return;
    }
    var rows = d.open.map(function (t) {
      return '<tr><td><strong>' + esc(t.name) + '</strong></td>' +
        '<td>' + esc(t.hostelName) + ' ' + esc(t.roomNo) + '</td>' +
        '<td class="muted small">' + esc(t.reason || '—') + '</td></tr>';
    }).join('');

    el('swapCard').innerHTML = card('Room swaps',
      '<div class="tiles" style="margin-bottom:15px">' +
        tile(d.counts.APPROVED || 0, 'approved automatically', 'good') +
        tile(d.counts.OPEN || 0, 'listed on the board', '') +
        tile(d.counts.REJECTED || 0, 'refused by policy', '') +
      '</div>' +
      (rows ? '<div class="scroll-x"><table class="grid"><thead><tr><th>Student</th>' +
        '<th>Current room</th><th>Reason given</th></tr></thead><tbody>' + rows +
        '</tbody></table></div>' : '') +
      '<p class="small muted" style="margin:12px 0 0">Swaps both students agree to are checked ' +
      'against gender, accessibility and reservation rules and applied without an administrator. ' +
      'Nothing in this list is waiting on you.</p>');
  }

  /* ======================================================== operations */
  function operationsCard(d) {
    // Running the allocation lives on its own tab now. Leaving a second copy of
    // the button here would mean two places to look for the same thing, and one
    // of them without the context that explains what it replaces.
    return card('Operations',
      '<div class="btn-row">' +
        '<button class="btn" onclick="letters()">Generate allotment letters</button>' +
        '<button class="btn ghost" onclick="notifyAll()">Send notifications</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="cols">' +
        '<div><div class="grp-title">Email</div>' +
          '<p class="small" style="margin:0">' + (d.email.enabled
            ? pill('ok', 'Sending is on') + ' &nbsp;' + esc(d.email.remainingQuota) +
              ' messages left today'
            : pill('warn', 'Sending is off') +
              ' &nbsp;safe for rehearsal &mdash; no student will be emailed') + '</p>' +
          '<p class="small muted" style="margin:7px 0 0">' + esc(d.email.sent) +
          ' sent so far, ' + esc(d.email.queued) + ' waiting.</p></div>' +
        '<div><div class="grp-title">Long tasks</div>' +
          '<p class="small muted" style="margin:0">Letters and emails are produced in batches so ' +
          'each run finishes well inside Google&rsquo;s time limit. Press the button again to ' +
          'continue where it stopped &mdash; nothing is ever sent or generated twice.</p></div>' +
      '</div>');
  }

  function busy(t) {
    el('msg').innerHTML = '<div class="banner info"><span class="bic"><span class="spin"></span>' +
      '</span><span>' + esc(t) + '</span></div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function done(kind, t) { el('msg').innerHTML = banner(kind, t); }

  function runAllocation() {
    if (!confirm('Run the allocation and save the result? This replaces the previous one.')) return;
    busy('Allocating rooms for all applicants…');
    srv().withSuccessHandler(function (r) {
      load({ kind: 'good',
             text: 'Allocation complete: ' + r.metrics.summary.allocated +
                   ' rooms allotted, ' + r.metrics.summary.waitlisted +
                   ' on the waiting list, ' + r.converted + ' reserved places reissued.' });
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminRunAllocation({});
  }

  function clearAllocation() {
    if (!confirm('Clear the current allocation?\n\n' +
        'Every bed is emptied and every applicant goes back into the queue, ready for a ' +
        'fresh run. Letters already produced stop being valid and will be produced again. ' +
        'The record of what was decided stays in the ledger.')) return;
    busy('Clearing the allocation\u2026');
    srv().withSuccessHandler(function (r) {
      load({ kind: 'good',
             text: 'Cleared: ' + r.bedsFreed + ' beds freed, ' + r.allocationsRemoved +
                   ' allotments and ' + r.waitlistRemoved + ' waiting-list places removed, ' +
                   r.applicationsReset + ' applications back in the queue.' });
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminClearAllocation();
  }

  function preview() {
    busy('Running a preview — nothing will be saved…');
    srv().withSuccessHandler(function (r) {
      var m = r.metrics.summary;
      done('info', 'Preview only, nothing saved: ' + m.allocated + ' would be allotted, ' +
        m.waitlisted + ' on the waiting list, ' + m.pref1Pct + '% would get their first choice.');
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminPreviewAllocation({});
  }

  function letters() {
    busy('Producing allotment letters…');
    srv().withSuccessHandler(function (r) {
      load({ kind: r.remaining ? 'info' : 'good',
             text: 'Produced ' + r.generated + ' letter' + (r.generated === 1 ? '' : 's') +
                   (r.already ? ' (' + r.already + ' already existed and were skipped)' : '') +
                   '. ' + (r.remaining ? r.remaining + ' to go — press again to continue.'
                                       : 'All ' + r.total + ' are done.') });
    }).withFailureHandler(function (e) { done('err', e.message); })
      .apiAdminGenerateLetters(null, 25);
  }

  function notifyAll() {
    busy('Sending notifications…');
    srv().withSuccessHandler(function (r) {
      done(r.failed ? 'err' : 'good',
        r.sent + ' sent, ' + r.queued + ' queued, ' + r.skipped + ' skipped' +
        (r.failed ? ', ' + r.failed + ' failed' : '') +
        (r.remaining ? ', ' + r.remaining + ' still to go' : '') + '.');
      load();
    }).withFailureHandler(function (e) { done('err', e.message); }).apiAdminNotify(null, 50);
  }
</script>
