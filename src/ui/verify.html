<!-- Public letter verification. Deliberately requires no sign-in: a warden at
     the hostel gate must be able to scan a letter and get an answer. -->
<?!= include('ui/styles'); ?>
<?!= include('ui/chrome'); ?>
<script>
  // The app is served inside a sandboxed iframe on a different origin, so a
  // relative link would navigate that frame to the wrong place. Every link is
  // built from this absolute URL and targets _top.
  var WEBAPP_URL    = '<?= webAppUrl() ?>';
  var LOGO_URL      = '<?= logoUrl() ?>';
  var SUPPORT_EMAIL = '<?= supportEmail() ?>';
</script>
<style>
  .verdict { border-radius: 11px; padding: 24px; text-align: center; margin-bottom: 15px; }
  .verdict.good { background: var(--ok-soft);  border: 2px solid var(--ok); }
  .verdict.bad  { background: var(--bad-soft); border: 2px solid var(--bad); }
  .verdict .icon { font-size: 42px; line-height: 1; }
  .verdict .t { font-size: 21px; font-weight: 700; margin-top: 7px; letter-spacing: -.01em; }
  .verdict.good .t, .verdict.good .icon { color: var(--ok); }
  .verdict.bad  .t, .verdict.bad  .icon { color: var(--bad); }
  .verdict .s { font-size: 14px; margin-top: 6px; color: var(--text); opacity: .85; }
</style>

<header class="top">
  <div class="inner"><div>
    <h1>Allotment Verification</h1>
    <div class="sub">GGSIPU Hostels</div>
  </div></div>
</header>

<div class="wrap" id="root"><div class="empty">Checking this letter&hellip;</div></div>

<script>
  paintChrome({ unit: 'Allotment Verification' });
  setHtml('root', loadingState('Checking this letter'));

  var P = <?!= JSON.stringify(params || {}) ?>;

  if (!P.id || !P.sig) {
    showManualEntry('Scan the QR code on an allotment letter, or type the code printed ' +
                    'beneath it.');
  } else {
    srv()
      .withSuccessHandler(show)
      .withFailureHandler(function (e) {
        setHtml('root', '<div class="banner err">' + esc(e.message) + '</div>');
      })
      .apiVerifyAllotment(P.id, P.sig);
  }

  /** Camera-free entry. A warden at a gate cannot be stopped by a bad photocopy. */
  function showManualEntry(intro, error) {
    setHtml('root', (error ? '<div class="banner err">' + esc(error) + '</div>' : '') +
      '<div class="card"><h2>Verify a letter</h2>' +
      '<p class="small muted" style="margin:-4px 0 12px">' + esc(intro) + '</p>' +
      '<label class="field"><span class="lab">Verification code</span>' +
      '<input type="text" id="codeInput" placeholder="ALC-RUN-…~a3f9c2d17b" ' +
      'autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      '<div class="btn-row"><button class="btn" onclick="checkCode()">Verify</button></div>' +
      '<p class="small muted" style="margin:11px 0 0">You can paste the whole line printed ' +
      'under the QR code, or just the code itself.</p></div>');
    var box = document.getElementById('codeInput');
    if (box) {
      box.focus();
      box.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkCode(); });
    }
  }

  function checkCode() {
    var v = (document.getElementById('codeInput') || {}).value || '';
    setHtml('root', '<div class="empty"><span class="spin"></span> Checking&hellip;</div>');
    srv()
      .withSuccessHandler(show)
      .withFailureHandler(function (e) { showManualEntry('Try again.', e.message); })
      .apiVerifyByCode(v);
  }

  function show(r) {
    if (!r.valid) {
      setHtml('root', '<div class="verdict bad"><div class="icon">&#10007;</div>' +
        '<div class="t">Not verified</div>' +
        '<div class="s">' + esc(r.reason) + '</div></div>' +
        '<div class="card"><p class="small muted" style="margin:0 0 12px">Do not accept this letter ' +
        'as proof of allotment. Refer the student to the hostel office.</p>' +
        '<div class="btn-row"><button class="btn ghost" onclick="showManualEntry(' +
        '&quot;Type or paste the code printed beneath the QR.&quot;)">Try another code</button>' +
        '</div></div>');
      return;
    }

    setHtml('root', '<div class="verdict good"><div class="icon">&#10003;</div>' +
      '<div class="t">Genuine allotment letter</div>' +
      '<div class="s">Verified ' + esc(r.checkedAt) + '</div></div>' +

      '<div class="card"><h2>Student</h2><dl class="kv">' +
        '<dt>Name</dt><dd>' + esc(r.studentName) + '</dd>' +
        '<dt>Enrolment no.</dt><dd>' + esc(r.enrollmentNo) + '</dd>' +
        '<dt>Programme</dt><dd>' + esc(r.programme) + '</dd>' +
      '</dl></div>' +

      '<div class="card"><h2>Accommodation</h2><dl class="kv">' +
        '<dt>Hostel</dt><dd>' + esc(r.hostel) + '</dd>' +
        '<dt>Campus</dt><dd>' + esc(r.campus) + '</dd>' +
        '<dt>Room</dt><dd>' + esc(r.roomNo) + ' (Block ' + esc(r.block) +
          ', Floor ' + esc(r.floor) + ')</dd>' +
        '<dt>Bed</dt><dd>' + esc(r.bedNo) + '</dd>' +
        '<dt>Warden</dt><dd>' + esc(r.warden) + '</dd>' +
        '<dt>Session</dt><dd>' + esc(r.session) + '</dd>' +
        '<dt>Allotted on</dt><dd>' + esc(r.allocatedAt) + '</dd>' +
        '<dt>Reference</dt><dd>' + esc(r.allocId) + '</dd>' +
      '</dl></div>' +

      '<div class="card"><p class="small muted" style="margin:0">This check confirms that the ' +
      'reference number carries a valid signature issued by the hostel allocation system, and ' +
      'that the allotment is still active. Confirm the student\'s identity separately against ' +
      'their photo ID.</p></div>');
  }
</script>
